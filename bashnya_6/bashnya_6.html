<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOWER 6 — Дворцовая АТС</title>
    <style>
        /* ... (ваши стили остаются без изменений, чтобы сохранить дизайн) ... */
        html,body{
            margin:0; width:100%; height:100%; overflow:hidden; background:#050607; color:white;
            font-family:Georgia,serif;
        }
        body{
            display:flex; align-items:center; justify-content:center;
            background:
                radial-gradient(circle at 50% 35%, rgba(255,255,255,0.18), transparent 28%),
                radial-gradient(circle at 30% 70%, rgba(120,170,255,0.14), transparent 35%),
                linear-gradient(180deg,#050607,#11131a 55%,#030304);
        }
        .room{
            width:min(820px,90vw); max-height:90vh; padding:32px 36px; box-sizing:border-box;
            border:1px solid rgba(255,255,255,0.22); border-radius:28px;
            background:rgba(0,0,0,0.34); box-shadow:0 0 70px rgba(170,210,255,0.18);
            text-align:center; position:relative; overflow-y:auto;
        }
        .ats-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            text-align: left;
        }
        .ats-section {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .ats-section h3 {
            color: #b8d0ff;
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            font-weight: normal;
            letter-spacing: 0.05em;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-online { background: #6fcf97; box-shadow: 0 0 12px #6fcf97; }
        .status-offline { background: #f28b82; box-shadow: 0 0 12px #f28b82; }
        .status-ringing { background: #f9ca24; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.95); }
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        .keypad button {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 12px 0;
            color: white;
            font-size: 22px;
            font-family: Georgia, serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .keypad button:hover {
            background: rgba(255,255,255,0.14);
            border-color: rgba(180,210,255,0.4);
            transform: scale(1.03);
        }
        .keypad button:active { transform: scale(0.95); }
        .call-btn {
            background: #2d7d46 !important;
            border-color: #3a9c5a !important;
        }
        .call-btn:hover { background: #3a9c5a !important; }
        .hangup-btn {
            background: #7d2d2d !important;
            border-color: #9c3a3a !important;
        }
        .hangup-btn:hover { background: #9c3a3a !important; }
        .phone-input {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            text-align: center;
            letter-spacing: 4px;
            font-family: Georgia, serif;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .call-log {
            max-height: 140px;
            overflow-y: auto;
            font-size: 14px;
            opacity: 0.8;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 10px;
            margin-top: 10px;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
        }
        .log-entry.incoming { color: #6fcf97; }
        .log-entry.outgoing { color: #aac8ff; }
        .log-entry.missed { color: #f28b82; }
        .back {
            display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.2); color: white; text-decoration:none;
            background:rgba(255,255,255,0.05); letter-spacing:0.08em; font-size:13px;
        }
        .back:hover{ background:rgba(255,255,255,0.14); }
        @media(max-width: 700px) {
            .ats-panel { grid-template-columns: 1fr; }
            .room { padding: 20px; }
        }
    </style>
</head>
<body>
<main class="room">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-size:14px; opacity:0.5;">⚜️ ДВОРЕЦ NEX</span>
        <span style="font-size:14px; opacity:0.5;">БАШНЯ 6 · АТС</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px; justify-content:center; margin-bottom:12px;">
        <div style="width:70px;height:70px; border-radius:50%; margin:0; background:radial-gradient(circle, rgba(255,255,255,0.96), rgba(190,220,255,0.36) 44%, transparent 70%); filter:blur(1px);"></div>
        <div>
            <h1 style="margin:0; font-size:32px; letter-spacing:0.1em;">TOWER 6</h1>
            <p style="margin:4px 0 0; font-size:14px; opacity:0.6;">дворцовая телефонная станция</p>
        </div>
        <div style="margin-left:auto; font-size:14px;">
            <span class="status-indicator status-offline" id="statusIndicator"></span>
            <span id="statusText">отключена</span>
        </div>
    </div>

    <div class="ats-panel">
        <div class="ats-section">
            <h3>📞 НАБОР</h3>
            <input class="phone-input" id="phoneInput" placeholder="номер">
            <div class="keypad">
                <button onclick="dial('1')">1</button>
                <button onclick="dial('2')">2</button>
                <button onclick="dial('3')">3</button>
                <button onclick="dial('4')">4</button>
                <button onclick="dial('5')">5</button>
                <button onclick="dial('6')">6</button>
                <button onclick="dial('7')">7</button>
                <button onclick="dial('8')">8</button>
                <button onclick="dial('9')">9</button>
                <button onclick="dial('*')">*</button>
                <button onclick="dial('0')">0</button>
                <button onclick="dial('#')">#</button>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="call-btn" style="flex:1; padding:12px; border:none; border-radius:10px; color:white; font-size:16px; cursor:pointer;" onclick="makeCall()">📤 Позвонить</button>
                <button class="hangup-btn" style="flex:1; padding:12px; border:none; border-radius:10px; color:white; font-size:16px; cursor:pointer;" onclick="hangUp()">📴 Сбросить</button>
            </div>
        </div>
        <div class="ats-section">
            <h3>📋 СОСТОЯНИЕ</h3>
            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
                <span style="background:rgba(255,255,255,0.05); padding:4px 12px; border-radius:16px;">
                    <span style="opacity:0.5;">внутр.</span> <strong id="internalExt">101</strong>
                </span>
                <span style="background:rgba(255,255,255,0.05); padding:4px 12px; border-radius:16px;">
                    <span style="opacity:0.5;">статус</span> <span id="callStatus">свободен</span>
                </span>
                <span style="background:rgba(255,255,255,0.05); padding:4px 12px; border-radius:16px;">
                    <span style="opacity:0.5;">время</span> <span id="callTimer">00:00</span>
                </span>
            </div>
            <h3 style="margin-top:16px; font-size:15px;">📜 ИСТОРИЯ</h3>
            <div class="call-log" id="callLog">
                <div class="log-entry" style="opacity:0.3; justify-content:center;">— вызовов пока нет —</div>
            </div>
        </div>
    </div>
    <div style="display:flex; gap:16px; justify-content:center; margin-top:16px; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,0.06); padding-top:16px;">
        <span style="font-size:13px; opacity:0.5;">ОПЕРАТОРЫ ДВОРЦА:</span>
        <span style="font-size:13px; background:rgba(255,255,255,0.04); padding:2px 14px; border-radius:12px;">🔹 Оператор 1 (вн. 101)</span>
        <span style="font-size:13px; background:rgba(255,255,255,0.04); padding:2px 14px; border-radius:12px;">🔹 Оператор 2 (вн. 102)</span>
        <span style="font-size:13px; opacity:0.4;">+3 резервных</span>
    </div>
    <a class="back" href="../index.html">← ВЕРНУТЬСЯ ВО ДВОРЕЦ</a>
</main>

<!-- Подключаем библиотеку SIP.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sip.js/0.21.0/sip-0.21.0.min.js"></script>

<script>
    // ================================================================
    // === НАСТРОЙКИ ДЛЯ ПОДКЛЮЧЕНИЯ (ЗАМЕНИТЕ НА СВОИ ДАННЫЕ) ===
    // ================================================================
    const SIP_CONFIG = {
        // Адрес WebSocket-сервера вашего провайдера (например, Zadarma)
        server: 'wss://pbx.zadarma.com:443', // Замените на ваш WSS-адрес
        // Ваш SIP-номер (URI) для регистрации
        aor: 'sip:1234-100@pbx.zadarma.com', // Замените на ваш номер
        // Ваш SIP-пароль
        password: 'YOUR_SIP_PASSWORD',      // Замените на ваш пароль
        // Ваше отображаемое имя
        displayName: 'Оператор Дворца'
    };
    // ================================================================
    // === КОНЕЦ НАСТРОЕК ===
    // ================================================================

    // Элементы интерфейса
    const phoneInput = document.getElementById('phoneInput');
    const callStatus = document.getElementById('callStatus');
    const callTimer = document.getElementById('callTimer');
    const callLog = document.getElementById('callLog');
    const statusText = document.getElementById('statusText');
    const statusIndicator = document.getElementById('statusIndicator');

    let currentSession = null; // Текущий сеанс звонка
    let isCallActive = false;
    let timerInterval = null;
    let seconds = 0;

    // --- Инициализация SIP.js ---
    const userAgent = new SIP.UserAgent({
        uri: SIP.UserAgent.makeURI(SIP_CONFIG.aor),
        transportOptions: {
            server: SIP_CONFIG.server
        },
        userAgentOptions: {
            displayName: SIP_CONFIG.displayName,
            authorizationPassword: SIP_CONFIG.password,
        }
    });

    // --- Обработчики состояния регистрации ---
    userAgent.stateChange.addListener((newState) => {
        console.log('Состояние UA:', newState);
        switch (newState) {
            case SIP.SessionState.Registered:
                statusText.textContent = 'зарегистрирована';
                statusIndicator.className = 'status-indicator status-online';
                addLogEntry('✅ Успешная регистрация на сервере', '');
                break;
            case SIP.SessionState.Terminated:
                statusText.textContent = 'отключена';
                statusIndicator.className = 'status-indicator status-offline';
                addLogEntry('❌ Регистрация потеряна', 'missed');
                break;
            default:
                statusText.textContent = 'подключение...';
                statusIndicator.className = 'status-indicator status-ringing';
        }
    });

    // --- Обработка входящих вызовов ---
    userAgent.delegate = {
        onInvite: (invitation) => {
            // Автоматически отвечаем на входящий вызов для демонстрации
            // В реальном сценарии здесь должен быть запрос на подтверждение у пользователя
            addLogEntry(`📞 Входящий от ${invitation.remoteIdentity.displayName || invitation.remoteIdentity.uri}`, 'incoming');
            callStatus.textContent = 'входящий...';
            statusText.textContent = 'входящий';
            statusIndicator.className = 'status-indicator status-ringing';

            // Принимаем вызов
            currentSession = invitation;
            invitation.accept({
                sessionDescriptionHandlerOptions: {
                    constraints: { audio: true, video: false }
                }
            }).then(() => {
                // Вызов принят
                callStatus.textContent = 'в разговоре';
                statusText.textContent = 'на линии';
                statusIndicator.className = 'status-indicator status-online';
                isCallActive = true;
                startTimer();
                addLogEntry(`✅ Вызов принят от ${invitation.remoteIdentity.displayName || invitation.remoteIdentity.uri}`, 'incoming');
            }).catch((e) => {
                console.error('Ошибка при принятии вызова:', e);
                addLogEntry(`❌ Не удалось принять вызов: ${e.message}`, 'missed');
                resetCallState();
            });
        }
    };

    // --- Вспомогательные функции ---
    function dial(digit) { phoneInput.value += digit; }

    function makeCall() {
        const number = phoneInput.value.trim();
        if (!number) { alert('Введите номер'); return; }
        if (isCallActive) { alert('Вызов уже активен'); return; }

        const target = SIP.UserAgent.makeURI(`sip:${number}@pbx.zadarma.com`); // Замените домен, если нужно
        if (!target) { alert('Некорректный номер'); return; }

        // Создаем исходящий вызов
        const inviter = new SIP.Inviter(userAgent, target, {
            sessionDescriptionHandlerOptions: {
                constraints: { audio: true, video: false }
            }
        });

        currentSession = inviter;
        addLogEntry(`📤 Исходящий → ${number}`, 'outgoing');
        callStatus.textContent = 'вызов...';
        statusText.textContent = 'звонит';
        statusIndicator.className = 'status-indicator status-ringing';

        // Отправляем INVITE
        inviter.invite().then(() => {
            // INVITE отправлен
            console.log('INVITE отправлен');
        }).catch((error) => {
            console.error('Ошибка при вызове:', error);
            addLogEntry(`❌ Ошибка: ${error.message}`, 'missed');
            resetCallState();
        });

        // Обработчики состояния сессии
        inviter.stateChange.addListener((newState) => {
            console.log('Состояние сессии:', newState);
            switch (newState) {
                case SIP.SessionState.Established:
                    callStatus.textContent = 'в разговоре';
                    statusText.textContent = 'на линии';
                    statusIndicator.className = 'status-indicator status-online';
                    isCallActive = true;
                    startTimer();
                    addLogEntry(`✅ Разговор с ${number} начат`, 'outgoing');
                    break;
                case SIP.SessionState.Terminated:
                    addLogEntry(`📴 Вызов с ${number} завершён (${formatTime(seconds)})`, 'missed');
                    resetCallState();
                    break;
                default:
                    // Обработка других состояний, если нужно
                    break;
            }
        });
    }

    function hangUp() {
        if (currentSession) {
            currentSession.bye().then(() => {
                addLogEntry('📴 Вызов сброшен', '');
                resetCallState();
            }).catch((e) => {
                console.error('Ошибка при завершении:', e);
                resetCallState();
            });
        } else {
            alert('Нет активного вызова');
        }
    }

    function resetCallState() {
        isCallActive = false;
        currentSession = null;
        stopTimer();
        seconds = 0;
        callTimer.textContent = '00:00';
        callStatus.textContent = 'свободен';
        statusText.textContent = 'зарегистрирована';
        statusIndicator.className = 'status-indicator status-online';
        phoneInput.value = '';
    }

    // --- Таймер разговора ---
    function startTimer() {
        seconds = 0;
        timerInterval = setInterval(() => {
            seconds++;
            callTimer.textContent = formatTime(seconds);
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    function formatTime(totalSec) {
        const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const s = String(totalSec % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    // --- Лог ---
    function addLogEntry(text, type = '') {
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        entry.innerHTML = `<span>${text}</span><span style="opacity:0.4;">${time}</span>`;
        const placeholder = callLog.querySelector('[style*="opacity:0.3;"]');
        if (placeholder) placeholder.remove();
        callLog.prepend(entry);
        if (callLog.children.length > 20) {
            callLog.removeChild(callLog.lastChild);
        }
    }

    // --- Запуск регистрации ---
    userAgent.start().then(() => {
        console.log('SIP User Agent запущен, регистрация...');
        addLogEntry('🔄 Подключение к телефонному серверу...', '');
    }).catch((error) => {
        console.error('Ошибка запуска UA:', error);
        statusText.textContent = 'ошибка';
        statusIndicator.className = 'status-indicator status-offline';
        addLogEntry(`❌ Ошибка подключения: ${error.message}`, 'missed');
    });
</script>
</body>
</html>
