<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АФИША — Дворец НЕКСА</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            background: #111;
        }

        body {
            color: #f4ead2;
        }

        /* ФОН ДВОРЦА */
        #palace {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(10, 12, 18, .18), rgba(10, 12, 18, .42)),
                url("palace.jpg") center/cover no-repeat,
                linear-gradient(135deg, #27313a, #766b58 45%, #171a21);
        }

        #mist {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    rgba(255, 255, 255, .06) 0%,
                    rgba(255, 255, 255, 0) 42%,
                    rgba(0, 0, 0, .38) 100%);
        }

        /* Заголовок */
        #title {
            position: fixed;
            top: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1000;
            font-size: clamp(30px, 4vw, 46px);
            letter-spacing: 12px;
            text-shadow: 0 2px 6px #000, 0 0 22px rgba(255, 220, 150, .35);
        }

        #subtitle {
            position: fixed;
            top: 79px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1000;
            color: rgba(255, 240, 210, .78);
            font-size: 13px;
            letter-spacing: 3px;
        }

        /* Сцена */
        #stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1px;
            height: 1px;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        /* Портрет — общий стиль для обоих массивов */
        .artist {
            position: absolute;
            left: -78px;
            top: -103px;
            width: 156px;
            height: 206px;
            border: 2px solid rgba(244, 230, 190, .82);
            border-radius: 4px;
            background: #222;
            overflow: hidden;
            cursor: pointer;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .65),
                0 0 12px rgba(255, 220, 160, .18);
            transition: border-color .35s ease,
                box-shadow .35s ease;
        }

        .artist:hover {
            border-color: #fff1bd;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .8),
                0 0 28px rgba(255, 225, 150, .48);
        }

        .artist img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: linear-gradient(135deg, #403d39, #aaa17e);
        }

        .artist.missing img {
            opacity: 0;
        }

        .artist.missing::before {
            content: "ПОРТРЕТ";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: rgba(255, 240, 210, .65);
            font-size: 12px;
            letter-spacing: 3px;
        }

        .artistName {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 25px 6px 9px;
            color: white;
            text-align: center;
            font-size: 14px;
            letter-spacing: 1px;
            background: linear-gradient(transparent, rgba(0, 0, 0, .9));
            pointer-events: none;
        }

        /* Нижняя подсказка */
        #hint {
            position: fixed;
            bottom: 23px;
            left: 0;
            width: 100%;
            z-index: 1000;
            text-align: center;
            color: rgba(255, 240, 210, .7);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* Затемнение краёв */
        #vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 900;
            background: radial-gradient(ellipse at center,
                    transparent 34%,
                    rgba(0, 0, 0, .57) 100%);
        }

        /* Кнопка возврата */
        #back {
            position: fixed;
            left: 22px;
            bottom: 19px;
            z-index: 1100;
            padding: 8px 14px;
            border: 1px solid rgba(244, 230, 190, .38);
            border-radius: 3px;
            background: rgba(0, 0, 0, .25);
            color: rgba(255, 240, 210, .75);
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
        }

        #back:hover {
            color: #fff1bd;
            border-color: rgba(255, 241, 189, .8);
        }

        /* Кнопка управления звуком */
        #soundToggle {
            position: fixed;
            right: 22px;
            bottom: 19px;
            z-index: 1100;
            padding: 8px 14px;
            border: 1px solid rgba(244, 230, 190, .38);
            border-radius: 3px;
            background: rgba(0, 0, 0, .25);
            color: rgba(255, 240, 210, .75);
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        #soundToggle:hover {
            color: #fff1bd;
            border-color: rgba(255, 241, 189, .8);
        }

        /* Контейнер для второго потока (поверх основного) */
        #secondStage {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 500;
        }

        #secondStage .artist {
            pointer-events: auto;
            box-shadow: 0 8px 28px rgba(0,0,0,0.8), 0 0 18px rgba(255,220,160,0.3);
        }
    </style>
</head>

<body>

    <!-- АУДИО — ФАЙЛ klavisin.mp3 ДОЛЖЕН ЛЕЖАТЬ РЯДОМ -->
    <audio id="bgMusic" loop preload="auto">
        <source src="klavisin.mp3" type="audio/mpeg">
    </audio>

    <div id="palace"></div>
    <div id="mist"></div>

    <div id="title">AFISHA</div>
    <div id="subtitle">GALLERY OF PRESENTATIONS OF ORIGINAL EUROPEAN ARTISTS</div>

    <div id="stage"></div>
    <div id="secondStage"></div>

    <a id="back" href="index.html">← DVORETS</a>

    <div id="hint">Click on the artist's portrait</div>

    <div id="vignette"></div>

    <script>
        /* ==========================================================
           ХУДОЖНИКИ (единый источник данных)
           ========================================================== */

        const artists = [{
            name: "Наталия Русина",
            image: "artists/nataliarus.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/rusin/balcony.html"
        }, {
            name: "Татьяна Москалева",
            image: "artists/taniamosk.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/tmosk/balconymos.html"
        }, {
            name: "Валерий Ведренко",
            image: "artists/vcedrenko.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/concert_nex/valved/balcoved.html"
        }, {
            name: "Мария Харлампиева",
            image: "artists/mariaharl.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/volnasia/lesbalkona/balcony_les.html"
        }, {
            name: "Сергей Коморный",
            image: "artists/sergeykom.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/concert_nex/balcony.html"
        }, {
            name: "Вадим Солодкий",
            image: "artists/vadimsol.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/volnasia/dogbal/balconydog.html"
        }, {
            name: "Наталия Калайда",
            image: "artists/nataliakala.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/seas/dvorets_library_room/finkuk/balcony_fin.html"
        }, {
            name: "Ион Карчелан",
            image: "artists/Ionсarchelan.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/ion/balconion.html"
        }, {
            name: "Василий Юдов",
            image: "artists/vasiliyud.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/balconyud.html"
        }];

        /* ==========================================================
           ФУНКЦИЯ СОЗДАНИЯ КАРТОЧЕК ДЛЯ КОНТЕЙНЕРА
           ========================================================== */
        function createCards(container, data) {
            const cards = [];
            data.forEach((artist, i) => {
                const card = document.createElement("div");
                card.className = "artist";

                const img = document.createElement("img");
                img.src = artist.image;
                img.alt = artist.name;
                img.addEventListener("error", () => {
                    card.classList.add("missing");
                });

                const name = document.createElement("div");
                name.className = "artistName";
                name.textContent = artist.name;

                card.appendChild(img);
                card.appendChild(name);

                card.addEventListener("click", () => {
                    window.location.href = artist.link;
                });

                container.appendChild(card);
                cards.push({
                    element: card,
                    index: i
                });
            });
            return cards;
        }

        /* ==========================================================
           ОСНОВНОЙ ВИХРЬ (первый массив) — без изменений
           ========================================================== */
        const stage = document.getElementById("stage");
        const mainCards = createCards(stage, artists);

        let angle = 0;
        const speed = 0.00042;
        const spiralHeight = 650;
        const maxRadius = 300;
        const depth = 430;

        function animateMain(time) {
            angle += speed * 16;

            mainCards.forEach((card, i) => {
                const a = angle + (i / artists.length) * Math.PI * 2;
                const y = Math.sin(a) * spiralHeight / 2;
                const normalized = Math.abs(y) / (spiralHeight / 2);
                const radius = 70 + normalized * maxRadius;
                const x = Math.cos(a) * radius;
                const z = Math.sin(a) * depth;
                const scale = 0.70 + ((z + depth) / (depth * 2)) * 0.58;
                const opacity = 0.42 + ((z + depth) / (depth * 2)) * 0.58;
                const rotate = Math.cos(a) * 18;

                card.element.style.transform = `
                            translate3d(${x}px, ${y}px, ${z}px)
                            rotateY(${rotate}deg)
                            scale(${scale})
                        `;
                card.element.style.opacity = opacity;
                card.element.style.zIndex = Math.round(z + depth + 100);
            });

            requestAnimationFrame(animateMain);
        }

        /* ==========================================================
           ВТОРОЙ ПОТОК — дуга от левого верхнего к правому верхнему
           с опусканием к нижнему краю в центре
           ========================================================== */
        const secondContainer = document.getElementById('secondStage');
        const secondCards = createCards(secondContainer, artists);

        // Начальная фаза для каждого портрета
        const offsets = artists.map((_, i) => i / artists.length);

        function animateSecond(time) {
            // прогресс бесконечно увеличивается
            const progress = (performance.now() / 14000) % 1; // длительность цикла ~14 сек

            const count = secondCards.length;
            const w = window.innerWidth;
            const h = window.innerHeight;

            for (let i = 0; i < count; i++) {
                let p = (progress + offsets[i]) % 1;

                // Масштаб: миниатюра в начале и в конце, максимум в центре
                const scaleFactor = 0.3 + 0.7 * Math.sin(p * Math.PI);
                const baseSize = 0.35;
                const maxSize = 1.0;
                const scale = baseSize + (maxSize - baseSize) * scaleFactor;

                // Позиция по X: от левого края (0) до правого (100%)
                const xPos = p * w;

                // Позиция по Y: начинаем сверху (5%),
                // в центре опускаемся до 75% высоты, затем снова поднимаемся
                // Используем sin(p * PI) для плавного подъёма/спуска
                const yBase = 0.05 * h; // стартовая позиция сверху
                const yDrop = 0.70 * h; // насколько опускаемся в центре
                const yPos = yBase + yDrop * Math.sin(p * Math.PI);

                // Opacity: появляется в начале, исчезает в конце
                let opacity = 0;
                if (p < 0.1) {
                    opacity = p / 0.1;
                } else if (p > 0.9) {
                    opacity = (1 - p) / 0.1;
                } else {
                    opacity = 1;
                }
                opacity = Math.min(1, Math.max(0, opacity));

                // Небольшой поворот для эффекта
                const rotateY = 15 * Math.sin(p * Math.PI);

                const el = secondCards[i].element;
                el.style.transform = `
                            translate3d(${xPos - 78}px, ${yPos - 103}px, 0)
                            rotateY(${rotateY}deg)
                            scale(${scale})
                        `;
                el.style.opacity = opacity;
                el.style.zIndex = Math.round(scale * 500 + 50);
            }

            requestAnimationFrame(animateSecond);
        }

        /* ==========================================================
           ЗАПУСК АНИМАЦИЙ
           ========================================================== */
        requestAnimationFrame(animateMain);
        requestAnimationFrame(animateSecond);

        /* ==========================================================
           МУЗЫКА — НЕГРОМКО (15%)
           ========================================================== */

        const audio = document.getElementById('bgMusic');
        audio.volume = 0.15;
        audio.loop = true;

        document.addEventListener('click', function startAudio() {
            audio.play().catch(() => {});
            document.removeEventListener('click', startAudio);
        }, { once: true });

        const toggleBtn = document.createElement('button');
        toggleBtn.id = 'soundToggle';
        toggleBtn.textContent = '♫';
        document.body.appendChild(toggleBtn);

        let isPlaying = true;
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                audio.pause();
                toggleBtn.textContent = '♫';
            } else {
                audio.play().catch(() => {});
                toggleBtn.textContent = '♫';
            }
            isPlaying = !isPlaying;
        });
    </script>
</body>
</html>
