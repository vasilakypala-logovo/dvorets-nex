<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АФИША — Дворец НЕКСА</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            background: #111;
        }

        body {
            color: #f4ead2;
        }

        /* ФОН ДВОРЦА */
        #palace {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(10, 12, 18, .18), rgba(10, 12, 18, .42)),
                url("palace.jpg") center/cover no-repeat,
                linear-gradient(135deg, #27313a, #766b58 45%, #171a21);
        }

        #mist {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    rgba(255, 255, 255, .06) 0%,
                    rgba(255, 255, 255, 0) 42%,
                    rgba(0, 0, 0, .38) 100%);
        }

        /* Заголовок */
        #title {
            position: fixed;
            top: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1000;
            font-size: clamp(30px, 4vw, 46px);
            letter-spacing: 12px;
            text-shadow: 0 2px 6px #000, 0 0 22px rgba(255, 220, 150, .35);
        }

        #subtitle {
            position: fixed;
            top: 79px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1000;
            color: rgba(255, 240, 210, .78);
            font-size: 13px;
            letter-spacing: 3px;
        }

        /* Ссылка "Submit your artwork" — английские буквы увеличены и жирные */
        #submitLink {
            position: fixed;
            top: 106px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1000;
            text-decoration: none;
            color: rgba(255, 240, 210, 0.9);
            padding: 8px 18px;
            border: 1px solid rgba(255, 220, 150, 0.35);
            box-shadow: 0 0 12px rgba(255, 220, 150, 0.15), inset 0 0 12px rgba(255, 220, 150, 0.08);
            border-radius: 2px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(1px);
            font-family: Georgia, "Times New Roman", serif;
            cursor: pointer;
            display: inline-block;
            width: auto;
            margin: 0 auto;
            line-height: 1.5;
        }

        #submitLink:hover {
            border-color: rgba(255, 241, 189, 0.8);
            box-shadow: 0 0 22px rgba(255, 220, 150, 0.3), inset 0 0 22px rgba(255, 220, 150, 0.12);
            color: #fff1bd;
        }

        /* АНГЛИЙСКАЯ ЧАСТЬ — БОЛЬШАЯ И ЖИРНАЯ */
        .submit-en {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            display: block;
        }

        /* РУССКАЯ ЧАСТЬ — ОБЫЧНАЯ */
        .submit-ru {
            font-size: 14px;
            letter-spacing: 1px;
            display: block;
            margin-top: 2px;
            opacity: 0.85;
        }

        /* Сцена */
        #stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1px;
            height: 1px;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        /* Портрет — общий стиль для обоих массивов */
        .artist {
            position: absolute;
            left: -78px;
            top: -103px;
            width: 156px;
            height: 206px;
            border: 2px solid rgba(244, 230, 190, .82);
            border-radius: 4px;
            background: #222;
            overflow: hidden;
            cursor: pointer;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .65),
                0 0 12px rgba(255, 220, 160, .18);
            transition: border-color .35s ease,
                box-shadow .35s ease;
        }

        .artist:hover {
            border-color: #fff1bd;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .8),
                0 0 28px rgba(255, 225, 150, .48);
        }

        .artist img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: linear-gradient(135deg, #403d39, #aaa17e);
        }

        .artist.missing img {
            opacity: 0;
        }

        .artist.missing::before {
            content: "ПОРТРЕТ";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: rgba(255, 240, 210, .65);
            font-size: 12px;
            letter-spacing: 3px;
        }

        .artistName {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 25px 6px 9px;
            color: white;
            text-align: center;
            font-size: 14px;
            letter-spacing: 1px;
            background: linear-gradient(transparent, rgba(0, 0, 0, .9));
            pointer-events: none;
        }

        /* Нижняя подсказка */
        #hint {
            position: fixed;
            bottom: 23px;
            left: 0;
            width: 100%;
            z-index: 1000;
            text-align: center;
            color: rgba(255, 240, 210, .7);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* Затемнение краёв */
        #vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 900;
            background: radial-gradient(ellipse at center,
                    transparent 34%,
                    rgba(0, 0, 0, .57) 100%);
        }

        /* Кнопка возврата */
        #back {
            position: fixed;
            left: 22px;
            bottom: 19px;
            z-index: 1100;
            padding: 8px 14px;
            border: 1px solid rgba(244, 230, 190, .38);
            border-radius: 3px;
            background: rgba(0, 0, 0, .25);
            color: rgba(255, 240, 210, .75);
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
        }

        #back:hover {
            color: #fff1bd;
            border-color: rgba(255, 241, 189, .8);
        }

        /* Кнопка управления звуком */
        #soundToggle {
            position: fixed;
            right: 22px;
            bottom: 19px;
            z-index: 1100;
            padding: 8px 14px;
            border: 1px solid rgba(244, 230, 190, .38);
            border-radius: 3px;
            background: rgba(0, 0, 0, .25);
            color: rgba(255, 240, 210, .75);
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        #soundToggle:hover {
            color: #fff1bd;
            border-color: rgba(255, 241, 189, .8);
        }

        /* Контейнер для второго потока (поверх основного) */
        #secondStage {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 500;
            overflow: visible;
        }

        #secondStage .artist {
            pointer-events: auto;
            box-shadow: 0 8px 28px rgba(0,0,0,0.8), 0 0 18px rgba(255,220,160,0.3);
        }
    </style>
</head>

<body>

    <!-- АУДИО — ФАЙЛ klavisin.mp3 ДОЛЖЕН ЛЕЖАТЬ РЯДОМ -->
    <audio id="bgMusic" loop preload="auto">
        <source src="klavisin.mp3" type="audio/mpeg">
    </audio>

    <div id="palace"></div>
    <div id="mist"></div>

    <div id="title">AFISHA</div>
    <div id="subtitle">GALLERY OF PRESENTATIONS OF ORIGINAL EUROPEAN ARTISTS</div>

    <!-- ССЫЛКА — АНГЛИЙСКАЯ ЧАСТЬ БОЛЬШАЯ И ЖИРНАЯ -->
    <a id="submitLink" href="https://vasilakypala-logovo.github.io/dvorets-nex/bashnya_nex/index.html">
        <span class="submit-en">Submit your artwork</span>
        <span class="submit-ru">Отправить свою работу во Dvorets</span>
    </a>

    <div id="stage"></div>
    <div id="secondStage"></div>

    <a id="back" href="index.html">← DVORETS</a>

    <div id="hint">Click on the artist's portrait</div>

    <div id="vignette"></div>

    <script>

        /* ==========================================================
           ОБЩАЯ СТАТИСТИКА АФИШИ
           1) просмотры Афиши
           2) все переходы из Афиши в галереи
           ========================================================== */
        const STATS_NAMESPACE = "dvorets-nex-afisha-2026";
        const STATS_BASE = "https://abacus.jasoncameron.dev";

        function statUrl(mode, key) {
            return `${STATS_BASE}/${mode}/${encodeURIComponent(STATS_NAMESPACE)}/${encodeURIComponent(key)}`;
        }

        function hitStat(key) {
            fetch(statUrl("hit", key), {
                method: "GET",
                mode: "cors",
                cache: "no-store",
                keepalive: true
            }).catch(() => {});
        }

        // Один просмотр Афиши = одна загрузка страницы
        hitStat("afisha_views");

        /* ==========================================================
           МАССИВ ДЛЯ ОСНОВНОГО ВИХРЯ (не трогать)
           ========================================================== */
        const mainArtists = [{
            name: "Наталия Русина",
            image: "artists/nataliarus.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/rusin/balcony.html"
        }, {
            name: "Татьяна Москалева",
            image: "artists/taniamosk.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/tmosk/balconymos.html"
        }, {
            name: "Валерий Ведренко",
            image: "artists/vcedrenko.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/concert_nex/valved/balcoved.html"
        }, {
            name: "Мария Харлампиева",
            image: "artists/mariaharl.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/volnasia/lesbalkona/balcony_les.html"
        }, {
            name: "Сергей Коморный",
            image: "artists/sergeykom.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/concert_nex/balcony.html"
        }, {
            name: "Вадим Солодкий",
            image: "artists/vadimsol.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/volnasia/dogbal/balconydog.html"
        }, {
            name: "Наталия Калайда",
            image: "artists/nataliakala.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/seas/dvorets_library_room/finkuk/balcony_fin.html"
        }, {
            name: "Ион Карчелан",
            image: "artists/Ionсarchelan.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/ion/balconion.html"
        }, {
            name: "Василий Юдов",
            image: "artists/vasiliyud.jpg",
            link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/balconyud.html"
        }];

        /* ==========================================================
           АВТОНОМНЫЙ МАССИВ ДЛЯ ВТОРОГО ПОТОКА
           ========================================================== */
        const secondArtists = [
            ...mainArtists.map(artist => ({...artist})),
            {
                name: "Юлия Котова",
                image: "artists/kotovaulia.jpg",
                link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/LUV/works/yulia/balconykot.html"
            },
            {
                name: "Игорь Кройтор",
                image: "artists/igor.jpg",
                link: "https://vasilakypala-logovo.github.io/dvorets-nex/vestibul/igorbalk/balconigor.html"
            }
        ];

        /* ==========================================================
           ФУНКЦИЯ СОЗДАНИЯ КАРТОЧЕК
           ========================================================== */
        function createCards(container, data) {
            const cards = [];
            data.forEach((artist, i) => {
                const card = document.createElement("div");
                card.className = "artist";

                const img = document.createElement("img");
                img.src = artist.image;
                img.alt = artist.name;
                img.addEventListener("error", () => {
                    card.classList.add("missing");
                });

                const name = document.createElement("div");
                name.className = "artistName";
                name.textContent = artist.name;

                card.appendChild(img);
                card.appendChild(name);

                card.addEventListener("click", () => {
                    hitStat("gallery_clicks");
                    window.location.href = artist.link;
                });

                container.appendChild(card);
                cards.push({
                    element: card,
                    index: i
                });
            });
            return cards;
        }

        /* ==========================================================
           ОСНОВНОЙ ВИХРЬ
           ========================================================== */
        const stage = document.getElementById("stage");
        const mainCards = createCards(stage, mainArtists);

        let angle = 0;
        const speed = 0.00042;
        const spiralHeight = 650;
        const maxRadius = 300;
        const depth = 430;

        function animateMain(time) {
            angle += speed * 16;

            mainCards.forEach((card, i) => {
                const a = angle + (i / mainArtists.length) * Math.PI * 2;
                const y = Math.sin(a) * spiralHeight / 2;
                const normalized = Math.abs(y) / (spiralHeight / 2);
                const radius = 70 + normalized * maxRadius;
                const x = Math.cos(a) * radius;
                const z = Math.sin(a) * depth;
                const scale = 0.70 + ((z + depth) / (depth * 2)) * 0.58;
                const opacity = 0.42 + ((z + depth) / (depth * 2)) * 0.58;
                const rotate = Math.cos(a) * 18;

                card.element.style.transform = `
                            translate3d(${x}px, ${y}px, ${z}px)
                            rotateY(${rotate}deg)
                            scale(${scale})
                        `;
                card.element.style.opacity = opacity;
                card.element.style.zIndex = Math.round(z + depth + 100);
            });

            requestAnimationFrame(animateMain);
        }

        /* ==========================================================
           ВТОРОЙ ПОТОК — С ПРОЗРАЧНОСТЬЮ ОТ ЦЕНТРА
           ========================================================== */
        const secondContainer = document.getElementById('secondStage');
        const secondCards = createCards(secondContainer, secondArtists);

        const offsets = secondArtists.map((_, i) => i / secondArtists.length);

        function animateSecond(time) {
            const progress = (performance.now() / 16000) % 1;

            const count = secondCards.length;
            const w = window.innerWidth;
            const h = window.innerHeight;

            // Центр экрана
            const centerX = w / 2;
            const centerY = h / 2;

            for (let i = 0; i < count; i++) {
                let p = (progress + offsets[i]) % 1;

                let scale;
                if (p < 0.5) {
                    const t = p / 0.5;
                    scale = 0.3 + t * 0.7;
                } else {
                    const t = (p - 0.5) / 0.5;
                    scale = 1.0 + t * 1.2;
                }

                let xPos;
                if (p < 0.5) {
                    const t = p / 0.5;
                    xPos = t * w * 0.5;
                } else {
                    const t = (p - 0.5) / 0.5;
                    xPos = w * 0.5 + t * w * 0.8;
                }

                const yBase = 0.05 * h;
                const yDrop = 0.70 * h;
                const yPos = yBase + yDrop * Math.sin(p * Math.PI);

                // =====================================================
                // НОВАЯ ПРОЗРАЧНОСТЬ — ЗАВИСИТ ОТ УДАЛЕНИЯ ОТ ЦЕНТРА
                // =====================================================
                
                // Расстояние от центра экрана до портрета (в пикселях)
                const dx = (xPos - centerX);
                const dy = (yPos - centerY);
                const distanceFromCenter = Math.sqrt(dx * dx + dy * dy);

                // Максимальное расстояние — диагональ экрана
                const maxDist = Math.sqrt(w * w + h * h) / 2;

                // Нормализуем расстояние (0 — центр, 1 — угол экрана)
                const normalizedDist = Math.min(distanceFromCenter / maxDist, 1);

                // Прозрачность: в центре = 1, на краях плавно уходит к 0
                // Используем кубическую кривую для мягкого затухания
                let centerFade = 1 - Math.pow(normalizedDist, 1.8);
                centerFade = Math.max(0, Math.min(1, centerFade));

                // Базовая прозрачность от анимации (появление/исчезновение)
                let baseOpacity;
                if (p < 0.05) {
                    baseOpacity = p / 0.05;
                } else if (p > 0.85) {
                    baseOpacity = (1 - p) / 0.15;
                } else {
                    baseOpacity = 1;
                }
                baseOpacity = Math.min(1, Math.max(0, baseOpacity));

                // Итоговая прозрачность — комбинация базовой и затухания от центра
                const finalOpacity = baseOpacity * centerFade;

                const rotateY = 20 * Math.sin(p * Math.PI);

                const el = secondCards[i].element;
                el.style.transform = `
                            translate3d(${xPos - 78}px, ${yPos - 103}px, 0)
                            rotateY(${rotateY}deg)
                            scale(${scale})
                        `;
                el.style.opacity = finalOpacity;
                el.style.zIndex = Math.round(scale * 400 + 50);
            }

            requestAnimationFrame(animateSecond);
        }

        /* ==========================================================
           ЗАПУСК
           ========================================================== */
        requestAnimationFrame(animateMain);
        requestAnimationFrame(animateSecond);

        /* ==========================================================
           МУЗЫКА
           ========================================================== */

        const audio = document.getElementById('bgMusic');
        audio.volume = 0.15;
        audio.loop = true;

        document.addEventListener('click', function startAudio() {
            audio.play().catch(() => {});
            document.removeEventListener('click', startAudio);
        }, { once: true });

        const toggleBtn = document.createElement('button');
        toggleBtn.id = 'soundToggle';
        toggleBtn.textContent = '♫';
        document.body.appendChild(toggleBtn);

        let isPlaying = true;
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                audio.pause();
                toggleBtn.textContent = '♫';
            } else {
                audio.play().catch(() => {});
                toggleBtn.textContent = '♫';
            }
            isPlaying = !isPlaying;
        });
    </script>
</body>
</html>﻿
