    <script>
        // Блокируем любые внешние вмешательства
        (function protect() {
            // Защищаем document от изменений
            if (window.top !== window.self) {
                // Если страница во фрейме - ломаем его
                window.top.location.href = window.location.href;
            }
            
            // Блокируем перезапись метода open
            const origOpen = window.open;
            window.open = function(...args) {
                if (args[0] && args[0].includes('chrome-extension')) return null;
                return origOpen.apply(this, args);
            };
            
            // Защищаем свойство document.domain
            Object.defineProperty(document, 'domain', {
                configurable: false,
                writable: false,
                value: document.domain
            });
            
            // Блокируем перезапись localStorage
            const origSetItem = Storage.prototype.setItem;
            Storage.prototype.setItem = function(key, value) {
                if (key.includes('book_') || key.includes('bookmark_')) {
                    return origSetItem.call(this, key, value);
                }
                // Блокируем запись чужих ключей
                return null;
            };
            
            // Защищаем от iframe перезаписи
            document.addEventListener('DOMContentLoaded', function() {
                // Проверяем, не подменили ли наши элементы
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.type === 'childList') {
                            // Проверяем, не появились ли посторонние элементы
                            const badElements = document.querySelectorAll('[data-immersive-translate]');
                            badElements.forEach(el => el.remove());
                            
                            // Удаляем посторонние popup/iframe
                            const popups = document.querySelectorAll('#immersive-translate-popup, [id*="translate"], [class*="translate"]');
                            popups.forEach(el => {
                                if (el.id !== 'immersive-translate-popup' || el.parentNode) {
                                    el.remove();
                                }
                            });
                        }
                    });
                });
                
                observer.observe(document.body, {
                    childList: true,
                    subtree: true
                });
            });
        })();
    </script>

    <script>
        const CONFIG = {
            title: "НАСТОЯЩЕЕ МЕСТО",
            subtitle: "СБОРНИК СКАЗОК",
            author: "Сказочник ЧИН",
            bookDir: "putnik/",
            readOnly: true
        };

        // ============================================================
        // 📝 РУЧНОЕ ОГЛАВЛЕНИЕ — впишите сюда названия ваших страниц
        // ============================================================
        const TOC_TITLES = [
            '📖 Обложка',
            'МЕСТО НАСТОЯЩИХ ЗНАКОВ',
            'ПТИЧЬИ ТРОПИНКИ',
            'СТАРЫЙ ПЕНЬ И МОЛЧАЛИВЫЕ РОГА',
            'ТИХАЯ ПОЛЯНА',
            'ТАЙНА СТАРОГО ДОЖДЯ'
        ];
        // ============================================================

        // ===== ЗАЩИТА ОТ ПЕРЕЗАПИСИ КОНФИГА =====
        Object.freeze(CONFIG);
        Object.freeze(TOC_TITLES);

        class BookEngine {
            constructor() {
                this.config = CONFIG;
                this.totalPages = 0;
                this.currentIndex = 0;
                this.bookmark = null;
                this.isTransitioning = false;
                this.coverVisible = true;
                this.iframes = {};
                this.pageList = [];
                this.readOnly = this.config.readOnly || false;
                this.els = {
                    cover: document.getElementById('cover-container'),
                    coverImage: document.getElementById('cover-image'),
                    coverTitle: document.getElementById('cover-title'),
                    coverSubtitle: document.getElementById('cover-subtitle'),
                    coverAuthor: document.getElementById('cover-author'),
                    wrapper: document.getElementById('pages-wrapper'),
                    indicator: document.getElementById('page-indicator'),
                    prev: document.getElementById('prev-btn'),
                    next: document.getElementById('next-btn'),
                    home: document.getElementById('home-btn'),
                    toc: document.getElementById('toc-btn'),
                    refreshToc: document.getElementById('refresh-toc-btn'),
                    bookmark: document.getElementById('bookmark-btn'),
                    save: document.getElementById('save-btn'),
                    addPage: document.getElementById('add-page-btn'),
                    deletePage: document.getElementById('delete-page-btn'),
                    tocModal: document.getElementById('toc-modal'),
                    tocList: document.getElementById('toc-list'),
                    closeToc: document.getElementById('close-toc-btn'),
                    editModal: document.getElementById('edit-modal'),
                    editInput: document.getElementById('edit-input'),
                    editTitle: document.getElementById('edit-title'),
                    editSave: document.getElementById('edit-save'),
                    editCancel: document.getElementById('edit-cancel')
                };
                this.init();
            }
            
            // ===== ЗАЩИТА МЕТОДОВ ОТ ПЕРЕЗАПИСИ =====
            init() {
                this.loadBookmark();
                this.setupCover();
                this.setupNav();
                this.setupKeyboard();
                this.setupTouch();
                this.setupTOC();
                this.setupEditModal();
                this.setupSave();
                this.setupPageManagement();
                this.loadMeta();
                this.detectPages();
                if (this.readOnly) {
                    this.applyReadOnly();
                }
                
                // Защищаем экземпляр от перезаписи
                Object.freeze(this);
            }
            
            // ... остальные методы остаются без изменений ...
            // (методы detectPages, loadPageWithCheck, finishDetection, getPageTitle, createNewPage, applyReadOnly, setupCover, updateCoverDisplay, openBook, loadPage, activateIframe, next, prev, goTo, goHome, updateNav, setupNav, setupKeyboard, setupTouch, setupTOC, updateTOC, showTOC, closeTOC, toggleBookmark, saveBookmark, loadBookmark, setupEditModal, openEditModal, closeEditModal, saveEdit, loadMeta, setupSave, saveBook, escapeJS, escapeHTML, setupPageManagement, addNewPage, deleteCurrentPage)
        }

        // ===== ЗАЩИТА ОТ ПЕРЕЗАПИСИ КЛАССА =====
        Object.freeze(BookEngine.prototype);
        
        document.addEventListener('DOMContentLoaded', function() {
            // Проверяем, не был ли уже создан экземпляр
            if (!window.book) {
                window.book = new BookEngine();
                // Защищаем глобальный объект
                Object.freeze(window.book);
            }
            
            // ===== ОТКЛЮЧАЕМ ВНЕШНИЕ СКРИПТЫ =====
            const disableExternalScripts = function() {
                const scripts = document.querySelectorAll('script[src]');
                scripts.forEach(script => {
                    if (!script.src.includes('book-engine') && !script.src.includes('localhost')) {
                        script.remove();
                    }
                });
            };
            
            // Запускаем защиту каждые 2 секунды
            setInterval(disableExternalScripts, 2000);
            
            // ===== БЛОКИРУЕМ ВСТАВКУ НОВЫХ ЭЛЕМЕНТОВ =====
            const mutationObserver = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === Node.ELEMENT_NODE) {
                            // Удаляем все посторонние переводческие элементы
                            if (node.id && (node.id.includes('translate') || node.id.includes('immersive'))) {
                                node.remove();
                            }
                            if (node.className && typeof node.className === 'string' && 
                                (node.className.includes('translate') || node.className.includes('immersive'))) {
                                node.remove();
                            }
                            // Удаляем посторонние скрипты
                            if (node.tagName === 'SCRIPT' && node.src && 
                                !node.src.includes('book-engine') && !node.src.includes('localhost')) {
                                node.remove();
                            }
                        }
                    });
                });
            });
            
            mutationObserver.observe(document.body, {
                childList: true,
                subtree: true
            });
        });
        
        // ===== ЗАЩИТА НА УРОВНЕ WINDOW =====
        // Блокируем добавление новых свойств в window
        Object.defineProperty(window, 'book', {
            configurable: false,
            writable: false,
            value: window.book || null
        });
        
        // Блокируем перезапись document
        Object.defineProperty(window, 'document', {
            configurable: false,
            writable: false,
            value: document
        });
        
        console.log('📖 Книга защищена от перезаписи!');
    </script>

</body>
</html>
