<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Кинообитель Некса</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050608;
  overflow:hidden;
}

body{
  font-family:Georgia,"Times New Roman",serif;
}


/* =========================================================
   КИНООБИТЕЛЬ

   Фон — очищенный kinozal.jpg
   ========================================================= */

#stage{
  position:relative;

  width:100vw;
  height:100vh;

  background:
    #050608
    url("kinozal.jpg")
    center center / contain
    no-repeat;
}


/* =========================================================
   ЭКРАН

   Координаты сохранены точно такими же,
   как в основном кинотеатре.
   ========================================================= */

#playerBox{
  position:absolute;

  left:7.78%;
  top:8.29%;

  width:60.17%;

  aspect-ratio:16/9;

  background:#000;

  overflow:hidden;

  box-shadow:
    0 0 2px rgba(255,255,255,.15);
}


#playerBox iframe,
#playerBox video{
  width:100%;
  height:100%;

  border:0;

  display:block;

  background:#000;
}


/* =========================================================
   НАДПИСЬ НА ПУСТОМ ЭКРАНЕ
   ========================================================= */

#screenHint{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#8b8173;

  font-size:clamp(12px,1.1vw,20px);

  letter-spacing:.16em;

  text-transform:uppercase;

  pointer-events:none;

  opacity:.45;
}


/* =========================================================
   НЕВИДИМАЯ ЗОНА ДВЕРИ

   Теперь дверь возвращает не во Дворец,
   а в ОСНОВНОЙ КИНОТЕАТР.
   ========================================================= */

#exit{
  position:absolute;

  left:80.2%;
  top:54.0%;

  width:15.0%;
  height:22.0%;

  cursor:pointer;

  background:transparent;
  border:0;
  outline:none;
}


/* =========================================================
   МАСШТАБИРОВАНИЕ

   То же самое, что в основном кинотеатре.
   ========================================================= */

@media (max-aspect-ratio:1672/941){

  #stage{

    width:calc(100vh * 1672 / 941);

    height:100vh;

    left:50%;

    transform:translateX(-50%);
  }

}


@media (min-aspect-ratio:1672/941){

  #stage{

    width:100vw;

    height:calc(100vw * 941 / 1672);

    top:50%;

    transform:translateY(-50%);
  }

}

</style>
</head>


<body>

<div id="stage">


  <!-- ЭКРАН -->

  <div id="playerBox">

    <div id="screenHint">
      КИНООБИТЕЛЬ
    </div>

  </div>


  <!--
       ДВЕРЬ НАЗАД

       kinoobitel находится внутри:

       kinozal/kinoobitel/

       Поэтому ../cinema.html
       возвращает нас на один уровень вверх.
  -->

  <a
    id="exit"
    href="../cinema.html"
    aria-label="Вернуться в кинотеатр">
  </a>


</div>

</body>
</html>
