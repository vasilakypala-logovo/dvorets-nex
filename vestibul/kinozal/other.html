<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Другие источники — Кинозал Некса</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050608;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif}
#stage{position:relative;width:100vw;height:100vh;background:#050608 url("kinozal.jpg") center center/contain no-repeat}
#playerBox{position:absolute;left:7.78%;top:8.29%;width:60.17%;aspect-ratio:16/9;background:#000;overflow:hidden;box-shadow:0 0 2px rgba(255,255,255,.15)}
#playerBox iframe,#playerBox video{width:100%;height:100%;border:0;display:block;background:#000}
#screenHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b8173;font-size:clamp(12px,1.1vw,20px);letter-spacing:.16em;text-transform:uppercase;pointer-events:none;opacity:.45}
#panel{position:absolute;left:78.7%;top:8.5%;width:18%;min-height:25%;padding:1.1% 1%;color:#ead9ae;background:rgba(10,8,6,.55);border:1px solid rgba(225,190,115,.25);box-shadow:inset 0 0 20px rgba(0,0,0,.55)}
#closePanel{position:absolute;right:5px;top:3px;width:24px;height:24px;padding:0;border:0;background:transparent;color:#d6b978;font:20px/24px Arial,sans-serif;cursor:pointer;opacity:.8}
#closePanel:hover{color:#fff0bd;opacity:1}
#panelTitle{margin:0 22px 10px 0;text-align:center;font-size:clamp(10px,.9vw,16px);letter-spacing:.10em}
#sourceUrl{width:100%;min-height:62px;resize:none;padding:7px;border:1px solid rgba(230,197,126,.42);border-radius:4px;outline:none;background:rgba(0,0,0,.72);color:#f1dfb4;font:clamp(9px,.72vw,12px) Arial,sans-serif}
#openBtn,#externalBtn{width:100%;margin-top:8px;padding:8px 6px;border:1px solid rgba(230,197,126,.45);border-radius:4px;color:#f1dfb4;background:rgba(35,27,17,.82);font-family:Georgia,"Times New Roman",serif;font-size:clamp(9px,.78vw,13px);cursor:pointer}
#openBtn:hover,#externalBtn:hover{background:rgba(75,55,28,.9)}
#externalBtn{display:none}
#status{margin-top:8px;min-height:28px;text-align:center;color:#bcae91;font:clamp(8px,.66vw,11px) Arial,sans-serif;line-height:1.35}
#exit{position:absolute;left:80.2%;top:54%;width:15%;height:22%;cursor:pointer;background:transparent;border:0;outline:none}
@media (max-aspect-ratio:1672/941){#stage{width:calc(100vh * 1672 / 941);height:100vh;left:50%;transform:translateX(-50%)}}
@media (min-aspect-ratio:1672/941){#stage{width:100vw;height:calc(100vw * 941 / 1672);top:50%;transform:translateY(-50%)}}
</style>
</head>
<body>
<div id="stage">
  <div id="playerBox"><div id="screenHint">ВСТАВЬТЕ ССЫЛКУ СПРАВА</div></div>
  <div id="panel">
    <button id="closePanel" type="button" aria-label="Закрыть">×</button>
    <div id="panelTitle">ДРУГИЕ ИСТОЧНИКИ</div>
    <textarea id="sourceUrl" spellcheck="false" placeholder="Вставьте полную ссылку Facebook, TikTok или прямую ссылку на видео"></textarea>
    <button id="openBtn" type="button">ПОКАЗАТЬ</button>
    <button id="externalBtn" type="button">ОТКРЫТЬ ИСТОЧНИК</button>
    <div id="status">Facebook · TikTok · прямое видео</div>
  </div>
  <a id="exit" href="cinema.html" aria-label="Вернуться в кинотеатр"></a>
</div>
<script>
const playerBox=document.getElementById("playerBox");
const panel=document.getElementById("panel");
const closePanel=document.getElementById("closePanel");
const sourceUrl=document.getElementById("sourceUrl");
const openBtn=document.getElementById("openBtn");
const externalBtn=document.getElementById("externalBtn");
const statusBox=document.getElementById("status");
let originalUrl="";

closePanel.addEventListener("click",()=>{window.location.href="cinema.html"});

function showIframe(src,title){
  playerBox.innerHTML="";
  const f=document.createElement("iframe");
  f.src=src; f.title=title||"Видео";
  f.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen=true;
  f.referrerPolicy="strict-origin-when-cross-origin";
  playerBox.appendChild(f);
}
function showVideo(src){
  playerBox.innerHTML="";
  const v=document.createElement("video");
  v.src=src; v.controls=true; v.autoplay=true; v.playsInline=true; v.preload="metadata";
  playerBox.appendChild(v); v.play().catch(()=>{});
}
function normalizeUrl(v){
  v=v.trim();
  if(!/^https?:\/\//i.test(v)) v="https://"+v;
  return v;
}
function openSource(){
  const value=sourceUrl.value.trim();
  if(!value){statusBox.textContent="Сначала вставьте ссылку.";return}
  let url;
  try{url=new URL(normalizeUrl(value))}
  catch(e){statusBox.textContent="Не похоже на правильную ссылку.";return}
  originalUrl=url.href;
  externalBtn.style.display="block";
  const host=url.hostname.toLowerCase().replace(/^www\./,"");
  if(host==="facebook.com"||host.endsWith(".facebook.com")||host==="fb.watch"){
    const embed="https://www.facebook.com/plugins/video.php?href="+encodeURIComponent(originalUrl)+"&show_text=false&width=1280";
    showIframe(embed,"Facebook video");
    statusBox.textContent="Facebook: пробуем показать ролик на экране.";
    return;
  }
  if(host==="tiktok.com"||host.endsWith(".tiktok.com")){
    const match=url.pathname.match(/\/video\/(\d+)/);
    if(match){
      showIframe("https://www.tiktok.com/player/v1/"+encodeURIComponent(match[1]),"TikTok video");
      statusBox.textContent="TikTok: ролик открыт на экране.";
      return;
    }
    showIframe(originalUrl,"TikTok");
    statusBox.textContent="Для короткой ссылки TikTok может понадобиться полный адрес вида tiktok.com/@.../video/...";
    return;
  }
  if(/\.(mp4|webm|ogg|ogv|m4v|mov)(?:$|[?#])/i.test(url.pathname+url.search)){
    showVideo(originalUrl);
    statusBox.textContent="Прямая видеоссылка открыта.";
    return;
  }
  showIframe(originalUrl,"Внешний источник");
  statusBox.textContent="Пробуем открыть источник. Если сайт запрещает встраивание — нажмите «ОТКРЫТЬ ИСТОЧНИК».";
}
openBtn.addEventListener("click",openSource);
sourceUrl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();openSource()}});
externalBtn.addEventListener("click",()=>{if(originalUrl)window.open(originalUrl,"_blank","noopener,noreferrer")});
</script>
</body>
</html>
