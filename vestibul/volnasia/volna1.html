<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ГОСТИННАЯ ВОЛНЫ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #09111b;
    font-family: Arial, sans-serif;
}

#stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #09111b;
}

#room {
    position: absolute;
    inset: 0;
    background-image: url("room.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

.zone {
    position: absolute;
    cursor: pointer;
    background: rgba(255,255,255,0);
    border: 2px solid rgba(255,255,255,0);
}

#z0 { left: 0.5%; top: 28%; width: 5%; height: 35%; }
#z1 { left: 9.4%; top: 24.6%; width: 10.0%; height: 42.8%; }
#z2 { left: 27.4%; top: 36.2%; width: 11.8%; height: 28.8%; }
#z3 { left: 43.0%; top: 31.6%; width: 16.0%; height: 37.6%; }
#z4 { left: 64.4%; top: 36.2%; width: 11.8%; height: 28.8%; }
#z5 { left: 85.0%; top: 24.8%; width: 10.2%; height: 42.6%; }

#title {
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    color: rgba(240,225,190,0.88);
    background: rgba(12,22,38,0.32);
    padding: 8px 20px;
    border-radius: 18px;
    letter-spacing: 3px;
    font-size: 18px;
    text-shadow: 0 0 10px rgba(255,220,150,0.35), 0 0 18px rgba(120,170,255,0.25);
    user-select: none;
}

#hint {
    position: absolute;
    left: 18px;
    bottom: 14px;
    color: rgba(235,240,250,0.75);
    background: rgba(10,18,30,0.34);
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    user-select: none;
}

/* ===== Планета: бело-серая, без полос ===== */
#planet {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.3s ease;
    /* Чистый бело-серый объёмный градиент */
    background: radial-gradient(ellipse at 30% 30%, #f0f0f0 0%, #c0c0c0 60%, #808080 100%);
    box-shadow:
        inset -12px -12px 30px rgba(0,0,0,0.5),
        0 0 40px rgba(255,255,255,0.2),
        0 0 80px rgba(200,200,200,0.15);
    animation: spinPlanet 12s linear infinite;
}
#planet:hover {
    transform: translateX(-50%) scale(1.1);
}

/* Кольцо Сатурна */
#planet::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 150%;
    height: 25%;
    transform: translate(-50%, -50%) rotateX(72deg);
    border-radius: 50%;
    border: 5px solid rgba(200,180,150,0.6);
    border-top-color: transparent;
    border-bottom-color: transparent;
    box-shadow: 0 0 25px rgba(200,180,150,0.25);
    pointer-events: none;
    animation: spinRing 10s linear infinite;
}

@keyframes spinPlanet {
    from { transform: translateX(-50%) rotate(0deg); }
    to { transform: translateX(-50%) rotate(360deg); }
}
@keyframes spinRing {
    from { transform: translate(-50%, -50%) rotateX(72deg) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotateX(72deg) rotate(360deg); }
}

/* ===== Кнопка "Назад" ===== */
#backBtn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.6);
    color: rgba(255,255,255,0.9);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    backdrop-filter: blur(4px);
    transition: background 0.3s, transform 0.3s;
    z-index: 10;
    font-family: Arial, sans-serif;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
}
#backBtn:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.08);
}

/* ===== Просмотрщик картин ===== */
#viewer {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, rgba(40,70,120,0.24), rgba(0,0,0,0.95) 55%),
        rgba(0,0,0,0.95);
    z-index: 100;
    flex-direction: row;
    gap: 30px;
    padding: 20px;
}

#tablet {
    max-height: 70vh;
    max-width: 30vw;
    object-fit: contain;
    display: none;
    box-shadow: 0 0 30px rgba(255,220,150,0.12);
    border-radius: 6px;
}

#big {
    max-height: 92vh;
    max-width: 60vw;
    object-fit: contain;
    box-shadow: 0 0 55px rgba(255,220,150,0.18), 0 0 120px rgba(80,120,220,0.20);
    transition: max-width 0.3s ease;
}

#viewer.has-tablet #big {
    max-width: 55vw;
}

#close {
    position: fixed;
    right: 24px;
    top: 16px;
    color: rgba(255,245,235,0.95);
    font-size: 44px;
    line-height: 44px;
    cursor: pointer;
    z-index: 110;
    user-select: none;
}

#caption {
    position: fixed;
    left: 20px;
    bottom: 16px;
    color: rgba(245,240,225,0.82);
    background: rgba(12,22,38,0.42);
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 15px;
    z-index: 110;
}
</style>
</head>

<body>

<div id="stage">
    <div id="room"></div>
    <div id="title">ГОСТИННАЯ ВОЛНЫ</div>

    <!-- Зоны картин и балкона -->
    <div class="zone" id="z0" onclick="location.href='balcon/balconysia.html'"></div>
    <div class="zone" id="z1" onclick="openWork(1)"></div>
    <div class="zone" id="z2" onclick="openWork(2)"></div>
    <div class="zone" id="z3" onclick="openWork(3)"></div>
    <div class="zone" id="z4" onclick="openWork(4)"></div>
    <div class="zone" id="z5" onclick="openWork(5)"></div>

    <!-- Планета (без полос) -->
    <div id="planet" onclick="location.href='volna2.html'"></div>

    <!-- Кнопка "Назад" -->
    <div id="backBtn" onclick="location.href='vestibul.html'">←</div>

    <div id="hint">Клик по картине — открыть работу и табличку</div>
</div>

<!-- Просмотрщик -->
<div id="viewer" onclick="closeWork()">
    <div id="close">×</div>
    <img id="tablet" src="" alt="табличка">
    <img id="big" src="">
    <div id="caption"></div>
</div>

<script>
const extensions = ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"];

function openWork(n) {
    const viewer = document.getElementById("viewer");
    const big = document.getElementById("big");
    const tablet = document.getElementById("tablet");
    const caption = document.getElementById("caption");

    tablet.style.display = "none";
    viewer.classList.remove("has-tablet");
    tablet.removeAttribute("src");

    let index = 0;

    function tryNextBig() {
        if (index >= extensions.length) {
            caption.textContent = "Не найден файл works/" + n + ".jpg";
            big.removeAttribute("src");
            viewer.style.display = "flex";
            return;
        }
        const src = "works/" + n + "." + extensions[index];
        index++;
        big.onerror = tryNextBig;
        big.onload = function() {
            big.onerror = null;
            caption.textContent = "ГОСТИННАЯ ВОЛНЫ · Картина №" + n;
            loadTablet(n);
            viewer.style.display = "flex";
        };
        big.src = src;
    }

    function loadTablet(n) {
        let idx = 0;
        function tryNextTab() {
            if (idx >= extensions.length) {
                tablet.style.display = "none";
                viewer.classList.remove("has-tablet");
                return;
            }
            const src = "works/tablica" + n + "." + extensions[idx];
            idx++;
            tablet.onerror = tryNextTab;
            tablet.onload = function() {
                tablet.onerror = null;
                tablet.style.display = "block";
                viewer.classList.add("has-tablet");
            };
            tablet.src = src;
        }
        tryNextTab();
    }

    tryNextBig();
}

function closeWork() {
    const viewer = document.getElementById("viewer");
    const big = document.getElementById("big");
    const tablet = document.getElementById("tablet");
    viewer.style.display = "none";
    big.removeAttribute("src");
    tablet.removeAttribute("src");
    tablet.style.display = "none";
    viewer.classList.remove("has-tablet");
}

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeWork();
});
</script>

</body>
</html>
