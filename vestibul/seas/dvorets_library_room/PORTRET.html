<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ГАЛЕРЕЯ ПОРТРЕТОВ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
        }
        body {
            background:
                radial-gradient(circle at 50% 18%, rgba(210, 220, 255, .08), transparent 30%),
                radial-gradient(circle at 16% 76%, rgba(120, 130, 180, .055), transparent 36%),
                radial-gradient(circle at 82% 67%, rgba(100, 90, 140, .06), transparent 34%),
                linear-gradient(to bottom, #060609, #020203 48%, #000 100%);
            position: relative;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }
        body::before {
            background: linear-gradient(to right, rgba(0, 0, 0, .95), rgba(0, 0, 0, .22) 13%, transparent 27%, transparent 73%, rgba(0, 0, 0, .22) 87%, rgba(0, 0, 0, .95));
        }
        body::after {
            background: linear-gradient(to bottom, rgba(0, 0, 0, .85), transparent 20%, transparent 72%, rgba(0, 0, 0, .72));
        }

        .fog {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background:
                radial-gradient(circle at 35% 40%, rgba(255, 255, 255, .035), transparent 26%),
                radial-gradient(circle at 70% 58%, rgba(220, 230, 255, .03), transparent 30%);
            animation: fog 14s ease-in-out infinite alternate;
        }
        @keyframes fog {
            from {
                transform: translateX(-1.2%) scale(1);
            }
            to {
                transform: translateX(1.2%) scale(1.025);
            }
        }

        .title {
            position: fixed;
            top: 3.5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            white-space: nowrap;
            letter-spacing: clamp(4px, .75vw, 11px);
            font-size: clamp(19px, 2.1vw, 36px);
            color: rgba(230, 235, 245, .92);
            text-shadow: 0 0 18px rgba(215, 225, 255, .23);
            pointer-events: none;
        }

        .help {
            position: fixed;
            bottom: 2.4vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            padding: 8px 14px;
            border: 1px solid rgba(220, 225, 240, .1);
            border-radius: 999px;
            background: rgba(0, 0, 0, .35);
            color: rgba(220, 226, 238, .56);
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .stage {
            position: absolute;
            inset: 0;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10vh 8vw 8vh;
        }

        .frameOuter {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
        }

        .frameBirth {
            opacity: 0;
            filter: blur(14px);
            transform: scale(1.12);
            animation: birth 3.2s ease forwards;
        }
        @keyframes birth {
            0% {
                opacity: 0;
                filter: blur(16px);
                transform: scale(1.14);
            }
            45% {
                opacity: .45;
            }
            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
            }
        }

        .frame {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            padding: clamp(15px, 1.7vw, 28px);
            border-radius: 18px;
            background:
                radial-gradient(circle at 17% 15%, rgba(255, 210, 145, .18), transparent 13%),
                repeating-linear-gradient(38deg, rgba(255, 210, 155, .06) 0 7px, transparent 8px 23px),
                linear-gradient(140deg, #160804, #3e1d0d 38%, #120603 63%, #74411e);
            box-shadow:
                0 35px 90px rgba(0, 0, 0, .75),
                inset 0 0 0 2px rgba(255, 210, 140, .08),
                inset 0 0 0 10px rgba(0, 0, 0, .32),
                inset 0 0 30px rgba(0, 0, 0, .7);
        }
        .frame::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 7px ridge rgba(120, 66, 28, .75);
            border-radius: 14px;
            pointer-events: none;
            z-index: 2;
        }
        .frame::after {
            content: "";
            position: absolute;
            inset: 22px;
            border: 2px solid rgba(235, 180, 105, .15);
            border-radius: 6px;
            pointer-events: none;
            z-index: 3;
        }

        .pictureBox {
            position: relative;
            z-index: 1;
            background: #010101;
            border-radius: 7px;
            overflow: hidden;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, .08),
                inset 0 0 45px rgba(0, 0, 0, .75);
            min-width: 200px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pictureBox img {
            display: block;
            max-width: calc(84vw - 360px);
            max-height: 70vh;
            width: auto;
            height: auto;
            object-fit: contain;
            background: #000;
            user-select: none;
            -webkit-user-drag: none;
            cursor: pointer;
            transition: opacity .3s ease;
        }
        .pictureBox .miss {
            display: none;
            align-items: center;
            justify-content: center;
            width: min(720px, 60vw);
            height: min(520px, 64vh);
            padding: 30px;
            color: rgba(235, 235, 245, .6);
            text-align: center;
            letter-spacing: 1px;
            background: radial-gradient(circle at 50% 42%, rgba(220, 230, 255, .08), transparent 28%), #040404;
        }
        .pictureBox.noImage img {
            display: none;
        }
        .pictureBox.noImage .miss {
            display: flex;
        }

        /* Навигация */
        .nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 45;
            width: 56px;
            height: 86px;
            border: 1px solid rgba(230, 210, 180, .2);
            border-radius: 999px;
            background: rgba(15, 10, 8, .44);
            color: rgba(245, 235, 220, .78);
            font-size: 42px;
            font-family: Georgia, serif;
            cursor: pointer;
            transition: background .25s, color .25s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .nav:hover {
            background: rgba(70, 38, 18, .55);
            color: #fff;
        }
        .prev {
            left: 2.6vw;
        }
        .next {
            right: 2.6vw;
        }

        .counter {
            position: fixed;
            right: 3vw;
            top: 14vh;
            z-index: 45;
            color: rgba(226, 232, 241, .68);
            letter-spacing: 2px;
            font-size: 14px;
            background: rgba(5, 5, 7, .28);
            border: 1px solid rgba(215, 225, 240, .08);
            border-radius: 999px;
            padding: 10px 13px;
            pointer-events: none;
            font-family: Georgia, serif;
        }

        /* Просмотр во весь экран */
        .viewer {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
            background: rgba(0, 0, 0, .88);
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        .viewer.open {
            display: flex;
        }
        .viewer img {
            max-width: 96vw;
            max-height: 92vh;
            object-fit: contain;
            border: 14px solid #160804;
            box-shadow:
                0 25px 90px rgba(0, 0, 0, .9),
                0 0 0 2px rgba(220, 160, 90, .22);
            cursor: zoom-out;
            user-select: none;
            -webkit-user-drag: none;
        }
        .close {
            position: fixed;
            top: 22px;
            right: 26px;
            z-index: 85;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .22);
            background: rgba(0, 0, 0, .4);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            font-family: Georgia, serif;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: background .2s;
        }
        .close:hover {
            background: rgba(255, 255, 255, .15);
        }

        /* Адаптив */
        @media (max-width: 980px) {
            .stage {
                padding: 9vh 6vw 7vh;
            }
            .pictureBox img {
                max-width: 82vw;
                max-height: 58vh;
            }
            .help {
                display: none;
            }
            .counter {
                top: auto;
                bottom: 2vh;
                right: 2.4vw;
                font-size: 12px;
                padding: 8px 11px;
            }
            .nav {
                width: 44px;
                height: 66px;
                font-size: 32px;
            }
            .prev {
                left: 1.2vw;
            }
            .next {
                right: 1.2vw;
            }
        }
        @media (max-width: 600px) {
            .title {
                font-size: clamp(16px, 3.2vw, 22px);
                top: 2vh;
                letter-spacing: 2px;
            }
            .nav {
                width: 36px;
                height: 54px;
                font-size: 24px;
            }
            .frame {
                padding: clamp(8px, 1.2vw, 14px);
            }
            .pictureBox img {
                max-width: 88vw;
                max-height: 52vh;
            }
            .counter {
                font-size: 11px;
                padding: 6px 9px;
                right: 1.6vw;
                bottom: 1.6vh;
            }
        }
    </style>
</head>
<body>

    <div class="fog"></div>
    <div class="title">ГАЛЕРЕЯ ПОРТРЕТОВ</div>
    <div class="help">← → листать • клик по картине — просмотр</div>

    <button class="nav prev" id="prev" aria-label="Предыдущая">‹</button>
    <button class="nav next" id="next" aria-label="Следующая">›</button>

    <div class="counter"><span id="now">01</span> / <span id="all">35</span></div>

    <main class="stage">
        <div class="frameOuter">
            <div class="frameBirth" id="birth">
                <div class="frame">
                    <div class="pictureBox" id="box">
                        <img id="img" alt="галерея портретов" draggable="false" />
                        <div class="miss" id="miss"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <section class="viewer" id="viewer">
        <button class="close" id="close" aria-label="Закрыть">✕</button>
        <img id="big" alt="Просмотр картины" draggable="false" />
    </section>

    <script>
        (function() {
            const TOTAL = 35;
            const FOLDER = 'MOON_1/';
            const exts = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG', 'webp', 'WEBP', 'gif', 'GIF'];

            let current = 1;
            let activeSrc = '';

            const img = document.getElementById('img');
            const box = document.getElementById('box');
            const miss = document.getElementById('miss');
            const now = document.getElementById('now');
            const all = document.getElementById('all');
            const viewer = document.getElementById('viewer');
            const big = document.getElementById('big');
            const birth = document.getElementById('birth');

            all.textContent = String(TOTAL).padStart(2, '0');

            function pad(n) {
                return String(n).padStart(2, '0');
            }

            function candidates(i) {
                const p = pad(i);
                const list = [];
                // сначала пробуем файлы с расширениями в папке
                exts.forEach(e => list.push(FOLDER + p + '.' + e));
                // затем без папки (как fallback)
                exts.forEach(e => list.push(p + '.' + e));
                // и совсем без расширения
                list.push(FOLDER + p);
                list.push(p);
                return list;
            }

            function load(i) {
                activeSrc = '';
                box.classList.remove('noImage');
                img.style.opacity = '0.2';

                const list = candidates(i);
                let k = 0;

                function next() {
                    if (k >= list.length) {
                        img.removeAttribute('src');
                        img.style.opacity = '1';
                        box.classList.add('noImage');
                        miss.textContent = 'Не найден файл ' + pad(i) +
                            ' — положите его рядом как ' + pad(i) + '.jpg или в папку ' + FOLDER + ' как ' + pad(i) +
                            '.jpg';
                        return;
                    }
                    const src = list[k++];
                    img.onload = function() {
                        activeSrc = src;
                        img.style.opacity = '1';
                    };
                    img.onerror = function() {
                        next();
                    };
                    img.src = src;
                }
                next();
            }

            function render() {
                now.textContent = pad(current);
                // сбрасываем анимацию для первого кадра после первого
                if (current !== 1) {
                    birth.style.animation = 'none';
                    birth.style.opacity = '1';
                    birth.style.filter = 'none';
                    birth.style.transform = 'none';
                } else {
                    // для первого кадра оставляем анимацию
                    birth.style.animation = '';
                    birth.style.opacity = '';
                    birth.style.filter = '';
                    birth.style.transform = '';
                }
                load(current);
            }

            function go(delta) {
                current += delta;
                if (current < 1) current = TOTAL;
                if (current > TOTAL) current = 1;
                render();
            }

            // Навигация
            document.getElementById('prev').onclick = function() { go(-1); };
            document.getElementById('next').onclick = function() { go(1); };

            // Клавиши
            window.onkeydown = function(e) {
                // если открыт просмотр — обрабатываем Escape
                if (viewer.classList.contains('open')) {
                    if (e.key === 'Escape') {
                        viewer.classList.remove('open');
                    }
                    return;
                }
                // стрелки
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    go(1);
                }
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    go(-1);
                }
            };

            // Просмотр по клику на картинку
            img.onclick = function() {
                if (!activeSrc) return;
                big.src = activeSrc;
                viewer.classList.add('open');
            };

            // Закрытие просмотра
            document.getElementById('close').onclick = function() {
                viewer.classList.remove('open');
            };
            viewer.onclick = function(e) {
                if (e.target === viewer || e.target === big) {
                    viewer.classList.remove('open');
                }
            };

            // Старт
            render();
        })();
    </script>
</body>
</html>
