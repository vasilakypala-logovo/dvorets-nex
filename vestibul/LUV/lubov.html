<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ГОСТИННАЯ ЛЮБВИ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #120c0b;
    font-family: Arial, sans-serif;
}

#stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #120c0b;
}

#room {
    position: absolute;
    inset: 0;
    background-image: url("room.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

.zone {
    position: absolute;
    cursor: pointer;
    background: transparent;
    border: none;
}

/* Зоны кликабельные, но полностью невидимые — без квадратов и подсветок */

#z1 {
    left: 6.4%;
    top: 27.7%;
    width: 8.8%;
    height: 43.6%;
}

#z2 {
    left: 27.0%;
    top: 40.2%;
    width: 10.8%;
    height: 26.2%;
}

#z3 {
    left: 43.0%;
    top: 34.5%;
    width: 16.0%;
    height: 36.3%;
}

#z4 {
    left: 64.2%;
    top: 40.5%;
    width: 11.2%;
    height: 27.0%;
}

#z5 {
    left: 86.4%;
    top: 27.7%;
    width: 8.6%;
    height: 43.5%;
}

#hint {
    position: absolute;
    left: 18px;
    bottom: 14px;
    color: rgba(255,245,238,0.76);
    background: rgba(45,20,16,0.36);
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    user-select: none;
    letter-spacing: .3px;
}

#title {
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    color: rgba(255,238,226,0.84);
    background: rgba(45,20,16,0.24);
    padding: 8px 18px;
    border-radius: 16px;
    font-size: 18px;
    letter-spacing: 2px;
    user-select: none;
    text-shadow: 0 0 10px rgba(255,200,170,0.35);
}

#viewer {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, rgba(80,35,30,0.35), rgba(0,0,0,0.94) 55%),
        rgba(0,0,0,0.94);
    z-index: 100;
}

#big {
    max-width: 96vw;
    max-height: 94vh;
    object-fit: contain;
    box-shadow:
        0 0 45px rgba(255,215,190,0.20),
        0 0 120px rgba(180,80,60,0.18);
}

#close {
    position: fixed;
    right: 24px;
    top: 16px;
    color: rgba(255,245,240,0.95);
    font-size: 44px;
    line-height: 44px;
    cursor: pointer;
    user-select: none;
    z-index: 110;
}

#caption {
    position: fixed;
    left: 20px;
    bottom: 16px;
    color: rgba(255,245,238,0.82);
    background: rgba(45,20,16,0.42);
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 15px;
    z-index: 110;
}
</style>
</head>

<body>

<div id="stage">
    <div id="room"></div>
    <div id="title">Reflections on the Mirror</div>

    <div class="zone" id="z1" onclick="openWork(1)" title="portret"></div>
    <div class="zone" id="z2" onclick="openWork(2)" title="rusin/balcony"></div>
    <div class="zone" id="z3" onclick="openWork(3)" title="Картина 3"></div>
    <div class="zone" id="z4" onclick="openWork(4)" title="Картина 4"></div>
    <div class="zone" id="z5" onclick="openWork(5)" title="balconyud"></div>

    <div id="hint">Клик по картине — открыть работу из папки works</div>
</div>

<div id="viewer" onclick="closeWork()">
    <div id="close">×</div>
    <img id="big" src="">
    <div id="caption"></div>
</div>

<script>
const extensions = ["jpg", "jpeg", "png", "html", "webp", "JPG", "JPEG", "PNG", "WEBP"];
    function openWork(n) {
        // Вторая картина открывает портал
    if (n === 2) {
        window.location.href = "works/rusin/balcony.html";
        return;
    }

function openWork(n) {
        // Пятая картина открывает портал
    if (n === 5) {
        window.location.href = "works/balconyud.html";
        return;
    }

    const big = document.getElementById("big");
    const viewer = document.getElementById("viewer");
    const caption = document.getElementById("caption");
    let index = 0;


    function tryNext() {
        if (index >= extensions.length) {
           caption.textContent = "Файл works/" + n + " не найден.";
            big.removeAttribute("src");
            viewer.style.display = "flex";
            return;
        }

        const testSrc = "works/" + n + "." + extensions[index];
        index++;

        big.onerror = tryNext;
        big.onload = function() {
            big.onerror = null;
            caption.textContent = "ГОСТИННАЯ ЛЮБВИ · Картина №" + n;
            viewer.style.display = "flex";
        };
        big.src = testSrc;
    }

    tryNext();
}

function closeWork() {
    document.getElementById("viewer").style.display = "none";
    document.getElementById("big").removeAttribute("src");
}

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeWork();
});
</script>

</body>
</html>
