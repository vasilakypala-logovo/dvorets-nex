<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Балкон-мороз · Таврический принт</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e1b0b;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    #garden {
      position: relative;
      width: 100%;
      height: 100%;
      background-image: url('balcony_les.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #morningGlow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 22% 18%, rgba(215, 240, 180, 0.22), transparent 30%),
        radial-gradient(circle at 70% 55%, rgba(200, 230, 160, 0.12), transparent 35%),
        linear-gradient(145deg, rgba(40, 70, 30, 0.10), rgba(10, 20, 8, 0.25));
      mix-blend-mode: screen;
    }

    #dewVeil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(230, 250, 210, 0.30) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(200, 230, 170, 0.20) 0 1px, transparent 2px);
      background-size: 140px 100px, 220px 160px;
      background-position: 15% 60%, 75% 45%;
      opacity: 0.25;
      animation: dew 9s ease-in-out infinite alternate;
    }

    @keyframes dew {
      0% { opacity: 0.18; filter: blur(0.2px); }
      100% { opacity: 0.32; filter: blur(0.8px); }
    }

    .zone {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      border-radius: 50%;
    }

    #logovoZone {
      left: 32%;
      top: 45%;
      width: 18%;
      height: 20%;
      border-radius: 50%;
    }

    #backZone {
      left: 2%;
      top: 3%;
      width: 10%;
      height: 12%;
      border-radius: 40%;
    }

    .show-hotspots .zone {
      background: rgba(200, 240, 160, 0.20);
      outline: 2px solid rgba(220, 255, 180, 0.70);
      box-shadow: 0 0 35px rgba(180, 230, 130, 0.45);
    }

    /* ===== ОБНОВЛЁННЫЙ ТИТЛ — ЖЁЛТО-ЗЕЛЁНЫЙ ===== */
    #artist-title {
      position: fixed;
      top: 24px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: 'Georgia', serif;
      font-size: 38px;
      letter-spacing: 0.15em;
      color: #d4e87a;
      text-shadow:
        0 0 12px rgba(180, 230, 80, 0.70),
        0 0 30px rgba(160, 210, 60, 0.50),
        0 0 60px rgba(130, 190, 40, 0.35),
        0 0 90px rgba(100, 170, 20, 0.20);
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      animation:
        titleFade 16s ease-in-out infinite,
        titleFloat 12s ease-in-out infinite;
    }

    @keyframes titleFade {
      0% { opacity: 0; }
      20% { opacity: 0.92; }
      75% { opacity: 0.88; }
      100% { opacity: 0; }
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    #caption {
      position: absolute;
      left: 50%;
      bottom: 4.5%;
      transform: translateX(-50%);
      z-index: 24;
      padding: 10px 22px;
      color: rgba(235, 248, 210, 0.85);
      background: rgba(20, 35, 15, 0.35);
      border: 1px solid rgba(200, 235, 160, 0.25);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.25), inset 0 0 20px rgba(200, 240, 150, 0.06);
      backdrop-filter: blur(5px);
      font-size: 14px;
      letter-spacing: 0.12em;
      text-align: center;
      opacity: 0.75;
      pointer-events: none;
      border-radius: 2px;
    }

    #musicHint {
      position: absolute;
      right: 2.5%;
      bottom: 3%;
      z-index: 25;
      color: rgba(230, 245, 200, 0.70);
      font-size: 11px;
      letter-spacing: 0.08em;
      background: rgba(15, 30, 10, 0.40);
      border: 1px solid rgba(190, 225, 150, 0.18);
      padding: 7px 12px;
      opacity: 0;
      transition: opacity 0.5s ease;
      border-radius: 2px;
    }

    #musicHint.show {
      opacity: 0.9;
    }

    /* ===== ПЛАВАЮЩАЯ ГАЛЕРЕЯ ===== */
    #floatingGallery {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 8;
    }

    .floatArt {
      position: absolute;
      width: 220px;
      padding: 6px;
      background: rgba(235, 240, 215, 0.80);
      box-shadow:
        0 0 14px rgba(200, 255, 180, 0.20),
        0 14px 32px rgba(0, 0, 0, 0.50);
      opacity: 0;
      transform: translateX(110vw) scale(0.92);
      animation: forestFloat 30s linear forwards;
      border-radius: 1px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.1s;
    }

    .floatArt:hover {
      transform: translateX(110vw) scale(0.95);
      box-shadow: 0 0 30px rgba(200, 255, 180, 0.40), 0 14px 32px rgba(0, 0, 0, 0.60);
    }

    .floatArt img {
      width: 100%;
      display: block;
      border-radius: 0;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.20);
      pointer-events: none;
    }

    @keyframes forestFloat {
      0% {
        opacity: 0;
        transform: translateX(110vw) scale(0.88);
      }
      12% { opacity: 1; }
      80% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translateX(-35vw) scale(1.02);
      }
    }

    /* ===== РАЗВЕРНУТАЯ КАРТИНА (оверлей) ===== */
    #expandedOverlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(10, 15, 8, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }

    #expandedOverlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    #expandedImage {
      max-height: 92vh;
      max-width: 92vw;
      object-fit: contain;
      box-shadow: 0 0 60px rgba(180, 230, 140, 0.30), 0 20px 60px rgba(0, 0, 0, 0.80);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.30);
      padding: 8px;
      animation: zoomIn 0.5s ease;
    }

    @keyframes zoomIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #closeExpanded {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 9999;
      font-size: 48px;
      color: rgba(230, 245, 210, 0.85);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Georgia', serif;
      transition: all 0.3s ease;
      text-shadow: 0 0 30px rgba(0, 0, 0, 0.80);
      pointer-events: auto;
      line-height: 1;
    }

    #closeExpanded:hover {
      transform: rotate(90deg) scale(1.2);
      color: rgba(255, 255, 255, 1);
    }

    @media (max-width: 700px) {
      #artist-title {
        font-size: 26px;
        letter-spacing: 0.10em;
        top: 16px;
      }
      .floatArt {
        width: 160px;
      }
      #caption {
        font-size: 11px;
        padding: 6px 14px;
        bottom: 3.5%;
      }
      #closeExpanded {
        font-size: 38px;
        top: 20px;
        right: 25px;
      }
      #expandedImage {
        max-height: 80vh;
        max-width: 95vw;
      }
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

<div id="garden">
  <div id="artist-title">Vasily Yudov · tavria print · Olviopol</div>

  <div id="morningGlow"></div>
  <div id="dewVeil"></div>

  <div class="zone" id="backZone" title="Вернуться в зал" onclick="window.location.href='index.html'"></div>
  <div class="zone" id="logovoZone" title="Перейти в Логово" onclick="window.location.href='https://vasilakypala-logovo.github.io/logovo/logovo.html'"></div>

  <div id="caption">moroz balkon · tishina i svet</div>
  <div id="musicHint">нажмите в любом месте — музыка оживёт</div>
  <audio id="echo" loop preload="auto"></audio>
</div>

<div id="floatingGallery"></div>

<!-- ===== ОВЕРЛЕЙ ДЛЯ УВЕЛИЧЕННОЙ КАРТИНЫ ===== -->
<div id="expandedOverlay">
  <button id="closeExpanded" title="Закрыть">✕</button>
  <img id="expandedImage" src="" alt="Увеличенная работа">
</div>

<script>
  (function() {
    const echo = document.getElementById('echo');
    const hint = document.getElementById('musicHint');
    const floatingGallery = document.getElementById('floatingGallery');

    // ===== ОВЕРЛЕЙ =====
    const overlay = document.getElementById('expandedOverlay');
    const expandedImg = document.getElementById('expandedImage');
    const closeBtn = document.getElementById('closeExpanded');

    // ===== МАССИВ КАРТИН (pr1.jpg … pr33.jpg) =====
    const forestPictures = [];
    for (let i = 1; i <= 33; i++) {
      forestPictures.push('pr' + i + '.jpg');
    }

    let pictureIndex = 0;

    // ===== ФУНКЦИЯ: РАЗВЕРНУТЬ КАРТИНУ =====
    function expandImage(src) {
      expandedImg.src = src;
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // ===== ФУНКЦИЯ: ЗАКРЫТЬ РАЗВЕРНУТУЮ =====
    function closeExpandedImage() {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(() => {
        if (!overlay.classList.contains('active')) {
          expandedImg.src = '';
        }
      }, 300);
    }

    // ===== СОБЫТИЯ ДЛЯ ОВЕРЛЕЯ =====
    closeBtn.addEventListener('click', closeExpandedImage);

    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) {
        closeExpandedImage();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (overlay.classList.contains('active')) {
          closeExpandedImage();
        } else {
          window.location.href = 'index.html';
        }
      }
    });

    // ===== ФУНКЦИЯ: ЗАПУСК ОДНОЙ ПЛАВАЮЩЕЙ РАБОТЫ =====
    function launchForestPicture() {
      if (!floatingGallery) return;

      const frame = document.createElement('div');
      frame.className = 'floatArt';

      const img = document.createElement('img');
      const src = forestPictures[pictureIndex];
      img.src = src;
      img.alt = 'Vasily Yudov · print ' + (pictureIndex + 1);
      img.draggable = false;

      frame.appendChild(img);

      const top = 5 + Math.random() * 38;
      frame.style.top = top + '%';

      const size = 160 + Math.random() * 90;
      frame.style.width = size + 'px';

      frame.addEventListener('click', function(e) {
        e.stopPropagation();
        const imgEl = this.querySelector('img');
        if (imgEl) {
          expandImage(imgEl.src);
        }
      });

      floatingGallery.appendChild(frame);

      pictureIndex = (pictureIndex + 1) % forestPictures.length;

      setTimeout(() => {
        if (frame.parentNode) frame.remove();
      }, 30000);
    }

    // ===== МУЗЫКА =====
    function startEcho() {
      try {
        echo.src = 'OZERO31.mp3';
        echo.volume = 0.20;

        const playPromise = echo.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            hint.classList.add('show');
          });
        }
      } catch (e) {
        hint.classList.add('show');
      }
    }

    // ===== СТАРТ =====
    startEcho();
    launchForestPicture();
    setInterval(launchForestPicture, 4800);

    document.addEventListener('click', function() {
      if (echo.paused) {
        startEcho();
      }
      hint.classList.remove('show');
    }, false);

    document.addEventListener('keydown', function(e) {
      if (e.key.toLowerCase() === 'h') {
        document.body.classList.toggle('show-hotspots');
      }
    });

  })();
</script>

</body>
</html>
