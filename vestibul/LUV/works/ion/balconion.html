<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ion Carchelan · acuarelă · Chișinău</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e6e5da;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    #garden {
      position: relative;
      width: 100%;
      height: 100%;
      background-image: url('balconion.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #morningGlow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 25% 20%, rgba(235, 225, 190, 0.25), transparent 35%),
        radial-gradient(circle at 75% 60%, rgba(210, 195, 165, 0.15), transparent 40%),
        linear-gradient(145deg, rgba(180, 170, 140, 0.08), rgba(80, 75, 60, 0.12));
      mix-blend-mode: soft-light;
    }

    #dewVeil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(235, 225, 200, 0.20) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(210, 195, 170, 0.15) 0 1px, transparent 2px);
      background-size: 160px 120px, 240px 180px;
      background-position: 10% 50%, 80% 40%;
      opacity: 0.20;
      animation: dew 11s ease-in-out infinite alternate;
    }

    @keyframes dew {
      0% { opacity: 0.15; filter: blur(0.3px); }
      100% { opacity: 0.30; filter: blur(0.6px); }
    }

    .zone {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      border-radius: 50%;
    }

    #logovoZone {
      left: 32%;
      top: 45%;
      width: 18%;
      height: 20%;
      border-radius: 50%;
    }

    #backZone {
      left: 2%;
      top: 3%;
      width: 10%;
      height: 12%;
      border-radius: 40%;
    }

    .show-hotspots .zone {
      background: rgba(200, 190, 160, 0.20);
      outline: 2px solid rgba(210, 195, 160, 0.70);
      box-shadow: 0 0 35px rgba(190, 175, 140, 0.45);
    }

    /* ===== ТИТЛ — ТЁМНО-ОРАНЖЕВЫЙ ===== */
    #artist-title {
      position: fixed;
      top: 24px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: 'Georgia', serif;
      font-size: 36px;
      letter-spacing: 0.12em;
      color: #b85a1a;
      text-shadow:
        0 0 12px rgba(200, 100, 30, 0.55),
        0 0 30px rgba(180, 80, 20, 0.40),
        0 0 60px rgba(150, 60, 10, 0.25),
        0 0 90px rgba(120, 40, 0, 0.15);
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      animation:
        titleFade 18s ease-in-out infinite,
        titleFloat 14s ease-in-out infinite;
    }

    @keyframes titleFade {
      0% { opacity: 0; }
      20% { opacity: 0.95; }
      75% { opacity: 0.90; }
      100% { opacity: 0; }
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }

    #caption {
      position: absolute;
      left: 50%;
      bottom: 4.5%;
      transform: translateX(-50%);
      z-index: 24;
      padding: 10px 22px;
      color: rgba(215, 205, 180, 0.85);
      background: rgba(60, 55, 45, 0.30);
      border: 1px solid rgba(190, 175, 150, 0.25);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.20), inset 0 0 20px rgba(200, 185, 150, 0.06);
      backdrop-filter: blur(4px);
      font-size: 14px;
      letter-spacing: 0.12em;
      text-align: center;
      opacity: 0.80;
      pointer-events: none;
      border-radius: 2px;
    }

    #musicHint {
      position: absolute;
      right: 2.5%;
      bottom: 3%;
      z-index: 25;
      color: rgba(210, 200, 175, 0.70);
      font-size: 11px;
      letter-spacing: 0.08em;
      background: rgba(50, 45, 35, 0.40);
      border: 1px solid rgba(180, 165, 140, 0.18);
      padding: 7px 12px;
      opacity: 0;
      transition: opacity 0.5s ease;
      border-radius: 2px;
    }

    #musicHint.show {
      opacity: 0.9;
    }

    /* ===== ПЛАВАЮЩАЯ ГАЛЕРЕЯ ===== */
    #floatingGallery {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 8;
    }

    .floatArt {
      position: absolute;
      width: 220px;
      padding: 6px;
      background: rgba(235, 230, 215, 0.85);
      box-shadow:
        0 0 14px rgba(190, 180, 155, 0.25),
        0 14px 32px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateX(110vw) scale(0.92);
      animation: forestFloat 32s linear forwards;
      border-radius: 2px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.1s;
    }

    .floatArt:hover {
      transform: translateX(110vw) scale(0.96);
      box-shadow: 0 0 30px rgba(200, 185, 155, 0.45), 0 14px 32px rgba(0, 0, 0, 0.55);
    }

    .floatArt img {
      width: 100%;
      display: block;
      border-radius: 0;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }

    @keyframes forestFloat {
      0% {
        opacity: 0;
        transform: translateX(110vw) scale(0.88);
      }
      12% { opacity: 1; }
      80% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translateX(-35vw) scale(1.02);
      }
    }

    /* ===== РАЗВЕРНУТАЯ КАРТИНА (оверлей) ===== */
    #expandedOverlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(30, 28, 22, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }

    #expandedOverlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    #expandedImage {
      max-height: 92vh;
      max-width: 92vw;
      object-fit: contain;
      box-shadow: 0 0 60px rgba(190, 175, 140, 0.30), 0 20px 60px rgba(0, 0, 0, 0.80);
      border-radius: 4px;
      background: rgba(20, 18, 14, 0.40);
      padding: 8px;
      animation: zoomIn 0.5s ease;
    }

    @keyframes zoomIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #closeExpanded {
      position: fixed;
      top: 30px;
      right: 40px;
      z-index: 9999;
      font-size: 48px;
      color: rgba(220, 210, 185, 0.85);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Georgia', serif;
      transition: all 0.3s ease;
      text-shadow: 0 0 30px rgba(0, 0, 0, 0.80);
      pointer-events: auto;
      line-height: 1;
    }

    #closeExpanded:hover {
      transform: rotate(90deg) scale(1.2);
      color: rgba(245, 240, 225, 1);
    }

    @media (max-width: 700px) {
      #artist-title {
        font-size: 24px;
        letter-spacing: 0.08em;
        top: 16px;
      }
      .floatArt {
        width: 150px;
      }
      #caption {
        font-size: 11px;
        padding: 6px 14px;
        bottom: 3.5%;
      }
      #closeExpanded {
        font-size: 38px;
        top: 20px;
        right: 25px;
      }
      #expandedImage {
        max-height: 80vh;
        max-width: 95vw;
      }
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

<div id="garden">
  <div id="artist-title">Ion Carchelan · watercolor · Chisinau</div>

  <div id="morningGlow"></div>
  <div id="dewVeil"></div>

  <div class="zone" id="backZone" title="Înapoi în sală" onclick="window.location.href='index.html'"></div>
  <div class="zone" id="logovoZone" title="Mergi în Logovo" onclick="window.location.href='https://vasilakypala-logovo.github.io/logovo/logovo.html'"></div>

  <div id="caption">balcon · lumină şi linişte</div>
  <div id="musicHint">atinge oriunde — muzica prinde viaţă</div>
  <audio id="echo" loop preload="auto"></audio>
</div>

<div id="floatingGallery"></div>

<!-- ===== ОВЕРЛЕЙ ДЛЯ УВЕЛИЧЕННОЙ КАРТИНЫ ===== -->
<div id="expandedOverlay">
  <button id="closeExpanded" title="Închide">✕</button>
  <img id="expandedImage" src="" alt="Ion Carchelan — lucrare mărită">
</div>

<script>
  (function() {
    const echo = document.getElementById('echo');
    const hint = document.getElementById('musicHint');
    const floatingGallery = document.getElementById('floatingGallery');

    // ===== ОВЕРЛЕЙ =====
    const overlay = document.getElementById('expandedOverlay');
    const expandedImg = document.getElementById('expandedImage');
    const closeBtn = document.getElementById('closeExpanded');

    // ===== МАССИВ КАРТИН (io1.jpg … io45.jpg) =====
    const forestPictures = [];
    for (let i = 1; i <= 45; i++) {
      forestPictures.push('io' + i + '.jpg');
    }

    let pictureIndex = 0;

    // ===== ФУНКЦИЯ: РАЗВЕРНУТЬ КАРТИНУ =====
    function expandImage(src) {
      expandedImg.src = src;
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // ===== ФУНКЦИЯ: ЗАКРЫТЬ РАЗВЕРНУТУЮ =====
    function closeExpandedImage() {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(() => {
        if (!overlay.classList.contains('active')) {
          expandedImg.src = '';
        }
      }, 300);
    }

    // ===== СОБЫТИЯ ДЛЯ ОВЕРЛЕЯ =====
    closeBtn.addEventListener('click', closeExpandedImage);

    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) {
        closeExpandedImage();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (overlay.classList.contains('active')) {
          closeExpandedImage();
        } else {
          window.location.href = 'index.html';
        }
      }
    });

    // ===== ФУНКЦИЯ: ЗАПУСК ОДНОЙ ПЛАВАЮЩЕЙ РАБОТЫ =====
    function launchForestPicture() {
      if (!floatingGallery) return;

      const frame = document.createElement('div');
      frame.className = 'floatArt';

      const img = document.createElement('img');
      const src = forestPictures[pictureIndex];
      img.src = src;
      img.alt = 'Ion Carchelan · acuarelă ' + (pictureIndex + 1);
      img.draggable = false;

      frame.appendChild(img);

      const top = 5 + Math.random() * 38;
      frame.style.top = top + '%';

      const size = 150 + Math.random() * 100;
      frame.style.width = size + 'px';

      frame.addEventListener('click', function(e) {
        e.stopPropagation();
        const imgEl = this.querySelector('img');
        if (imgEl) {
          expandImage(imgEl.src);
        }
      });

      floatingGallery.appendChild(frame);

      pictureIndex = (pictureIndex + 1) % forestPictures.length;

      setTimeout(() => {
        if (frame.parentNode) frame.remove();
      }, 32000);
    }

    // ===== МУЗЫКА =====
    function startEcho() {
      try {
        echo.src = 'OZERO5.mp3';
        echo.volume = 0.20;

        const playPromise = echo.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            hint.classList.add('show');
          });
        }
      } catch (e) {
        hint.classList.add('show');
      }
    }

    // ===== СТАРТ =====
    startEcho();
    launchForestPicture();
    setInterval(launchForestPicture, 4800);

    document.addEventListener('click', function() {
      if (echo.paused) {
        startEcho();
      }
      hint.classList.remove('show');
    }, false);

    document.addEventListener('keydown', function(e) {
      if (e.key.toLowerCase() === 'h') {
        document.body.classList.toggle('show-hotspots');
      }
    });

  })();
</script>

</body>
</html>
