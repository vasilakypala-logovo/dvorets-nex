<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ГАЛЕРЕЯ ПРЕЗЕНТАЦИЙ</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#0d0803;
  --panel:#1b1207;
  --card:#201608;
  --gold:#ffd700;
  --gold-soft:rgba(255,215,0,.42);
  --gold-line:rgba(255,215,0,.62);
  --line:rgba(255,215,0,.20);
  --line2:rgba(255,255,255,.07);
  --text:#f3ecdc;
  --muted:#aa9f7f;
  --soft:#d6c9a9;
}

body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 13% 8%,rgba(220,180,20,.12),transparent 26%),
    radial-gradient(circle at 88% 82%,rgba(170,140,20,.09),transparent 30%),
    linear-gradient(135deg,#0a0602,#1a1107 56%,#0a0602);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,255,255,.012) 4px);
  opacity:.42;
}

.shell{
  width:min(1240px,94vw);
  margin:16px auto;
}

.header{
  position:relative;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,rgba(30,20,8,.92),rgba(13,8,3,.96));
  box-shadow:0 12px 34px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.035);
  padding:16px 21px 15px;
  overflow:hidden;
}

.header::before,
.header::after{
  content:"";
  position:absolute;
  top:0;
  width:120px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.45;
}

.header::before{left:26px;}
.header::after{right:26px;}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
  padding-bottom:13px;
  border-bottom:1px solid var(--line2);
}

.brand{
  display:flex;
  align-items:center;
  gap:15px;
}

.batLogo{
  width:78px;
  height:42px;
  flex:0 0 auto;
  filter:drop-shadow(0 0 9px rgba(255,215,0,.42));
}

.batLogo path,
.batLogo polygon,
.batLogo line{
  stroke:var(--gold);
  fill:rgba(255,215,0,.08);
  stroke-width:1.45;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.title{
  font-size:26px;
  font-weight:300;
  letter-spacing:.35em;
  color:#fff6e7;
}

.sub{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.18em;
}

.topRight{
  display:flex;
  align-items:center;
  gap:15px;
}

.clock{
  min-width:130px;
  text-align:right;
  color:#ffd700;
  font-size:20px;
  font-weight:700;
  letter-spacing:.08em;
  line-height:1.45;
  padding-top:3px;
  text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.2);
}

.backBtn{
  height:36px;
  padding:0 18px;
  border:1px solid rgba(255,215,0,.32);
  border-radius:10px;
  background:linear-gradient(180deg,#302010,#180e04);
  color:#f7edd9;
  font-size:11px;
  letter-spacing:.13em;
  cursor:pointer;
  transition:.16s;
  white-space:nowrap;
}

.backBtn:hover{
  border-color:rgba(255,215,0,.78);
  color:#ffffff;
  box-shadow:0 0 13px rgba(255,215,0,.17);
}

.backBtn:active{
  transform:translateY(1px);
}

.controlPanel{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 104px;
  gap:10px;
  margin-top:13px;
}

.inputWrap{
  position:relative;
}

.inputWrap span{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#a58f6f;
  font-size:13px;
}

input{
  width:100%;
  height:40px;
  border-radius:10px;
  border:1px solid rgba(255,215,0,.22);
  background:#120b04;
  color:#f3ecdc;
  padding:0 12px 0 34px;
  font-size:13px;
  outline:none;
  transition:.18s;
}

input::placeholder{
  color:#837553;
}

input:focus{
  border-color:rgba(255,215,0,.72);
  box-shadow:0 0 13px rgba(255,215,0,.15);
}

button{
  height:40px;
  border:1px solid rgba(255,215,0,.32);
  border-radius:10px;
  background:linear-gradient(180deg,#302010,#180e04);
  color:#f7edd9;
  font-size:12px;
  letter-spacing:.13em;
  cursor:pointer;
  transition:.16s;
}

button:hover{
  border-color:rgba(255,215,0,.78);
  color:#ffffff;
  box-shadow:0 0 13px rgba(255,215,0,.17);
}

button:active{
  transform:translateY(1px);
}

.limitBox{
  height:40px;
  border:1px solid rgba(255,215,0,.24);
  border-radius:10px;
  background:rgba(255,255,255,.018);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.limitBox strong{
  font-size:16px;
  font-weight:300;
  color:#f8e8c7;
  line-height:1;
}

.limitBox span{
  margin-top:3px;
  color:#938363;
  font-size:8px;
  letter-spacing:.14em;
}

.grid{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.card{
  position:relative;
  min-height:200px;
  border-radius:13px;
  border:1px solid var(--gold-line);
  background:
    linear-gradient(180deg,rgba(31,20,8,.86),rgba(13,8,3,.96));
  box-shadow:
    0 8px 20px rgba(0,0,0,.32),
    inset 0 1px 0 rgba(255,255,255,.025),
    0 0 0 1px rgba(255,215,0,.035),
    0 0 18px rgba(255,215,0,.055);
  overflow:hidden;
  padding:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:18px;
  width:46%;
  height:1px;
  background:linear-gradient(90deg,var(--gold),transparent);
  opacity:.95;
}

.card::after{
  content:"";
  position:absolute;
  right:-26px;
  bottom:-26px;
  width:70px;
  height:70px;
  border:1px solid rgba(255,215,0,.10);
  border-radius:50%;
}

.index{
  position:absolute;
  top:8px;
  left:12px;
  color:#baa88a;
  font-size:12px;
  letter-spacing:.08em;
  z-index:2;
}

.avatar{
  width:80px;
  height:80px;
  min-width:80px;
  min-height:80px;
  max-width:80px;
  max-height:80px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,215,0,.3);
  margin:8px 0 6px;
  box-shadow:0 0 20px rgba(255,215,0,.15);
  background:#1a1107;
  display:block;
}

.name{
  font-size:15px;
  line-height:1.25;
  color:#fff8ed;
  margin-bottom:6px;
  word-break:break-word;
  font-weight:400;
}

.actions{
  width:100%;
  display:grid;
  grid-template-columns:1fr 38px;
  gap:7px;
  margin-top:auto;
}

.actions button{
  height:29px;
  font-size:10px;
  border-radius:8px;
  letter-spacing:.1em;
}

.deleteBtn{
  background:linear-gradient(180deg,#341b1f,#190a0d);
  color:#d7a8a8;
  border-color:rgba(255,100,120,.20);
}

.empty{
  margin-top:14px;
  border:1px dashed rgba(255,215,0,.28);
  border-radius:16px;
  text-align:center;
  padding:43px 20px;
  color:#958775;
  font-size:15px;
  letter-spacing:.08em;
}

.footer{
  margin-top:13px;
  padding:11px 6px 0;
  border-top:1px solid rgba(255,215,0,.12);
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#807963;
  font-size:11px;
  letter-spacing:.18em;
}

.footerLeft{
  display:flex;
  align-items:center;
  gap:9px;
}

.footerBat{
  width:34px;
  height:18px;
  filter:drop-shadow(0 0 6px rgba(255,215,0,.30));
}

.footerBat path,
.footerBat polygon,
.footerBat line{
  stroke:var(--gold);
  fill:rgba(255,215,0,.08);
  stroke-width:1.4;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.footerIcons{
  display:flex;
  gap:15px;
  font-size:15px;
  color:#9b8b7b;
}

@media(max-width:1100px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:760px){
  .controlPanel{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .top{
    flex-direction:column;
  }

  .topRight{
    width:100%;
    justify-content:space-between;
  }

  .title{
    font-size:22px;
    letter-spacing:.22em;
  }
}

@media(max-width:520px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main class="shell">

  <section class="header">

    <div class="top">

      <div class="brand">

        <svg class="batLogo" viewBox="0 0 180 92" aria-hidden="true">
          <path d="M90 55 L78 36 L64 30 L44 40 L18 63 L30 32 L54 18 L75 24 L90 10 L105 24 L126 18 L150 32 L162 63 L136 40 L116 30 L102 36 Z"/>
          <path d="M90 55 L82 70 L90 82 L98 70 Z"/>
          <path d="M78 36 L64 68 L90 55 L116 68 L102 36"/>
          <path d="M70 28 L60 50 L44 40"/>
          <path d="M110 28 L120 50 L136 40"/>
          <path d="M86 32 L90 18 L94 32"/>
          <path d="M82 35 L90 47 L98 35"/>
        </svg>

        <div>
          <div class="title">ГАЛЕРЕЯ ПРЕЗЕНТАЦИЙ ОРИГИНАЛЬНЫХ ХУДОЖНИКОВ ЕВРОПЫ</div>
          <div class="sub">КОЛЛЕКЦИИ БАЛКОНОВ ДВОРЦА НЕКСА</div>
        </div>
      </div>

      <div class="topRight">
        <button class="backBtn" id="backBtn">← НАЗАД</button>
        <div class="clock" id="clock"></div>
      </div>

    </div>

    <div class="controlPanel">

      <div class="inputWrap">
        <span>✎</span>
        <input id="nameInput" placeholder="Имя художника (отображается)">
      </div>

      <div class="inputWrap">
        <span>🖼</span>
        <input id="fileInput" placeholder="Имя файла аватарки (без .jpg)">
      </div>

      <div class="inputWrap">
        <span>🌐</span>
        <input id="urlInput" placeholder="Ссылка на сайт">
      </div>

      <button id="addBtn">ДОБАВИТЬ</button>

      <div class="limitBox">
        <strong id="counter">0 / 15</strong>
        <span>ХУДОЖНИКОВ</span>
      </div>

    </div>

  </section>

  <div id="empty" class="empty">ХУДОЖНИКИ ПОКА НЕ ДОБАВЛЕНЫ</div>

  <section class="grid" id="grid"></section>

  <footer class="footer">
    <div class="footerLeft">
      <svg class="footerBat" viewBox="0 0 180 92" aria-hidden="true">
        <path d="M90 55 L78 36 L64 30 L44 40 L18 63 L30 32 L54 18 L75 24 L90 10 L105 24 L126 18 L150 32 L162 63 L136 40 L116 30 L102 36 Z"/>
        <path d="M90 55 L82 70 L90 82 L98 70 Z"/>
        <path d="M78 36 L64 68 L90 55 L116 68 L102 36"/>
      </svg>
      <span>ДВОРЕЦ</span>
    </div>

    <div class="footerIcons">
      <span>⌕</span>
      <span>☰</span>
      <span>⚙</span>
    </div>
  </footer>

</main>

<script>
// ============================================================
// 🔐 ТОКЕН ДЛЯ GITHUB (ВАШ)
// ============================================================
const T1 = 'ghp_cfUIxC';
const T2 = 'hnUbKSnT04';
const T3 = '6CEDkmreO6';
const T4 = 'erm81Uf8qd';
const GITHUB_TOKEN = T1 + T2 + T3 + T4;

// ============================================================
// 🔐 КОНФИГУРАЦИЯ GITHUB
// ============================================================
const REPO_OWNER = 'vasilakypala-logovo';
const REPO_NAME = 'logovo';
const FILE_PATH = 'room_nex/balconies_data.json';

const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

// ============================================================
// 📦 ПЕРЕМЕННЫЕ
// ============================================================
const KEY = "gallery_artists";
const LIMIT = 15;

let artists = [];
let isSaving = false;

function $(id){ return document.getElementById(id); }

// ============================================================
// 💾 ЧТЕНИЕ ИЗ GITHUB
// ============================================================
async function loadFromGitHub() {
  try {
    const response = await fetch(API_URL, {
      headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
    });
    
    if (response.status === 404) {
      // ДЕМО-ДАННЫЕ
      artists = [
        { name: "Иван Иванов", file: "xr44", url: "https://example.com" }
      ];
      await saveToGitHub(true);
      render();
      updateCounter();
      return;
    }
    
    if (!response.ok) {
      throw new Error(`Ошибка ${response.status}`);
    }
    
    const data = await response.json();
    const binary = atob(data.content);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    const content = new TextDecoder('utf-8').decode(bytes);
    artists = JSON.parse(content);
    render();
    updateCounter();
  } catch(e) {
    console.error('Ошибка загрузки:', e);
    try {
      artists = JSON.parse(localStorage.getItem(KEY) || "[]");
      render();
      updateCounter();
    } catch(e2) {
      artists = [];
      render();
      updateCounter();
    }
  }
}

// ============================================================
// 💾 СОХРАНЕНИЕ В GITHUB
// ============================================================
async function saveToGitHub(silent = false) {
  if (isSaving) return;
  isSaving = true;
  
  try {
    let sha = '';
    try {
      const check = await fetch(API_URL, {
        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
      });
      if (check.ok) {
        const data = await check.json();
        sha = data.sha;
      }
    } catch(e) {}
    
    const jsonString = JSON.stringify(artists, null, 2);
    
    const encoder = new TextEncoder();
    const data = encoder.encode(jsonString);
    let binary = '';
    data.forEach(byte => binary += String.fromCharCode(byte));
    const content = btoa(binary);
    
    const body = {
      message: `Обновление галереи ${new Date().toLocaleString()}`,
      content: content
    };
    if (sha) body.sha = sha;
    
    const response = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    
    if (!response.ok) {
      throw new Error(`Ошибка ${response.status}: ${await response.text()}`);
    }
    
    localStorage.setItem(KEY, JSON.stringify(artists));
    if (!silent) showMessage('✅ Сохранено в GitHub!');
  } catch(e) {
    console.error('Ошибка сохранения:', e);
    if (!silent) showMessage('❌ Ошибка сохранения в GitHub');
    localStorage.setItem(KEY, JSON.stringify(artists));
  }
  isSaving = false;
}

// ============================================================
// 📖 ФУНКЦИИ УПРАВЛЕНИЯ
// ============================================================
function showMessage(text) {
  const empty = $("empty");
  const original = empty.textContent;
  empty.textContent = text;
  empty.style.borderColor = 'rgba(255,215,0,.6)';
  empty.style.display = 'block';
  setTimeout(() => {
    empty.textContent = original;
    empty.style.borderColor = '';
    if (artists.length > 0) {
      empty.style.display = 'none';
    }
  }, 3000);
}

function updateCounter() {
  $("counter").textContent = artists.length + " / " + LIMIT;
}

function normalize(url) {
  url = url.trim();
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) {
    url = "https://" + url;
  }
  return url;
}

function escapeHtml(text) {
  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function updateClock() {
  const d = new Date();
  const date = d.toLocaleDateString("ru-RU");
  const time = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  $("clock").innerHTML = date + "<br>" + time;
}

function sanitizeFileName(name) {
  return name.toLowerCase()
    .replace(/[^a-zа-яё0-9]/g, '_')
    .replace(/_+/g, '_')
    .replace(/^_|_$/g, '');
}

// ============================================================
// 🖼 ОТРИСОВКА КАРТОЧЕК
// ============================================================
function render() {
  const grid = $("grid");
  grid.innerHTML = "";
  $("empty").style.display = artists.length ? "none" : "block";

  artists.forEach(function(x, i) {
    const card = document.createElement("article");
    card.className = "card";

    // Формируем путь к фото: file + .jpg
    const imgPath = (x.file || x.name) + '.jpg';
    console.log(`🔍 Ищем фото: ${imgPath}`);

    // Создаем IMG
    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = imgPath;
    img.alt = escapeHtml(x.name);
    img.loading = 'lazy';
    
    // Если фото не загрузилось - скрываем и показываем заглушку
    img.onerror = function() {
      this.style.display = 'none';
      const placeholder = document.createElement('div');
      placeholder.className = 'avatar';
      placeholder.style.cssText = 'display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1107,#2a1a0a);border:2px solid rgba(255,215,0,.15);color:#6a5a3a;font-size:28px;';
      placeholder.textContent = '🖼';
      card.appendChild(placeholder);
      console.log(`❌ Фото не найдено: ${imgPath}`);
    };
    
    img.onload = function() {
      console.log(`✅ Фото загружено: ${imgPath}`);
    };

    // Собираем карточку
    card.innerHTML = `
      <div class="index">${String(i+1).padStart(2, "0")}</div>
      <div class="name">${escapeHtml(x.name)}</div>
      <div class="actions">
        <button class="openBtn">ОТКРЫТЬ</button>
        <button class="deleteBtn">×</button>
      </div>
    `;
    
    // Вставляем фото перед именем
    const nameElement = card.querySelector('.name');
    card.insertBefore(img, nameElement);

    card.querySelector(".openBtn").onclick = function() {
      let url = x.url.trim();
      if (!url) {
        alert('Ссылка не указана');
        return;
      }
      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }
      window.open(url, "_blank");
    };

    card.querySelector(".deleteBtn").onclick = async function() {
      if (confirm(`Удалить художника "${x.name}"?`)) {
        artists.splice(i, 1);
        await saveToGitHub();
        render();
        updateCounter();
      }
    };

    grid.appendChild(card);
  });
}

// ============================================================
// 🎯 ДОБАВЛЕНИЕ НОВОГО ХУДОЖНИКА
// ============================================================
$("addBtn").onclick = async function() {
  if (artists.length >= LIMIT) {
    alert("Достигнут лимит 15 художников.");
    return;
  }

  let displayName = $("nameInput").value.trim();
  let fileName = $("fileInput").value.trim();
  const url = $("urlInput").value.trim();

  if (!displayName) {
    alert("Введите имя художника (отображается на карточке).");
    return;
  }

  if (!fileName) {
    alert("Введите имя файла аватарки (без расширения).");
    return;
  }

  if (!url) {
    alert("Введите ссылку на сайт.");
    return;
  }

  // Очищаем имя файла
  fileName = sanitizeFileName(fileName);

  if (artists.some(a => a.file && a.file.toLowerCase() === fileName.toLowerCase())) {
    alert(`Файл "${fileName}" уже используется!`);
    return;
  }

  artists.push({
    name: displayName,
    file: fileName,
    url: normalize(url)
  });

  await saveToGitHub();
  render();
  updateCounter();

  $("nameInput").value = "";
  $("fileInput").value = "";
  $("urlInput").value = "";
  
  showMessage(`✅ Художник "${displayName}" добавлен! Ищем фото: ${fileName}.jpg`);
};

// ============================================================
// 🔙 КНОПКА НАЗАД
// ============================================================
$("backBtn").onclick = function() {
  window.history.back();
};

// ============================================================
// 🚀 ЗАПУСК
// ============================================================
loadFromGitHub();
updateClock();
setInterval(updateClock, 1000);

window.addEventListener('beforeunload', () => {
  saveToGitHub(true);
});
</script>

</body>
</html>
