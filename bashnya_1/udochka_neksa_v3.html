<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Удочка Некса</title>
<style>
  :root{
    --deep:#041419; --sea:#07313a; --green:#0c4a43; --gold:#f3c766;
    --rope:#8b6a3c; --wood:#2c1b12; --ink:#eaf7f2; --muted:#b6cbc4;
    --panel:rgba(2,15,18,.72); --line:rgba(255,230,160,.25);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at 50% 0%, rgba(122,215,225,.28), transparent 25%),
      radial-gradient(circle at 85% 72%, rgba(243,199,102,.16), transparent 22%),
      linear-gradient(160deg,#021015,#063240 48%,#021015);
    overflow-x:hidden;
  }
  body:before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.36;
    background:
      repeating-linear-gradient(115deg, transparent 0 23px, rgba(255,255,255,.04) 24px 25px),
      radial-gradient(circle at 18% 20%, rgba(255,255,255,.09), transparent 2px),
      radial-gradient(circle at 70% 38%, rgba(255,255,255,.06), transparent 2px);
    animation: water 9s ease-in-out infinite alternate;
  }
  @keyframes water{to{transform:translateY(-18px) scale(1.025)}}
  .wrap{max-width:1180px; margin:0 auto; padding:18px 16px 34px; position:relative}
  .topbar{
    border:3px solid rgba(139,106,60,.75); border-radius:24px;
    background:linear-gradient(180deg,rgba(92,55,26,.88),rgba(32,20,13,.88));
    box-shadow:0 18px 45px rgba(0,0,0,.4), inset 0 0 18px rgba(255,220,140,.12);
    text-align:center; padding:16px 20px; position:relative; overflow:hidden;
  }
  .topbar:before,.topbar:after{
    content:""; position:absolute; left:0; right:0; height:4px;
    background:repeating-linear-gradient(90deg,var(--rope) 0 16px,#d0a96b 17px 24px);
  }
  .topbar:before{top:0}.topbar:after{bottom:0}
  h1{margin:0; color:var(--gold); font-size:clamp(40px,6vw,72px); letter-spacing:.09em; font-weight:400; text-shadow:0 3px 0 #2b1708,0 0 18px rgba(243,199,102,.35)}
  .tag{font-size:20px; color:#f5e3b0; font-style:italic; margin-top:3px}
  .layout{display:grid; grid-template-columns:170px 1fr 210px; gap:14px; margin-top:14px}
  @media(max-width:920px){.layout{grid-template-columns:1fr}.side{display:none}}
  .side,.ocean,.rightbox{
    border:2px solid var(--line); border-radius:24px; background:var(--panel);
    box-shadow:0 18px 45px rgba(0,0,0,.35), inset 0 0 22px rgba(255,255,255,.04);
  }
  .side{padding:14px; min-height:520px; position:relative}
  .lamp{
    width:80px; height:150px; margin:4px auto 18px; border-radius:38px 38px 22px 22px;
    border:4px solid #6c4f2a; background:radial-gradient(circle at 50% 58%, #ffe59a, #b46d25 32%, #21140d 67%);
    box-shadow:0 0 45px rgba(255,197,83,.55);
  }
  .note{
    background:#d8bd83; color:#2d1e12; padding:13px; border-radius:9px;
    transform:rotate(-2deg); line-height:1.45; box-shadow:0 10px 22px rgba(0,0,0,.35);
    font-size:16px;
  }
  .ocean{min-height:520px; position:relative; overflow:hidden; padding:24px}
  .net{
    position:absolute; inset:32px 42px auto 42px; height:205px; border-radius:0 0 50% 50%;
    opacity:.72; pointer-events:none;
    background:
      repeating-linear-gradient(28deg, transparent 0 16px, rgba(214,171,95,.45) 17px 19px),
      repeating-linear-gradient(-28deg, transparent 0 16px, rgba(214,171,95,.38) 17px 19px);
    border:6px solid rgba(139,106,60,.82);
    box-shadow:0 0 0 4px rgba(36,22,10,.5), inset 0 -30px 60px rgba(0,0,0,.3);
  }
  .net.cast{animation: netCast 1.2s ease-in-out}
  @keyframes netCast{50%{transform:translateY(60px) scale(1.04); opacity:1}}
  .bubbles span{
    position:absolute; bottom:-35px; width:9px; height:9px; border:1px solid rgba(210,245,255,.5);
    border-radius:50%; animation:bubble 7s linear infinite;
  }
  .bubbles span:nth-child(1){left:14%; animation-delay:0s}.bubbles span:nth-child(2){left:31%; animation-delay:1.6s; width:13px;height:13px}
  .bubbles span:nth-child(3){left:66%; animation-delay:2.4s}.bubbles span:nth-child(4){left:82%; animation-delay:.7s; width:15px;height:15px}
  @keyframes bubble{to{transform:translateY(-610px); opacity:0}}
  .controls{
    position:relative; z-index:2; display:flex; justify-content:center; gap:22px; margin-top:175px; flex-wrap:wrap;
  }
  button{
    border:2px solid rgba(245,217,143,.38); color:#fff3c5; cursor:pointer;
    background:linear-gradient(180deg,rgba(28,110,120,.95),rgba(8,49,58,.95));
    border-radius:18px; padding:14px 24px; font-size:22px; font-family:inherit;
    text-shadow:0 2px 0 rgba(0,0,0,.4); box-shadow:0 9px 0 rgba(20,12,7,.65),0 15px 26px rgba(0,0,0,.35);
    transition:.16s transform;
  }
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(4px); box-shadow:0 4px 0 rgba(20,12,7,.65)}
  button:disabled{opacity:.45; cursor:not-allowed; transform:none}
  .catchBtn{background:linear-gradient(180deg,rgba(53,109,63,.95),rgba(19,61,36,.95))}
  .status{
    position:relative; z-index:2; margin:28px auto 18px; text-align:center; color:var(--gold);
    font-size:23px; font-style:italic;
  }
  .grid{position:relative; z-index:2; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px}
  @media(max-width:850px){.grid{grid-template-columns:1fr}}
  .card{
    border:3px solid rgba(139,106,60,.82); border-radius:18px; overflow:hidden;
    background:rgba(0,0,0,.38); box-shadow:0 14px 26px rgba(0,0,0,.36);
    min-height:270px; display:flex; flex-direction:column;
  }
  .preview{height:160px; display:grid; place-items:center; background:rgba(255,255,255,.05); overflow:hidden}
  .preview img,.preview video{width:100%; height:100%; object-fit:cover}
  audio{width:92%}.fileicon{font-size:54px}
  .meta{padding:11px; display:flex; flex-direction:column; gap:7px; flex:1}
  .name{font-size:16px; line-height:1.25; word-break:break-word}
  .name .orig{color:#ccc; display:block}
  .name .trans{color:var(--gold); display:block; font-style:italic; font-size:0.9em}
  .muted{font-size:13px; color:var(--muted)}
  a{color:#ffe298}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:auto}
  .actions button{font-size:14px; padding:8px; border-radius:11px; box-shadow:none}
  .goldCard{box-shadow:0 0 35px rgba(243,199,102,.34); border-color:rgba(243,199,102,.86)}
  .rightbox{padding:12px; display:flex; flex-direction:column; gap:12px}
  .counter{
    border:3px solid rgba(139,106,60,.82); border-radius:18px; padding:14px; text-align:center;
    background:rgba(0,0,0,.34);
  }
  .counter svg{width:76px; height:50px; filter:drop-shadow(0 0 12px rgba(243,199,102,.65))}
  .num{font-size:48px; color:var(--gold); line-height:1}
  .rightbox button{font-size:19px; width:100%; padding:13px}
  .goldfish{
    position:absolute; right:-18px; bottom:18px; width:230px; height:150px; z-index:3;
    filter:drop-shadow(0 0 22px rgba(243,199,102,.6));
    animation: swim 5.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes swim{50%{transform:translateY(-18px) rotate(-2deg)}}
  .seabed{
    margin-top:14px; padding:13px 18px; border-radius:17px; background:rgba(52,31,17,.62);
    border:2px solid rgba(139,106,60,.62); text-align:center; color:#e9d2a0; font-style:italic;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>УДОЧКА НЕКСА</h1>
    <div class="tag">лови случайность — находи сокровище</div>
  </div>

  <div class="layout">
    <aside class="side">
      <div class="lamp"></div>
      <div class="note">
        Интернет-океан<br>
        теперь шире:<br>
        Commons, Openverse,<br>
        Archive, NASA,<br>
        Забрось сеть...<br>
        А что поймаешь —<br>
        решит удача.
      </div>
    </aside>

    <main class="ocean">
      <div id="net" class="net"></div>
      <div class="bubbles"><span></span><span></span><span></span><span></span></div>

      <div class="controls">
        <button id="castBtn">🕸 ЛОВИСЬ<br><small>забросить сеть</small></button>
        <button id="catchBtn" class="catchBtn" disabled>🐟 ПОЙМАЛ<br><small>вытянуть улов</small></button>
      </div>

      <div id="status" class="status">Сеть спокойна. Океан ждёт.</div>
      <section id="catchGrid" class="grid"></section>

      <svg class="goldfish" viewBox="0 0 420 250" aria-hidden="true">
        <defs>
          <radialGradient id="gf" cx="42%" cy="42%" r="65%">
            <stop offset="0" stop-color="#fff2a6"/>
            <stop offset=".45" stop-color="#f3c766"/>

          </radialGradient>
          <linearGradient id="tail" x1="0" x2="1">
            <stop offset="0" stop-color="#f3c766"/>
            <stop offset="1" stop-color="#fff1a8"/>
          </linearGradient>
        </defs>
        <path d="M242 120 C330 34 382 18 394 24 C368 90 346 120 394 218 C347 216 303 178 244 137" fill="url(#tail)" opacity=".92"/>
        <path d="M236 112 C314 74 360 86 400 106 C342 130 308 151 235 135" fill="url(#tail)" opacity=".75"/>
        <ellipse cx="160" cy="126" rx="118" ry="70" fill="url(#gf)"/>
        <path d="M110 62 C96 28 128 18 153 60" fill="#f3c766" opacity=".85"/>
        <path d="M128 188 C105 220 145 230 178 187" fill="#eaa12d" opacity=".85"/>
        <circle cx="74" cy="116" r="10" fill="#1a1208"/>
        <circle cx="70" cy="112" r="3" fill="#fff"/>
        <path d="M55 142 C73 153 96 151 112 139" fill="none" stroke="#8f4c0c" stroke-width="4" opacity=".75"/>
        <g opacity=".35" fill="#8f4c0c">
          <circle cx="132" cy="92" r="5"/><circle cx="158" cy="87" r="5"/><circle cx="184" cy="94" r="5"/>
          <circle cx="122" cy="126" r="5"/><circle cx="151" cy="124" r="5"/><circle cx="180" cy="129" r="5"/>
          <circle cx="137" cy="158" r="5"/><circle cx="167" cy="160" r="5"/>
        </g>
      </svg>
    </main>

    <aside class="rightbox">
      <div class="counter">
        <div>Ваш улов</div>
        <svg viewBox="0 0 420 250"><use href="#goldfishMini"/></svg>
        <div class="num" id="savedCount">0</div>
        <div class="muted">в сейфе</div>
      </div>
      <button id="safeBtn">🧰 СЕЙФ</button>
      <button id="clearBtn">🌊 ВЫБРОСИТЬ ВСЁ</button>
      <button id="historyBtn">📜 ИСТОРИЯ</button>
      <div class="counter">
        <div>Золотые рыбки</div>
        <div class="num" id="goldCount">0</div>
      </div>
    </aside>
  </div>

  <div class="seabed">Каждый улов — это история, которую ещё никто не читал.</div>
</div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="goldfishMini" viewBox="0 0 420 250">
    <path d="M242 120 C330 34 382 18 394 24 C368 90 346 120 394 218 C347 216 303 178 244 137" fill="#f4d06f"/>
    <ellipse cx="160" cy="126" rx="118" ry="70" fill="#f3b33e"/>
    <circle cx="74" cy="116" r="10" fill="#1a1208"/>
  </symbol>
</svg>

<script>
const MAX_SIZE = 5 * 1024 * 1024;
const castBtn = document.getElementById('castBtn');
const catchBtn = document.getElementById('catchBtn');
const clearBtn = document.getElementById('clearBtn');
const safeBtn = document.getElementById('safeBtn');
const historyBtn = document.getElementById('historyBtn');
const statusEl = document.getElementById('status');
const grid = document.getElementById('catchGrid');
const net = document.getElementById('net');
const savedCount = document.getElementById('savedCount');
const goldCount = document.getElementById('goldCount');

let current = [];

function loadStore(){ return JSON.parse(localStorage.getItem('nex_fishing_store_v2') || '[]'); }
function saveStore(items){ localStorage.setItem('nex_fishing_store_v2', JSON.stringify(items)); updateCounts(); }
function loadHistory(){ return JSON.parse(localStorage.getItem('nex_fishing_history_v2') || '[]'); }
function saveHistory(items){ localStorage.setItem('nex_fishing_history_v2', JSON.stringify(items.slice(-60))); }
function updateCounts(){
  const s = loadStore();
  savedCount.textContent = s.length;
  goldCount.textContent = s.filter(x => x.gold).length;
}
updateCounts();

function fmt(bytes){
  if(!bytes) return 'размер неизвестен';
  return bytes < 1024*1024 ? Math.round(bytes/1024)+' Кб' : (bytes/1024/1024).toFixed(2)+' Мб';
}
function cleanTitle(t){ return (t || 'Безымянная рыбка').replace(/^File:/,'').replace(/_/g,' '); }
function isAllowedMime(mime){
  return mime && (mime.startsWith('image/') || mime.startsWith('audio/') || mime.startsWith('video/') || mime === 'application/pdf' || mime.startsWith('text/'));
}

// ---------- ПЕРЕВОДЧИК ----------
async function translateText(text, target='ru') {
  if (!text || text.length < 1) return text;
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;
    const resp = await fetch(url);
    const data = await resp.json();
    // структура: data[0] — массив переводов, каждый элемент [перевод, язык, ...]
    if (Array.isArray(data) && data[0] && Array.isArray(data[0])) {
      let translated = data[0].map(segment => segment[0] || '').join('');
      if (translated && translated.length > 0) return translated;
    }
    return text; // не удалось перевести
  } catch (e) {
    console.warn('Ошибка перевода:', e);
    return text;
  }
}
// ---------------------------------

function render(items){
  grid.innerHTML = '';
  if(!items.length){
    grid.innerHTML = '<div class="muted">Пока пусто. Забросьте сеть.</div>';
    return;
  }
  items.forEach((item, idx) => {
    const card = document.createElement('article');
    card.className = 'card' + (item.gold ? ' goldCard' : '');
    const prev = document.createElement('div');
    prev.className = 'preview';
    if(item.mime && item.mime.startsWith('image/')){
      prev.innerHTML = `<img src="${item.thumb || item.url}" alt="">`;
    } else if(item.mime && item.mime.startsWith('audio/')){
      prev.innerHTML = `<audio controls src="${item.url}"></audio>`;
    } else if(item.mime && item.mime.startsWith('video/')){
      prev.innerHTML = `<video controls src="${item.url}"></video>`;
    } else if(item.mime === 'application/pdf'){
      prev.innerHTML = `<div class="fileicon">📜</div>`;
    } else {
      prev.innerHTML = `<div class="fileicon">✦</div>`;
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const originalTitle = cleanTitle(item.title);
    const translatedTitle = item.titleRu || ''; // сохранённый перевод

    let nameHtml = `<span class="orig">${originalTitle}</span>`;
    if (translatedTitle) {
      nameHtml += `<span class="trans">${translatedTitle}</span>`;
    }

    meta.innerHTML = `
      <div class="name">${nameHtml}</div>
      <div class="muted">${item.mime || 'тип неизвестен'} · ${fmt(item.size)} · ${item.source || 'океан'}</div>
      <div><a href="${item.page || item.url}" target="_blank" rel="noopener">Открыть источник</a></div>
      <div class="actions">
        <button data-act="throw" data-idx="${idx}">Назад</button>
        <button data-act="save" data-idx="${idx}">В сейф</button>
        <button data-act="gold" data-idx="${idx}">Золотая</button>
        <button data-act="open" data-idx="${idx}">Файл</button>
        ${!item.titleRu ? `<button data-act="translate" data-idx="${idx}" class="translate-btn">Перевести</button>` : ''}
      </div>
    `;
    card.appendChild(prev); card.appendChild(meta); grid.appendChild(card);
  });
}

grid.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const idx = Number(btn.dataset.idx);
  const act = btn.dataset.act;
  const item = current[idx];
  if(!item) return;

  if(act === 'throw'){
    current.splice(idx,1); render(current);
    statusEl.textContent = 'Рыбка ушла обратно в океан.';
  }
  else if(act === 'save'){
    const s = loadStore();
    if(!s.some(x => x.url === item.url)) s.push({...item, savedAt:new Date().toISOString()});
    saveStore(s);
    statusEl.textContent = 'Улов положен в сейф.';
  }
  else if(act === 'gold'){
    item.gold = !item.gold;
    const s = loadStore().map(x => x.url === item.url ? {...x, gold:item.gold} : x);
    saveStore(s);
    render(current);
    statusEl.textContent = item.gold ? 'Вот она — золотая рыбка.' : 'Рыбка снова обычная.';
  }
  else if(act === 'open'){
    window.open(item.url, '_blank', 'noopener');
  }
  else if(act === 'translate'){
    btn.disabled = true;
    btn.textContent = '⏳...';
    statusEl.textContent = 'Переводим название...';
    try {
      const translated = await translateText(item.title);
      if (translated && translated !== item.title) {
        item.titleRu = translated;
        statusEl.textContent = 'Перевод готов.';
        render(current);
      } else {
        statusEl.textContent = 'Не удалось перевести (или текст уже на русском).';
        btn.textContent = 'Перевести'; // возвращаем
        btn.disabled = false;
      }
    } catch (err) {
      statusEl.textContent = 'Ошибка перевода. Попробуйте позже.';
      btn.textContent = 'Перевести';
      btn.disabled = false;
    }
  }
});

castBtn.onclick = () => {
  net.classList.remove('cast'); void net.offsetWidth; net.classList.add('cast');
  statusEl.textContent = 'Сеть ушла в открытый океан. Ждём, что дрогнет в глубине.';
  catchBtn.disabled = false;
};

catchBtn.onclick = async () => {
  catchBtn.disabled = true;
  net.classList.remove('cast'); void net.offsetWidth; net.classList.add('cast');
  statusEl.textContent = 'Тянем сеть по разным причалам: Commons, Openverse, Archive, NASA, туман...';
  try{
    const items = await fishOcean(3);
    current = items.length ? items : fallbackCatch();
    const h = loadHistory();
    saveHistory(h.concat(current.map(x => ({...x, caughtAt:new Date().toISOString()}))));
    render(current);
    statusEl.textContent = items.length ? 'Улов готов!' : 'Сегодня океан капризный. Достал демо-улов из тумана.';
  }catch(err){
    console.warn(err);
    current = fallbackCatch();
    render(current);
    statusEl.textContent = 'Ветер Интернета сбился. Показан демо-улов.';
  }finally{
    setTimeout(()=>catchBtn.disabled=false, 900);
  }
};

clearBtn.onclick = () => {
  current = []; render(current);
  statusEl.textContent = 'Всё отпущено обратно.';
};

safeBtn.onclick = () => {
  current = loadStore(); render(current);
  statusEl.textContent = current.length ? 'Открыт сейф улова.' : 'Сейф пустой, но уже ждёт.';
};

historyBtn.onclick = () => {
  current = loadHistory().slice().reverse().slice(0,12); render(current);
  statusEl.textContent = current.length ? 'Открыта история последних забросов.' : 'История пока молчит.';
};

async function fishCommons(want=2){
  const found = [];
  let tries = 0;
  while(found.length < want && tries < 8){
    tries++;
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=random&grnnamespace=6&grnlimit=12&prop=imageinfo|info&iiprop=url|mime|size|mediatype|extmetadata&iiurlwidth=700&inprop=url';
    const res = await fetch(url);
    const data = await res.json();
    const pages = Object.values(data.query?.pages || {});
    for(const p of pages){
      const ii = p.imageinfo && p.imageinfo[0];
      if(!ii || ii.size > MAX_SIZE || !isAllowedMime(ii.mime)) continue;
      found.push({
        title:p.title, url:ii.url, thumb:ii.thumburl, mime:ii.mime, size:ii.size,
        page:p.fullurl || ('https://commons.wikimedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g,'_'))),
        source:'Wikimedia Commons'
      });
      if(found.length >= want) break;
    }
  }
  return found;
}

async function fishOpenverse(want=2){
  const queries = ['moon','forest','river','old photo','bird','painting','fog','winter','flower','ship','music'];
  const q = queries[Math.floor(Math.random()*queries.length)];
  const page = 1 + Math.floor(Math.random()*20);
  const url = 'https://api.openverse.org/v1/images/?q=' + encodeURIComponent(q) + '&page_size=20&page=' + page + '&license_type=commercial,modification';
  const res = await fetch(url);
  const data = await res.json();
  const results = (data.results || []).sort(() => Math.random() - .5);
  const found = [];
  for(const r of results){
    if(!r.url || found.length >= want) break;
    found.push({
      title:r.title || ('Openverse: ' + q),
      url:r.url,
      thumb:r.thumbnail || r.url,
      mime:'image/*',
      size:0,
      page:r.foreign_landing_url || r.url,
      source:'Openverse'
    });
  }
  return found;
}

async function fishNASA(want=2){
  const queries = ['nebula','moon','earth','mars','galaxy','apollo','comet','aurora','satellite'];
  const q = queries[Math.floor(Math.random()*queries.length)];
  const page = 1 + Math.floor(Math.random()*10);
  const url = 'https://images-api.nasa.gov/search?q=' + encodeURIComponent(q) + '&media_type=image&page=' + page;
  const res = await fetch(url);
  const data = await res.json();
  const items = (data.collection?.items || []).sort(() => Math.random() - .5);
  const found = [];
  for(const it of items){
    if(found.length >= want) break;
    const link = (it.links || []).find(x => x.rel === 'preview' || x.render === 'image');
    const meta = (it.data || [])[0] || {};
    if(!link?.href) continue;
    found.push({
      title:meta.title || ('NASA: ' + q),
      url:link.href,
      thumb:link.href,
      mime:'image/jpeg',
      size:0,
      page:it.href || link.href,
      source:'NASA Images'
    });
  }
  return found;
}

async function fishArchive(want=2){
  const queries = [
    'mediatype:image AND collection:(flickrcommons)',
    'mediatype:text AND collection:(americana)',
    'mediatype:audio AND collection:(opensource_audio)',
    'mediatype:movies AND collection:(prelinger)'
  ];
  const q = queries[Math.floor(Math.random()*queries.length)];
  const page = 1 + Math.floor(Math.random()*25);
  const url = 'https://archive.org/advancedsearch.php?q=' + encodeURIComponent(q) + '&fl[]=identifier&fl[]=title&fl[]=mediatype&rows=20&page=' + page + '&output=json';
  const res = await fetch(url);
  const data = await res.json();
  const docs = (data.response?.docs || []).sort(() => Math.random() - .5);
  const found = [];
  for(const d of docs){
    if(found.length >= want) break;
    const id = d.identifier;
    if(!id) continue;
    const metaRes = await fetch('https://archive.org/metadata/' + encodeURIComponent(id));
    const meta = await metaRes.json();
    const files = (meta.files || []).filter(f => {
      const name = f.name || '';
      const size = Number(f.size || 0);
      const lower = name.toLowerCase();
      const ok = lower.match(/\.(jpg|jpeg|png|gif|mp3|ogg|pdf|txt|mp4|webm)$/);
      return ok && (!size || size <= MAX_SIZE);
    });
    if(!files.length) continue;
    const f = files[Math.floor(Math.random()*files.length)];
    const fileUrl = 'https://archive.org/download/' + encodeURIComponent(id) + '/' + f.name.split('/').map(encodeURIComponent).join('/');
    const lower = f.name.toLowerCase();
    let mime = 'application/octet-stream';
    if(lower.match(/\.(jpg|jpeg)$/)) mime='image/jpeg';
    else if(lower.endsWith('.png')) mime='image/png';
    else if(lower.endsWith('.gif')) mime='image/gif';
    else if(lower.endsWith('.mp3')) mime='audio/mpeg';
    else if(lower.endsWith('.ogg')) mime='audio/ogg';
    else if(lower.endsWith('.mp4')) mime='video/mp4';
    else if(lower.endsWith('.webm')) mime='video/webm';
    else if(lower.endsWith('.pdf')) mime='application/pdf';
    else if(lower.endsWith('.txt')) mime='text/plain';
    found.push({
      title:d.title || id,
      url:fileUrl,
      thumb:mime.startsWith('image/') ? fileUrl : '',
      mime:mime,
      size:Number(f.size || 0),
      page:'https://archive.org/details/' + encodeURIComponent(id),
      source:'Internet Archive'
    });
  }
  return found;
}

async function fishQuotes(want=1){
  const bits = [
    'Сегодня океан вернул не вещь, а направление взгляда.',
    'Случайность не отвечает. Она только кладёт предмет на берег.',
    'Не всякий улов надо хранить: иногда ценность в том, что отпустил.',
    'Золотая рыбка начинается там, где файл перестаёт быть файлом.',
    'Сеть ловит предметы, а человек ловит смысл.'
  ];
  return bits.sort(() => Math.random()-.5).slice(0,want).map((txt,i)=>({
    title:'Записка из тумана №' + (i+1),
    mime:'text/plain',
    size:txt.length,
    url:'data:text/plain;charset=utf-8,' + encodeURIComponent(txt),
    page:'#',
    source:'Туман Некса',
    titleRu: txt // сразу даём готовый русский текст
  }));
}

async function fishOcean(want=3){
  const nets = [fishCommons, fishOpenverse, fishNASA, fishArchive, fishQuotes].sort(() => Math.random() - .5);
  let found = [];
  for(const fn of nets){
    try{
      const part = await fn(2);
      found = found.concat(part);
    }catch(e){
      console.warn('Причал не ответил:', fn.name, e);
    }
    found = uniqueByUrl(found);
    if(found.length >= want) break;
  }
  return found.sort(() => Math.random() - .5).slice(0,want);
}

function uniqueByUrl(items){
  const seen = new Set();
  return items.filter(x => {
    if(!x.url || seen.has(x.url)) return false;
    seen.add(x.url);
    return true;
  });
}
