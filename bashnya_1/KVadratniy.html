﻿﻿<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Квадратный туман — Пространственное мышление 2.0</title>
    <style>
        /* ===== все стили (оставляем без изменений, добавляем новые для пешки) ===== */
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background:
                radial-gradient(ellipse at 30% 20%, #2a3a5c 0%, #141c2b 60%, #0b111e 100%);
            background-attachment: fixed;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 70% 80%, rgba(60, 80, 120, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 40%, rgba(90, 110, 150, 0.10) 0%, transparent 50%);
            z-index: 0;
        }

        .game-container {
            position: relative;
            z-index: 1;
            background: rgba(22, 34, 62, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 28px 32px 32px;
            max-width: 720px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03) inset, 0 0 40px rgba(30, 60, 120, 0.3);
        }
        h1 {
            font-size: 30px;
            margin: 0 0 2px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #cfd8e6;
            text-shadow: 0 2px 20px rgba(0, 20, 40, 0.6);
            font-family: 'Georgia', serif;
        }
        .subtitle {
            font-size: 13px;
            color: #8a9bb5;
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* Гнёзда с шарами */
        .home-selector {
            display: flex;
            gap: 18px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(15, 52, 96, 0.3);
            backdrop-filter: blur(4px);
            padding: 14px 20px;
            border-radius: 60px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .color-socket {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 40% 35%, #8b6b4a, #4a3222 70%, #2d1e14);
            box-shadow:
                inset 0 -4px 8px rgba(0,0,0,0.6),
                inset 0 4px 8px rgba(255,220,160,0.2),
                0 4px 12px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            position: relative;
        }
        .color-socket::before {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle at 30% 30%, transparent, transparent 6px, rgba(0,0,0,0.05) 6px, rgba(0,0,0,0.05) 8px);
            pointer-events: none;
        }
        .color-socket::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 60% 20%, rgba(255,220,180,0.15), transparent 60%);
            pointer-events: none;
        }
        .color-ball {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 -2px 6px rgba(0,0,0,0.3), inset 0 2px 6px rgba(255,255,255,0.2);
            position: relative;
            z-index: 1;
        }
        .color-ball::after {
            content: '';
            position: absolute;
            inset: 4px 4px 20% 20%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .color-ball:hover {
            transform: scale(1.12) rotate(-4deg);
            filter: brightness(1.2);
        }
        .color-ball.selected {
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5), 0 0 60px rgba(100, 150, 255, 0.3);
            transform: scale(1.1);
        }
        .color-ball.disabled {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(0.5);
            transform: scale(0.95);
        }
        .color-socket.selected-socket {
            box-shadow:
                inset 0 -4px 8px rgba(0,0,0,0.6),
                inset 0 4px 8px rgba(255,220,160,0.3),
                0 0 30px rgba(255,215,0,0.3),
                0 0 60px rgba(255,215,0,0.1);
        }

        /* Инфо-панель */
        .info-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 28px;
            background: rgba(15, 52, 96, 0.4);
            backdrop-filter: blur(4px);
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 15px;
            width: 100%;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .info-bar span { color: #bcc9db; }
        .info-bar span .label { color: #7a8aa5; font-weight: normal; }
        .info-bar span strong { color: #f0e6d0; font-weight: 600; }

        /* Игровое поле */
        .grid-wrapper {
            background: rgba(10, 18, 30, 0.7);
            padding: 14px;
            border-radius: 24px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7), 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            backdrop-filter: blur(4px);
            margin-bottom: 16px;
            position: relative;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 290px;
            height: 290px;
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            border-radius: 14px;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
        }
        .cell::before {
            content: '';
            position: absolute;
            inset: 8% 12% 40% 12%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.25), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
        }
        .cell.active {
            border: none;
            box-shadow: 0 0 30px rgba(255, 220, 80, 0.6), 0 0 60px rgba(255, 200, 50, 0.3), inset 0 0 20px rgba(255, 220, 80, 0.2);
            transform: scale(1.05);
            z-index: 2;
        }
        .cell-home {
            background: radial-gradient(circle at 30% 30%, #ffffff, #d0d0d0) !important;
            color: #222 !important;
            border: 2px solid #ffcc44 !important;
            box-shadow: 0 0 40px rgba(255, 200, 50, 0.5), 0 0 80px rgba(255, 200, 50, 0.2) !important;
        }
        .cell-center { font-size: 28px; }
        .cell-center::after {
            content: "🌀";
            font-size: 24px;
            margin-left: 4px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }

        /* ===== ПЕШКА ===== */
        .piece {
            display: inline-block;
            font-size: 40px;
            line-height: 1;
            position: relative;
            z-index: 3;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: none;
        }
        .piece-enter {
            animation: pieceAppear 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
        }
        @keyframes pieceAppear {
            0% { transform: scale(0) rotate(40deg); opacity: 0; }
            50% { transform: scale(1.4) rotate(-10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        /* исчезновение – делаем через удаление, но можем добавить класс для анимации, но мы просто перерисовываем */

        /* ===== ДЕРЕВЯННЫЙ ШАР-КУБИК ===== */
        .dice-area {
            display: flex;
            align-items: center;
            gap: 28px;
            margin-bottom: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .dice-box {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 35% 25%, #e8c9a0, #b8834a 60%, #6f451a 90%, #4a2e10);
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.7),
                inset 0 -8px 15px rgba(0, 0, 0, 0.4),
                inset 0 8px 20px rgba(255, 220, 160, 0.3);
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }
        .dice-box::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 15%;
            width: 35%;
            height: 25%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, transparent 80%);
            pointer-events: none;
            z-index: 1;
        }
        .dice-box::after {
            content: '';
            position: absolute;
            bottom: 20%;
            right: 15%;
            width: 15%;
            height: 10%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 80%);
            pointer-events: none;
            z-index: 1;
        }
        .dice-box .wood-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-radial-gradient(circle at 35% 30%, transparent, transparent 12px, rgba(0,0,0,0.04) 12px, rgba(0,0,0,0.04) 14px);
            pointer-events: none;
            z-index: 0;
        }
        .dice-box .digit {
            position: relative;
            z-index: 2;
            font-size: 52px;
            font-weight: 800;
            color: #1f1105;
            text-shadow: 0 2px 4px rgba(255, 200, 150, 0.3), 0 -2px 4px rgba(0,0,0,0.2);
            font-family: 'Arial Black', sans-serif;
            transition: all 0.2s ease;
            line-height: 1;
        }
        .dice-box.highlight {
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 200, 0, 0.5), 0 8px 25px rgba(0,0,0,0.7);
            transform: scale(1.08);
        }
        .dice-box.highlight .digit {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        .dice-box.spinning {
            animation: spinBall 0.8s cubic-bezier(0.2, 0.8, 0.3, 1.2) forwards;
        }
        @keyframes spinBall {
            0% { transform: rotate(0deg) scale(0.95); }
            30% { transform: rotate(180deg) scale(1.1); }
            70% { transform: rotate(300deg) scale(1.02); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ===== КНОПКИ (дерево) ===== */
        .btn {
            padding: 14px 34px;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            color: #f0e6d0;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 30% 25%, #7a5a3a, #3d2b1a 80%, #1f140a);
            box-shadow:
                0 6px 0 #1f140a,
                0 8px 24px rgba(0, 0, 0, 0.5),
                inset 0 2px 0 rgba(255,220,160,0.2),
                inset 0 -4px 8px rgba(0,0,0,0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,0,0,0.05) 8px, rgba(0,0,0,0.05) 10px);
            pointer-events: none;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 40%;
            height: 30%;
            background: radial-gradient(circle, rgba(255,220,180,0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1f140a, 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .btn:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: scale(1.02);
        }
        .btn-roll {
            background: radial-gradient(circle at 30% 25%, #7a5a3a, #3d2b1a 80%, #1f140a);
            box-shadow:
                0 6px 0 #1f140a,
                0 8px 24px rgba(0, 0, 0, 0.5),
                inset 0 2px 0 rgba(255,220,160,0.2),
                inset 0 -4px 8px rgba(0,0,0,0.4);
        }
        .btn-roll:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(0.3);
        }
        .btn-new {
            background: radial-gradient(circle at 30% 25%, #7a5a3a, #3d2b1a 80%, #1f140a);
            box-shadow:
                0 6px 0 #1f140a,
                0 8px 24px rgba(0, 0, 0, 0.5),
                inset 0 2px 0 rgba(255,220,160,0.2),
                inset 0 -4px 8px rgba(0,0,0,0.4);
            display: none;
        }

        /* Журнал */
        .log-container {
            width: 100%;
            margin-top: 12px;
            background: rgba(10, 18, 30, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 10px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
        }
        .log-box {
            height: 100px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #b0c7dd;
            white-space: pre-wrap;
            word-break: break-all;
            scroll-behavior: smooth;
        }
        .log-box::-webkit-scrollbar { width: 5px; }
        .log-box::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        .log-box::-webkit-scrollbar-thumb { background: #6a7a9a; border-radius: 10px; }

        /* Модалки */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-box {
            background: rgba(22, 34, 62, 0.9);
            backdrop-filter: blur(12px);
            padding: 36px 44px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            max-width: 92%;
            transform: scale(0.9);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.35s ease;
            opacity: 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
            opacity: 1;
        }
        .modal-box h2 {
            font-size: 30px;
            margin: 0 0 12px;
            color: #ffd866;
            text-shadow: 0 0 30px rgba(255, 200, 50, 0.2);
        }
        .modal-box .question {
            font-size: 18px;
            color: #c8d4e6;
            margin-bottom: 12px;
        }
        .modal-box .info-line {
            font-size: 16px;
            color: #9aacc9;
            margin-bottom: 18px;
        }
        .modal-box .info-line span {
            color: #fff;
            font-weight: bold;
        }
        .modal-box .color-options {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .modal-box .color-socket {
            width: 72px;
            height: 72px;
        }
        .modal-box .color-ball {
            width: 50px;
            height: 50px;
            font-size: 20px;
        }
        .modal-box .message {
            font-size: 20px;
            margin-top: 12px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-box .message.correct { opacity: 1; color: #5bdf8a; }
        .modal-box .message.wrong { opacity: 1; color: #f07373; }

        .portal-effect {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(40, 70, 120, 0.3), rgba(0, 0, 0, 0.7));
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .portal-effect.active {
            display: block;
            opacity: 1;
            animation: portalFog 1.2s ease forwards;
        }
        @keyframes portalFog {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            30% { opacity: 1; backdrop-filter: blur(4px); }
            80% { opacity: 0.8; backdrop-filter: blur(6px); }
            100% { opacity: 0; backdrop-filter: blur(0px); }
        }
        .portal-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid rgba(255, 215, 0, 0.2);
            border-top-color: #ffd866;
            animation: spinPortal 1s linear infinite;
            z-index: 1001;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        .portal-spinner.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        @keyframes spinPortal {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.2); }
        }

        .win-modal .modal-box {
            background: rgba(20, 28, 45, 0.95);
        }
        .win-modal .modal-box h2 {
            font-size: 40px;
            color: #ffd866;
        }
        .win-modal .star {
            font-size: 56px;
            margin: 10px 0;
            color: #ffd866;
            animation: pulseStar 1.5s ease-in-out infinite;
        }
        @keyframes pulseStar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .win-modal .btn {
            margin-top: 10px;
        }

        @media (max-width: 550px) {
            .game-container { padding: 16px; }
            .grid { width: 210px; height: 210px; gap: 6px; }
            .cell { font-size: 22px; border-radius: 10px; }
            .piece { font-size: 30px; }
            .dice-box { width: 70px; height: 70px; }
            .dice-box .digit { font-size: 40px; }
            .btn { padding: 10px 20px; font-size: 16px; }
            .color-socket { width: 56px; height: 56px; }
            .color-ball { width: 40px; height: 40px; font-size: 14px; }
            .info-bar { font-size: 12px; gap: 6px 12px; padding: 8px 14px; }
            .modal-box .color-socket { width: 60px; height: 60px; }
            .modal-box .color-ball { width: 42px; height: 42px; font-size: 16px; }
            .modal-box { padding: 24px 20px; }
            .portal-spinner { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>
    <!-- эффекты портала -->
    <div class="portal-effect" id="portalEffect"></div>
    <div class="portal-spinner" id="portalSpinner"></div>

    <div class="game-container">
        <h1>🌀 КВАДРАТНЫЙ ТУМАН</h1>
        <div class="subtitle">выберите цвет дома</div>

        <div class="home-selector" id="homeSelector"></div>

        <div class="info-bar">
            <span><span class="label">Дом:</span> <strong id="homeDisplay">—</strong></span>
            <span><span class="label">Текущая:</span> <strong id="currentDisplay">—</strong></span>
            <span><span class="label">Бросков:</span> <strong id="throwsDisplay">0</strong></span>
            <span><span class="label">Шагов:</span> <strong id="stepsDisplay">0</strong></span>
        </div>

        <div class="grid-wrapper">
            <div class="grid" id="grid"></div>
        </div>

        <div class="dice-area">
            <div class="dice-box" id="diceBox">
                <div class="wood-ring"></div>
                <span class="digit" id="diceDigit">1</span>
            </div>
            <button class="btn btn-roll" id="rollBtn" disabled>🎲 Бросить</button>
            <button class="btn btn-new" id="newGameBtn">🔄 Новая игра</button>
        </div>

        <div class="log-container">
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <!-- модалка портала -->
    <div class="modal-overlay" id="portalModal">
        <div class="modal-box">
            <h2>🌀 Портал!</h2>
            <div class="question">Куда попадёт фишка после портала и оставшихся ходов?</div>
            <div class="info-line">Текущая сторона: <span id="currentSideDisplay">—</span> | Осталось шагов: <span id="remainingStepsDisplay">0</span></div>
            <div class="color-options" id="portalColorOptions"></div>
            <div id="portalMessage" class="message"></div>
        </div>
    </div>

    <!-- модалка победы -->
    <div class="modal-overlay win-modal" id="winModal">
        <div class="modal-box">
            <h2>Поздравляю!</h2>
            <div class="star">⭐</div>
            <p style="color:#c8d4e6; font-size:18px;">Вы вернулись домой!</p>
            <button class="btn" id="modalNewGameBtn" style="display:inline-block;">Начать заново</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  ЗВУКИ (Web Audio)
        // ============================================================
        let audioCtx = null;

        function ensureAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Звук "пи-ик" (кнопка)
        function playClickSound() {
            try {
                const ctx = ensureAudio();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 1200;
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        // Звук "Цик!" (шаг фишки)
        function playMoveSound() {
            try {
                const ctx = ensureAudio();
                // Ударный компонент (квадратная волна)
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.value = 150;
                gain.gain.setValueAtTime(0.45, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);

                // Шумовой компонент для резкости
                const bufferSize = ctx.sampleRate * 0.05;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const gainNoise = ctx.createGain();
                gainNoise.gain.setValueAtTime(0.3, ctx.currentTime);
                gainNoise.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                noise.connect(gainNoise);
                gainNoise.connect(ctx.destination);
                noise.start(ctx.currentTime);
                noise.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        // Звук победы "там-там-та-та-там"
        function playWinSound() {
            try {
                const ctx = ensureAudio();
                const pattern = [1, 1, 0.5, 0.5, 1];
                const freqs = [200, 200, 250, 250, 200];
                let time = ctx.currentTime + 0.05;
                for (let i = 0; i < pattern.length; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freqs[i];
                    gain.gain.setValueAtTime(0.25, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15 * pattern[i]);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(time);
                    osc.stop(time + 0.15 * pattern[i]);
                    time += 0.15 * pattern[i] + 0.08;
                }
            } catch(e) {}
        }

        // ============================================================
        //  КОНФИГУРАЦИЯ
        // ============================================================
        const COLORS = [
            { name: "Красная", hex: "#e74c3c" },
            { name: "Оранжевая", hex: "#e67e22" },
            { name: "Жёлтая", hex: "#fff44f" },
            { name: "Зелёная", hex: "#2ecc71" },
            { name: "Синяя", hex: "#3498db" },
            { name: "Фиолетовая", hex: "#9b59b6" }
        ];
        const OPPOSITE_MAP = { 0:4, 4:0, 1:2, 2:1, 3:5, 5:3 };
        const SPIRAL_MAP = [
            [1,2,3],
            [8,9,4],
            [7,6,5]
        ];

        // ============================================================
        //  СОСТОЯНИЕ
        // ============================================================
        let state = {
            homeColorIndex: null,
            homeCell: 1,
            currentSideIndex: 0,
            currentCell: 1,
            throwsCount: 0,
            stepsCount: 0,
            isGameActive: false,
            isGameOver: false,
            isAnimating: false,
            waitingForPortal: false,
            portalRemainingSteps: 0,
            portalTargetIndex: null
        };

        // ============================================================
        //  DOM
        // ============================================================
        const gridEl = document.getElementById('grid');
        const logBox = document.getElementById('logBox');
        const diceBox = document.getElementById('diceBox');
        const diceDigit = document.getElementById('diceDigit');
        const rollBtn = document.getElementById('rollBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const homeSelector = document.getElementById('homeSelector');
        const homeDisplay = document.getElementById('homeDisplay');
        const currentDisplay = document.getElementById('currentDisplay');
        const throwsDisplay = document.getElementById('throwsDisplay');
        const stepsDisplay = document.getElementById('stepsDisplay');
        const winModal = document.getElementById('winModal');
        const modalNewGameBtn = document.getElementById('modalNewGameBtn');
        const portalModal = document.getElementById('portalModal');
        const portalColorOptions = document.getElementById('portalColorOptions');
        const portalMessage = document.getElementById('portalMessage');
        const currentSideDisplay = document.getElementById('currentSideDisplay');
        const remainingStepsDisplay = document.getElementById('remainingStepsDisplay');
        const portalEffect = document.getElementById('portalEffect');
        const portalSpinner = document.getElementById('portalSpinner');

        // ============================================================
        //  ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function writeLog(text) {
            logBox.innerHTML += text + '\n';
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateInfo() {
            const homeColor = state.homeColorIndex !== null ? COLORS[state.homeColorIndex].name : '—';
            homeDisplay.textContent = state.homeColorIndex !== null ? homeColor + ' 1' : '—';
            const curColor = COLORS[state.currentSideIndex].name;
            currentDisplay.textContent = curColor + ' ' + state.currentCell;
            throwsDisplay.textContent = state.throwsCount;
            stepsDisplay.textContent = state.stepsCount;
        }

        function adjustBrightness(hex, percent) {
            let r = parseInt(hex.slice(1,3), 16);
            let g = parseInt(hex.slice(3,5), 16);
            let b = parseInt(hex.slice(5,7), 16);
            r = Math.max(0, Math.min(255, r + percent));
            g = Math.max(0, Math.min(255, g + percent));
            b = Math.max(0, Math.min(255, b + percent));
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

        // ============================================================
        //  ОТРИСОВКА СЕТКИ С ПЕШКОЙ
        // ============================================================
        function renderGrid() {
            gridEl.innerHTML = '';
            const colorHex = COLORS[state.currentSideIndex].hex;
            const isHomeSide = (state.homeColorIndex !== null && state.currentSideIndex === state.homeColorIndex);

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const cellNumber = SPIRAL_MAP[r][c];
                    const div = document.createElement('div');
                    div.className = 'cell';
                    if (cellNumber === 9) div.classList.add('cell-center');
                    if (isHomeSide && cellNumber === 1) {
                        div.style.background = 'radial-gradient(circle at 30% 30%, #ffffff, #d0d0d0)';
                        div.style.color = '#222';
                        div.classList.add('cell-home');
                    } else {
                        const dark = adjustBrightness(colorHex, -30);
                        div.style.background = `radial-gradient(circle at 30% 30%, ${colorHex}, ${dark})`;
                        div.style.color = '#fff';
                    }
                    div.textContent = cellNumber;

                    // Добавляем пешку в текущую клетку
                    if (cellNumber === state.currentCell) {
                        div.classList.add('active');
                        const piece = document.createElement('span');
                        piece.className = 'piece';
                        piece.textContent = '♟'; // шахматная пешка
                        div.appendChild(piece);
                    }

                    gridEl.appendChild(div);
                }
            }
        }

        // Анимация появления пешки (вызывать после renderGrid)
        function animatePiece() {
            const piece = document.querySelector('.cell.active .piece');
            if (piece) {
                piece.classList.remove('piece-enter');
                // форсируем reflow
                void piece.offsetWidth;
                piece.classList.add('piece-enter');
                setTimeout(() => {
                    piece.classList.remove('piece-enter');
                }, 400);
            }
        }

        function setGameActive(active) {
            state.isGameActive = active;
            rollBtn.disabled = !active || state.isAnimating || state.waitingForPortal;
            document.querySelectorAll('.color-ball').forEach(ball => {
                ball.classList.toggle('disabled', state.isGameActive || state.isGameOver);
            });
        }

        function showWinModal() {
            winModal.classList.add('active');
            state.isGameOver = true;
            setGameActive(false);
            newGameBtn.style.display = 'inline-block';
            rollBtn.disabled = true;
            playWinSound();
        }
        function hideWinModal() { winModal.classList.remove('active'); }

        // ============================================================
        //  АНИМАЦИЯ ШАРА-КУБИКА
        // ============================================================
        let currentDiceValue = 1;

        function setDiceValue(val) {
            currentDiceValue = Math.min(6, Math.max(1, val));
            diceDigit.textContent = currentDiceValue;
        }

        function animateDiceRoll(finalValue, callback) {
            if (state.isAnimating) return;
            state.isAnimating = true;
            rollBtn.disabled = true;

            diceBox.classList.add('spinning');

            const startTime = performance.now();
            const duration = 2000;
            let currentVal = currentDiceValue;

            function step() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                let interval;
                if (progress < 0.3) {
                    const p = progress / 0.3;
                    interval = 150 - p * 120;
                } else if (progress < 0.5) {
                    interval = 30;
                } else if (progress < 0.85) {
                    const p = (progress - 0.5) / 0.35;
                    interval = 30 + p * 120;
                } else {
                    const p = (progress - 0.85) / 0.15;
                    interval = 150 + p * 70;
                }

                if (progress >= 1) {
                    setDiceValue(finalValue);
                    diceBox.classList.remove('spinning');
                    diceBox.classList.add('highlight');
                    setTimeout(() => {
                        diceBox.classList.remove('highlight');
                    }, 500);
                    state.isAnimating = false;
                    if (!state.isGameOver && state.isGameActive) {
                        rollBtn.disabled = false;
                    }
                    if (callback) callback();
                    return;
                }

                let newVal;
                do {
                    newVal = Math.floor(Math.random() * 6) + 1;
                } while (newVal === currentVal && elapsed < duration - 100);
                setDiceValue(newVal);
                currentVal = newVal;

                setTimeout(step, interval);
            }

            step();
        }

        // ============================================================
        //  ПОРТАЛ
        // ============================================================
        function showPortalModal(remaining) {
            portalEffect.classList.add('active');
            portalSpinner.classList.add('active');
            setTimeout(() => {
                portalModal.classList.add('active');
                state.waitingForPortal = true;
                rollBtn.disabled = true;
                currentSideDisplay.textContent = COLORS[state.currentSideIndex].name;
                remainingStepsDisplay.textContent = remaining;
                portalMessage.textContent = '';
                portalMessage.className = 'message';
                portalColorOptions.innerHTML = '';
                COLORS.forEach((color, index) => {
                    const socket = document.createElement('div');
                    socket.className = 'color-socket';
                    const ball = document.createElement('div');
                    ball.className = 'color-ball';
                    ball.style.backgroundColor = color.hex;
                    ball.textContent = '1';
                    ball.dataset.index = index;
                    ball.addEventListener('click', () => handlePortalChoice(index));
                    socket.appendChild(ball);
                    portalColorOptions.appendChild(socket);
                });
                const afterPortalIndex = OPPOSITE_MAP[state.currentSideIndex];
                const targetIndex = (afterPortalIndex + (remaining - 1)) % COLORS.length;
                state.portalTargetIndex = targetIndex;
            }, 500);
        }

        function hidePortalModal() {
            portalModal.classList.remove('active');
            portalEffect.classList.remove('active');
            portalSpinner.classList.remove('active');
            state.waitingForPortal = false;
            if (!state.isGameOver && state.isGameActive) {
                rollBtn.disabled = false;
            }
        }

        // ===== ИСПРАВЛЕННАЯ ФУНКЦИЯ =====
        function handlePortalChoice(chosenIndex) {
            if (!state.waitingForPortal) return;
            const isCorrect = (chosenIndex === state.portalTargetIndex);
            portalMessage.textContent = isCorrect ? '✅ Верно!' : '❌ Неверно! Возврат домой.';
            portalMessage.className = 'message ' + (isCorrect ? 'correct' : 'wrong');
            document.querySelectorAll('#portalColorOptions .color-ball').forEach(el => {
                el.style.pointerEvents = 'none';
                el.style.opacity = '0.5';
            });
            setTimeout(() => {
                hidePortalModal();
                if (isCorrect) {
                    // Правильный ответ – переходим на целевую сторону, клетка 1
                    state.currentSideIndex = state.portalTargetIndex;
                    state.currentCell = 1;
                    writeLog('🌀 ПОРТАЛ → ' + COLORS[state.currentSideIndex].name + ' 1 (правильно)');
                    updateInfo();
                    renderGrid();
                    animatePiece();
                    playMoveSound();
                    // Проверяем, не стал ли этот переход финальным попаданием в дом
                    if (checkHomeReached()) return; // если дом – победа, игра завершена
                } else {
                    // Неправильный ответ – возвращаем в дом, но НЕ считаем это победой
                    state.currentSideIndex = state.homeColorIndex;
                    state.currentCell = 1;
                    writeLog('❌ Ошибка! Возврат в дом ' + COLORS[state.currentSideIndex].name + ' 1');
                    updateInfo();
                    renderGrid();
                    animatePiece();
                    playMoveSound();
                    // НЕ вызываем checkHomeReached() – игра продолжается
                }
                // Если игра не завершена и активна – разблокируем кнопку броска
                if (!state.isGameOver && state.isGameActive) {
                    rollBtn.disabled = false;
                }
            }, 1200);
        }

        function checkHomeReached() {
            if (state.homeColorIndex === null) return false;
            if (state.currentSideIndex === state.homeColorIndex && state.currentCell === 1) {
                state.isGameOver = true;
                writeLog('\n🏠🏠🏠 ДОМ НАЙДЕН! 🏠🏠🏠');
                showWinModal();
                return true;
            }
            return false;
        }

        // ============================================================
        //  ДВИЖЕНИЕ ФИШКИ
        // ============================================================
        async function moveSteps(count) {
            if (state.isAnimating) return;
            state.isAnimating = true;
            rollBtn.disabled = true;

            let stepsMade = 0;
            while (stepsMade < count && !state.isGameOver) {
                if (state.currentCell < 9) {
                    state.currentCell++;
                    stepsMade++;
                    writeLog(COLORS[state.currentSideIndex].name + ' ' + state.currentCell);
                    renderGrid();
                    updateInfo();
                    // Анимация пешки и звук
                    animatePiece();
                    playMoveSound();
                    await delay(400);
                    if (checkHomeReached()) {
                        state.isAnimating = false;
                        return;
                    }
                } else {
                    const remaining = count - stepsMade;
                    state.portalRemainingSteps = remaining;
                    showPortalModal(remaining);
                    state.isAnimating = false;
                    return;
                }
            }
            state.isAnimating = false;
            if (!state.isGameOver && state.isGameActive) {
                rollBtn.disabled = false;
            }
            updateInfo();
            renderGrid();
        }

        function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        // ============================================================
        //  БРОСОК КУБИКА
        // ============================================================
        async function rollDice() {
            if (!state.isGameActive || state.isGameOver || state.isAnimating || state.waitingForPortal) return;
            // Звук нажатия кнопки
            playClickSound();

            const diceResult = Math.floor(Math.random() * 6) + 1;
            state.throwsCount++;
            writeLog('\n======================');
            writeLog('🎲 Кубик: ' + diceResult);

            return new Promise((resolve) => {
                animateDiceRoll(diceResult, () => {
                    moveSteps(diceResult);
                    resolve();
                });
            });
        }

        // ============================================================
        //  ВЫБОР ДОМА И СБРОС
        // ============================================================
        function selectHome(index) {
            if (state.isGameActive || state.isGameOver || state.isAnimating) return;
            state.homeColorIndex = index;
            state.currentSideIndex = index;
            state.currentCell = 1;
            state.throwsCount = 0;
            state.stepsCount = 0;
            state.isGameOver = false;
            state.waitingForPortal = false;
            state.portalRemainingSteps = 0;
            state.portalTargetIndex = null;

            document.querySelectorAll('.color-socket').forEach((socket, i) => {
                socket.classList.toggle('selected-socket', i === index);
            });
            document.querySelectorAll('.color-ball').forEach((ball, i) => {
                ball.classList.toggle('selected', i === index);
            });

            newGameBtn.style.display = 'none';
            hideWinModal();
            hidePortalModal();
            setGameActive(true);
            rollBtn.disabled = false;
            logBox.innerHTML = '';
            writeLog('СТАРТ: ' + COLORS[index].name + ' 1');
            writeLog('🏠 ДОМ = ' + COLORS[index].name + ' 1 (белая клетка)');
            setDiceValue(1);
            updateInfo();
            renderGrid();
            // Пешка на старте без анимации
        }

        function resetGame() {
            state.isGameActive = false;
            state.isGameOver = false;
            state.isAnimating = false;
            state.waitingForPortal = false;
            state.portalRemainingSteps = 0;
            state.portalTargetIndex = null;
            state.throwsCount = 0;
            state.stepsCount = 0;
            state.currentSideIndex = state.homeColorIndex !== null ? state.homeColorIndex : 0;
            state.currentCell = 1;

            setGameActive(false);
            newGameBtn.style.display = 'none';
            hideWinModal();
            hidePortalModal();
            rollBtn.disabled = true;
            logBox.innerHTML = '';
            writeLog('Выберите цвет дома (нажмите на шарик)');
            setDiceValue(1);
            updateInfo();
            renderGrid();
            document.querySelectorAll('.color-socket').forEach(socket => socket.classList.remove('selected-socket'));
            document.querySelectorAll('.color-ball').forEach(ball => {
                ball.classList.remove('disabled');
                ball.classList.remove('selected');
            });
            state.homeColorIndex = null;
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        function initUI() {
            COLORS.forEach((color, index) => {
                const socket = document.createElement('div');
                socket.className = 'color-socket';
                const ball = document.createElement('div');
                ball.className = 'color-ball';
                ball.style.backgroundColor = color.hex;
                ball.textContent = '1';
                ball.dataset.index = index;
                ball.addEventListener('click', () => selectHome(index));
                socket.appendChild(ball);
                homeSelector.appendChild(socket);
            });

            rollBtn.addEventListener('click', rollDice);
            newGameBtn.addEventListener('click', resetGame);
            modalNewGameBtn.addEventListener('click', resetGame);
            resetGame();
        }
        document.addEventListener('DOMContentLoaded', initUI);
    </script>
</body>
</html>
