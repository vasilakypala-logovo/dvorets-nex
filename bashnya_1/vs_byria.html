<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ВЕТЕР СТРАНСТВИЙ (буря и телепорт)</title>
<style>
:root {
  --bg1: #0d1319;
  --bg2: #17212b;
  --gold: #e3c56c;
  --gold2: #b78634;
  --text: #eadfc4;
  --muted: #b6a98a;
  --node: #26313e;
  --node2: #18212b;
  --reach: #9ed3ff;
  --me: #e2c06f;
  --nex: #8fd0ff;
  --sunGlow: rgba(255, 214, 102, 0.55);
  --sunCore: #fff1a8;
  --sunMid: #e4bc57;
  --sunEdge: #644a1a;
  --line: rgba(255,255,255,0.05);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 28%, #273341 0%, #151d26 42%, #0a0f14 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 520px;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 6px 10px;
  transform-origin: center;
}

/* --- Шапка --- */
.panel {
  background: linear-gradient(to bottom, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  box-shadow: 0 18px 44px rgba(0,0,0,0.35);
  padding: 8px 12px;
}

h1 {
  margin: 0 0 2px;
  font-weight: normal;
  letter-spacing: 1.2px;
  font-size: 1.4rem;
}

.subtitle {
  color: var(--muted);
  margin-bottom: 6px;
  line-height: 1.2;
  font-size: 0.75rem;
}

/* --- Игровое поле --- */
.board-wrap {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.035), rgba(255,255,255,0.01)),
    linear-gradient(to bottom, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  padding: 6px;
  flex: 1 1 auto;
}

.fog-layer {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.035), transparent 28%),
    radial-gradient(circle at 77% 24%, rgba(255,255,255,0.03), transparent 30%),
    radial-gradient(circle at 68% 72%, rgba(255,255,255,0.026), transparent 32%),
    radial-gradient(circle at 24% 76%, rgba(255,255,255,0.024), transparent 28%);
  pointer-events: none;
  z-index: 1;
}

svg.links {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.grid {
  position: relative;
  width: 100%;
  height: 340px;
  z-index: 2;
}

.node {
  position: absolute;
  width: 48px;
  height: 48px;
  margin-left: -24px;
  margin-top: -24px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.14);
  background:
    radial-gradient(circle at 35% 35%, #465261 0%, var(--node) 46%, var(--node2) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d7ccb1;
  font-size: 12px;
  user-select: none;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.node.reachable {
  border-color: var(--reach);
  box-shadow: 0 0 18px rgba(158, 211, 255, 0.36);
  cursor: pointer;
}

.node.reachable:hover {
  transform: scale(1.09);
}

.node.sun {
  width: 60px;
  height: 60px;
  margin-left: -30px;
  margin-top: -30px;
  background:
    radial-gradient(circle at 35% 35%, var(--sunCore) 0%, var(--sunMid) 50%, var(--sunEdge) 100%);
  border-color: rgba(255, 228, 147, 0.92);
  color: #2b1d05;
  font-weight: bold;
  font-size: 16px;
  box-shadow:
    0 0 18px rgba(255, 216, 120, 0.42),
    0 0 34px var(--sunGlow),
    0 0 58px rgba(255, 202, 79, 0.22);
  animation: sunPulse 2.4s ease-in-out infinite;
}

.node.sun.reachable {
  border-color: #fff2b8;
  box-shadow:
    0 0 22px rgba(255, 228, 147, 0.7),
    0 0 42px rgba(255, 214, 102, 0.62),
    0 0 72px rgba(255, 206, 89, 0.28);
}

.node.me {
  background:
    radial-gradient(circle at 35% 35%, #f4e1a1 0%, var(--me) 45%, #7a5e27 100%);
  color: #1b1307;
  font-weight: bold;
  border-color: rgba(255, 235, 186, 0.84);
  box-shadow: 0 0 18px rgba(226, 192, 111, 0.34);
}

.node.nex {
  background:
    radial-gradient(circle at 35% 35%, #d7f1ff 0%, var(--nex) 45%, #2d5875 100%);
  color: #08141b;
  font-weight: bold;
  border-color: rgba(208, 237, 255, 0.86);
  box-shadow: 0 0 18px rgba(143, 208, 255, 0.34);
}

.node.me.sun {
  background:
    radial-gradient(circle at 35% 35%, #fff5c8 0%, #f0cf75 45%, #9a7123 100%);
  color: #221302;
  box-shadow:
    0 0 22px rgba(255, 227, 138, 0.7),
    0 0 48px rgba(255, 210, 96, 0.55);
}

.node.nex.sun {
  background:
    radial-gradient(circle at 35% 35%, #eef9ff 0%, #b7deff 42%, #5a8fb7 100%);
  color: #07131c;
  box-shadow:
    0 0 22px rgba(209, 239, 255, 0.7),
    0 0 48px rgba(154, 219, 255, 0.45);
}

.node.storm, .node.teleport {
  border-color: rgba(255,255,255,0.18);
  box-shadow: none;
}

.node.special {
  color: #cfc6a8;
  font-weight: normal;
}

.node.storm.reachable,
.node.teleport.reachable {
  border-color: var(--reach);
  box-shadow: 0 0 18px rgba(158, 211, 255, 0.36);
}

.legend {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}

.legend span::before {
  content: "●";
  margin-right: 3px;
}

.legend .l-me::before { color: var(--me); }
.legend .l-nex::before { color: var(--nex); }
.legend .l-sun::before { color: var(--sunMid); }
.legend .l-reach::before { color: var(--reach); }

/* --- Нижняя панель: компас + кнопки --- */
.side {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.bottom-panel {
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 10px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 20px;
  padding: 8px 8px;
}

.compass-wrapper {
  flex: 0 0 auto;
}

.compass {
  position: relative;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 4px solid var(--gold2);
  background:
    radial-gradient(circle at center, #253241 0%, #161e28 58%, #0e141b 100%);
  box-shadow:
    0 0 0 2px var(--gold) inset,
    0 0 16px rgba(0,0,0,0.3);
}

.ring {
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 1px solid rgba(234,223,193,0.22);
}

.label {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 22px;
  margin-left: -11px;
  margin-top: -8px;
  text-align: center;
  color: #ebdcaf;
  font-weight: bold;
  text-shadow: 0 0 6px rgba(0,0,0,0.55);
  font-size: 10px;
}

.needle-wrap {
  position: absolute;
  inset: 0;
  transition: transform 1.35s cubic-bezier(0.2, 0.85, 0.2, 1);
}

.needle {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 64px;
  transform: translate(-50%, -100%);
  clip-path: polygon(50% 0%, 100% 100%, 50% 84%, 0% 100%);
  background: linear-gradient(to bottom, #e85d52 0%, #9d251d 100%);
}

.needle-back {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 50px;
  transform: translate(-50%, 0);
  clip-path: polygon(50% 100%, 100% 0%, 50% 16%, 0% 0%);
  background: linear-gradient(to top, #d8c79f 0%, #7f8790 100%);
}

.center-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--gold);
  z-index: 5;
}

.wind-name {
  text-align: center;
  margin-top: 4px;
  font-size: 14px;
}

/* ----- КНОПКИ (увеличены) ----- */
.btn-group-left, .btn-group-right {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1 1 0;
  min-width: 60px;
}

.btn-group-left {
  align-items: stretch;
}
.btn-group-right {
  align-items: stretch;
}

.btn {
  border: none;
  border-radius: 999px;
  padding: 12px 8px;
  font-size: 14px;
  font-weight: bold;
  color: #17120b;
  background: linear-gradient(to bottom, #e8ce92 0%, #b88c43 100%);
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  width: 100%;
  text-align: center;
  min-height: 48px;
  cursor: pointer;
  line-height: 1.2;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Карточки статуса и футер */
.card {
  padding: 4px 10px;
  border-radius: 14px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.04);
}

.status {
  line-height: 1.3;
  font-size: 13px;
  min-height: 2.4em;
}

.win {
  color: #ffe0b7;
  font-size: 18px;
}

.foot {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.2;
  text-align: center;
}

/* Информация о раунде и ходе — в шапке */
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.top-row .info-item {
  display: flex;
  gap: 12px;
}
.small { color: var(--muted); font-size: 12px; }
.value { font-size: 16px; color: var(--text); }

@keyframes sunPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

/* ---------- Адаптив для очень маленьких экранов ---------- */
@media (max-width: 480px) {
  .app { max-width: 100%; padding: 4px 6px; }
  .panel { padding: 6px 10px; border-radius: 16px; }
  h1 { font-size: 1.2rem; }
  .subtitle { font-size: 0.65rem; }
  .grid { height: 260px; }
  .node { width: 36px; height: 36px; margin-left: -18px; margin-top: -18px; font-size: 9px; }
  .node.sun { width: 46px; height: 46px; margin-left: -23px; margin-top: -23px; font-size: 13px; }
  .compass { width: 130px; height: 130px; border-width: 3px; }
  .ring { inset: 8px; }
  .label { font-size: 8px; width: 18px; margin-left: -9px; margin-top: -6px; }
  .needle { height: 52px; width: 5px; }
  .needle-back { height: 40px; width: 4px; }
  .center-dot { width: 10px; height: 10px; }
  .wind-name { font-size: 12px; }
  .btn { 
    font-size: 12px; 
    padding: 10px 4px; 
    min-height: 40px; 
  }
  .small { font-size: 10px; }
  .value { font-size: 14px; }
  .status { font-size: 12px; }
  .foot { font-size: 10px; }
}

@media (max-width: 380px) {
  .grid { height: 200px; }
  .node { width: 28px; height: 28px; margin-left: -14px; margin-top: -14px; font-size: 7px; }
  .node.sun { width: 36px; height: 36px; margin-left: -18px; margin-top: -18px; font-size: 10px; }
  .compass { width: 100px; height: 100px; border-width: 3px; }
  .ring { inset: 6px; }
  .label { font-size: 7px; width: 14px; margin-left: -7px; margin-top: -5px; }
  .needle { height: 40px; width: 4px; }
  .needle-back { height: 32px; width: 3px; }
  .center-dot { width: 8px; height: 8px; }
  .btn { 
    font-size: 10px; 
    padding: 8px 2px; 
    min-height: 34px; 
  }
}
</style>
</head>
<body>
<div class="app" id="appContainer">
  <div class="panel">
    <div class="top-row">
      <h1 style="margin:0;">ВЕТЕР СТРАНСТВИЙ</h1>
      <div class="info-item">
        <div><span class="small">Раунд</span><br><span class="value" id="roundText">1</span></div>
        <div><span class="small">Ход</span><br><span class="value" id="turnText">ветер</span></div>
      </div>
    </div>
    <div class="subtitle">Два странника. Один светящийся узел в центре.</div>

    <div class="board-wrap">
      <svg class="links" id="linksSvg"></svg>
      <div class="fog-layer"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="legend">
      <span class="l-me">Я</span>
      <span class="l-nex">Некс</span>
      <span class="l-sun">☀</span>
      <span class="l-reach">доступно</span>
    </div>
  </div>

  <!-- Нижняя панель: компас + кнопки -->
  <div class="bottom-panel">
    <div class="btn-group-left">
      <button class="btn" id="spinBtn">Пустить ветер</button>
    </div>

    <div class="compass-wrapper">
      <div class="compass">
        <div class="ring"></div>
        <div class="label" style="transform: translate(-50%, -50%) translateY(-64px);">С</div>
        <div class="label" style="transform: translate(-50%, -50%) translate(46px, -46px);">СВ</div>
        <div class="label" style="transform: translate(-50%, -50%) translateX(64px);">В</div>
        <div class="label" style="transform: translate(-50%, -50%) translate(46px, 46px);">ЮВ</div>
        <div class="label" style="transform: translate(-50%, -50%) translateY(64px);">Ю</div>
        <div class="label" style="transform: translate(-50%, -50%) translate(-46px, 46px);">ЮЗ</div>
        <div class="label" style="transform: translate(-50%, -50%) translateX(-64px);">З</div>
        <div class="label" style="transform: translate(-50%, -50%) translate(-46px, -46px);">СЗ</div>
        <div class="needle-wrap" id="needleWrap">
          <div class="needle"></div>
          <div class="needle-back"></div>
        </div>
        <div class="center-dot"></div>
      </div>
      <div class="wind-name" id="windText">Ветер ждёт</div>
    </div>

    <div class="btn-group-right">
      <button class="btn" id="skipBtn">Пропустить</button>
      <button class="btn" id="restartBtn">Заново</button>
    </div>
  </div>

  <!-- Статус и футер -->
  <div class="card status" id="statusText">
    Нажмите <strong>«Пустить ветер»</strong>.<br>
    Шаг — строго на один соседний узел.
  </div>
  <div class="foot">
    <strong>Б</strong> — буря (возврат), <strong>Т</strong> — телепорт.
  </div>
</div>

<script>
// ===== ЗВУКОВАЯ СИСТЕМА =====
const SoundFX = {
  _ctx: null,
  _init() {
    if (!this._ctx) {
      this._ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return this._ctx;
  },
  
  // Короткий щелчок / пик (для ходов)
  click(volume = 0.3, freq = 800, duration = 0.06) {
    try {
      const ctx = this._init();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) { /* игнорируем */ }
  },
  
  // Жужжание компаса (ветер)
  buzz(volume = 0.15, duration = 0.8) {
    try {
      const ctx = this._init();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + duration * 0.6);
      osc.frequency.linearRampToValueAtTime(80, ctx.currentTime + duration);
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) { /* игнорируем */ }
  },
  
  // Бульканье (телепорт)
  bloop(volume = 0.25, pitch = 500) {
    try {
      const ctx = this._init();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(pitch * 0.6, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(pitch * 1.4, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(volume * 0.8, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.15);
      
      // Второй бульк чуть позже
      setTimeout(() => {
        try {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(pitch * 0.8, ctx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(pitch * 1.6, ctx.currentTime + 0.1);
          gain2.gain.setValueAtTime(volume * 0.6, ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
          osc2.start(ctx.currentTime);
          osc2.stop(ctx.currentTime + 0.12);
        } catch(e) {}
      }, 150);
    } catch(e) { /* игнорируем */ }
  },
  
  // Победа - торжественный звук
  win(volume = 0.2) {
    try {
      const ctx = this._init();
      const notes = [523, 659, 784, 1047];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          try {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume * (1 - i * 0.1), ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
          } catch(e) {}
        }, i * 120);
      });
    } catch(e) { /* игнорируем */ }
  }
};

const SIZE = 5;
const SUN = { x: 2, y: 2 };

const gridEl = document.getElementById("grid");
const linksSvg = document.getElementById("linksSvg");
const needleWrap = document.getElementById("needleWrap");
const windText = document.getElementById("windText");
const statusText = document.getElementById("statusText");
const turnText = document.getElementById("turnText");
const roundText = document.getElementById("roundText");
const spinBtn = document.getElementById("spinBtn");
const skipBtn = document.getElementById("skipBtn");
const restartBtn = document.getElementById("restartBtn");
const appContainer = document.getElementById("appContainer");

const directions = [
  { code: "N", name: "Север", short: "С", dx: 0, dy: -1, angle: 0 },
  { code: "NE", name: "Северо-восток", short: "СВ", dx: 1, dy: -1, angle: 45 },
  { code: "E", name: "Восток", short: "В", dx: 1, dy: 0, angle: 90 },
  { code: "SE", name: "Юго-восток", short: "ЮВ", dx: 1, dy: 1, angle: 135 },
  { code: "S", name: "Юг", short: "Ю", dx: 0, dy: 1, angle: 180 },
  { code: "SW", name: "Юго-запад", short: "ЮЗ", dx: -1, dy: 1, angle: 225 },
  { code: "W", name: "Запад", short: "З", dx: -1, dy: 0, angle: 270 },
  { code: "NW", name: "Северо-запад", short: "СЗ", dx: -1, dy: -1, angle: 315 }
];

const STARTS = {
  me: { x: 0, y: 4 },
  nex: { x: 4, y: 0 }
};

const STORMS = [
  { x: 1, y: 2 },
  { x: 3, y: 2 }
];

const TELEPORTS = [
  { x: 0, y: 3 },
  { x: 4, y: 1 }
];

function isStorm(x, y) {
  return STORMS.some(p => p.x === x && p.y === y);
}

function isTeleport(x, y) {
  return TELEPORTS.some(p => p.x === x && p.y === y);
}

function getTeleportTarget(x, y) {
  if (x === 0 && y === 3) return { x: 4, y: 1 };
  if (x === 4 && y === 1) return { x: 0, y: 3 };
  return { x, y };
}

function applySpecialNodeEffect(which, pos) {
  if (isStorm(pos.x, pos.y)) {
    return {
      pos: { ...STARTS[which] },
      message: `Буря унесла ${which === "me" ? "вас" : "Некса"} к исходной точке.`,
      isStorm: true
    };
  }

  if (isTeleport(pos.x, pos.y)) {
    const target = getTeleportTarget(pos.x, pos.y);
    SoundFX.bloop(0.3, 400); // бульканье при телепорте
    return {
      pos: target,
      message: `Телепорт перебросил ${which === "me" ? "вас" : "Некса"} на противоположную сторону.`,
      isTeleport: true
    };
  }

  return { pos, message: "", isStorm: false, isTeleport: false };
}

let nodes = [];
let me = { x: 0, y: 4 };
let nex = { x: 4, y: 0 };
let phase = "needWind";
let activeWind = null;
let currentActor = null;
let reachable = [];
let rotation = 0;
let round = 1;
let winner = null;

// Масштабирование для вертикального влезания
function fitApp() {
  const app = appContainer;
  const vh = window.innerHeight;
  const vw = window.innerWidth;

  app.style.transform = 'scale(1)';
  app.style.transformOrigin = 'center';

  const rect = app.getBoundingClientRect();
  const appHeight = rect.height;
  const appWidth = rect.width;

  const scaleX = (vw - 16) / appWidth;
  const scaleY = (vh - 16) / appHeight;
  let scale = Math.min(scaleX, scaleY, 1);

  if (scale < 1) {
    app.style.transform = `scale(${scale})`;
  } else {
    app.style.transform = 'scale(1)';
  }
}

function inBounds(x, y) {
  return x >= 0 && x < SIZE && y >= 0 && y < SIZE;
}

function setStatus(html) {
  statusText.innerHTML = html;
}

function initNodes() {
  nodes = [];
  const width = gridEl.clientWidth;
  const height = gridEl.clientHeight;
  const stepX = width / (SIZE + 1);
  const stepY = height / (SIZE + 1);

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      nodes.push({ x, y, px: stepX * (x + 1), py: stepY * (y + 1) });
    }
  }
}

function getNodeAt(x, y) {
  return nodes.find(n => n.x === x && n.y === y);
}

function getVisualAngle(dir) {
  const center = getNodeAt(2, 2);
  const target = getNodeAt(2 + dir.dx, 2 + dir.dy);
  if (!center || !target) return dir.angle;

  const vx = target.px - center.px;
  const vy = target.py - center.py;
  const deg = Math.atan2(vx, -vy) * 180 / Math.PI;
  return (deg + 360) % 360;
}

function drawLinks() {
  const width = gridEl.clientWidth;
  const height = gridEl.clientHeight;
  linksSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  let lines = "";
  for (const node of nodes) {
    for (const dir of directions) {
      const nx = node.x + dir.dx;
      const ny = node.y + dir.dy;
      if (!inBounds(nx, ny)) continue;
      if (nx < node.x || (nx === node.x && ny < node.y)) continue;
      const other = getNodeAt(nx, ny);
      lines += `<line x1="${node.px}" y1="${node.py}" x2="${other.px}" y2="${other.py}" stroke="${getComputedStyle(document.documentElement).getPropertyValue('--line').trim()}" stroke-width="1" />`;
    }
  }
  linksSvg.innerHTML = lines;
}

function getReachable(from, dir) {
  const nx = from.x + dir.dx;
  const ny = from.y + dir.dy;
  return inBounds(nx, ny) ? [{ x: nx, y: ny }] : [];
}

function isReachable(x, y) {
  return reachable.some(p => p.x === x && p.y === y);
}

function isSun(x, y) {
  return x === SUN.x && y === SUN.y;
}

function drawBoard() {
  gridEl.innerHTML = "";

  for (const node of nodes) {
    const div = document.createElement("div");
    div.className = "node";
    div.style.left = `${node.px}px`;
    div.style.top = `${node.py}px`;

    const meHere = me.x === node.x && me.y === node.y;
    const nexHere = nex.x === node.x && nex.y === node.y;
    const sunHere = isSun(node.x, node.y);

    if (sunHere) div.classList.add("sun");
    if (meHere) div.classList.add("me");
    if (nexHere) div.classList.add("nex");

    if (meHere) {
      div.textContent = "Я";
    } else if (nexHere) {
      div.textContent = "N";
    } else if (sunHere) {
      div.textContent = "☀";
    } else if (isStorm(node.x, node.y)) {
      div.textContent = "Б";
      div.classList.add("storm", "special");
    } else if (isTeleport(node.x, node.y)) {
      div.textContent = "Т";
      div.classList.add("teleport", "special");
    } else {
      div.textContent = `${node.x + 1}:${node.y + 1}`;
    }

    if (!meHere && !nexHere && isReachable(node.x, node.y)) {
      div.classList.add("reachable");
      div.addEventListener("click", () => moveCurrentPlayer(node.x, node.y));
    }

    gridEl.appendChild(div);
  }
}

function updateInfo() {
  roundText.textContent = round;

  if (phase === "needWind") turnText.textContent = currentActor === "nex" ? "Некс" : "Я";
  if (phase === "meTurn") turnText.textContent = "Я";
  if (phase === "nexTurn") turnText.textContent = "Некс";
  if (phase === "gameOver") turnText.textContent = winner || "конец";

  spinBtn.disabled = phase !== "needWind";
  skipBtn.disabled = !(phase === "meTurn" || phase === "nexTurn");
}

function actorData(which) {
  return which === "me" ? me : nex;
}

function actorName(which) {
  return which === "me" ? "Вы" : "Некс";
}

function actorDisplay(which) {
  return which === "me" ? "Я" : "Некс";
}

function finishGame(which) {
  winner = actorDisplay(which);
  reachable = [];
  phase = "gameOver";
  drawBoard();
  updateInfo();
  SoundFX.win(0.25);
  setStatus(`<div class="win">${actorName(which)} занял место под солнцем!</div>Игра завершена.`);
}

function beginActorTurn(which) {
  if (phase === "gameOver") return;

  currentActor = which;
  activeWind = null;
  reachable = [];
  phase = "needWind";
  windText.textContent = `Ветер ждёт ${which === "me" ? "вас" : "Некса"}`;
  setStatus(`Сейчас ветер выбирает путь для <strong>${actorName(which)}</strong>.<br>Нажмите <strong>«Пустить ветер»</strong>.`);
  drawBoard();
  updateInfo();
}

function nextWind() {
  if (phase !== "needWind" || winner) return;

  // Звук вращения компаса
  SoundFX.buzz(0.12, 0.6);

  activeWind = directions[Math.floor(Math.random() * directions.length)];
  const targetAngle = getVisualAngle(activeWind);
  const currentAngle = ((rotation % 360) + 360) % 360;
  const delta = ((targetAngle - currentAngle) + 360) % 360;
  rotation += 720 + delta;
  needleWrap.style.transform = `rotate(${rotation}deg)`;
  windText.textContent = `${activeWind.name} (${activeWind.short})`;

  const actor = actorData(currentActor);
  reachable = getReachable(actor, activeWind);
  phase = currentActor === "me" ? "meTurn" : "nexTurn";

  if (reachable.length === 0) {
    drawBoard();
    updateInfo();
    setStatus(`Ветер для <strong>${actorName(currentActor)}</strong>: <strong>${activeWind.name}</strong>.<br>Но хода в этом направлении нет.`);

    setTimeout(() => {
      if (phase === "gameOver") return;
      advanceTurnAfterNoMove();
    }, 500);
    return;
  }

  drawBoard();
  updateInfo();
  setStatus(`Ветер для <strong>${actorName(currentActor)}</strong>: <strong>${activeWind.name}</strong>.<br>Можно пройти на один подсвеченный узел.`);
}

function moveCurrentPlayer(x, y) {
  if (!isReachable(x, y)) return;
  if (phase !== "meTurn" && phase !== "nexTurn") return;

  // Звук шага (пик/щелчок)
  SoundFX.click(0.2, 700 + Math.random() * 300, 0.05);

  let specialMessage = "";
  let isSpecial = false;

  if (currentActor === "me") {
    me = { x, y };
    const effect = applySpecialNodeEffect("me", me);
    me = effect.pos;
    specialMessage = effect.message;
    isSpecial = effect.isTeleport || effect.isStorm;

    drawBoard();
    if (isSun(me.x, me.y)) {
      finishGame("me");
      return;
    }
    proceedAfterMove(specialMessage, isSpecial);
    return;
  }

  nex = { x, y };
  const effect = applySpecialNodeEffect("nex", nex);
  nex = effect.pos;
  specialMessage = effect.message;
  isSpecial = effect.isTeleport || effect.isStorm;

  drawBoard();
  if (isSun(nex.x, nex.y)) {
    finishGame("nex");
    return;
  }
  proceedAfterMove(specialMessage, isSpecial);
}

function proceedAfterMove(extraMessage = "", isSpecial = false) {
  reachable = [];

  if (currentActor === "me") {
    const prefix = extraMessage ? `${extraMessage}<br>` : "";
    setStatus(`${prefix}Ваш шаг сделан.<br>Теперь ветер для <strong>Некса</strong>.`);
    beginActorTurn("nex");
  } else {
    round++;
    const prefix = extraMessage ? `${extraMessage}<br>` : "";
    setStatus(`${prefix}Шаг Некса сделан.<br>Раунд завершён. Теперь ветер для <strong>вас</strong>.`);
    beginActorTurn("me");
  }
}

function advanceTurnAfterNoMove() {
  reachable = [];
  if (currentActor === "me") {
    beginActorTurn("nex");
  } else {
    round++;
    beginActorTurn("me");
  }
}

function skipTurn() {
  if (phase !== "meTurn" && phase !== "nexTurn") return;

  const skipped = currentActor;
  reachable = [];

  if (skipped === "me") {
    SoundFX.click(0.15, 500, 0.04);
    setStatus(`Вы пропустили ход.<br>Теперь ветер для <strong>Некса</strong>.`);
    beginActorTurn("nex");
  } else {
    SoundFX.click(0.15, 400, 0.04);
    round++;
    setStatus(`Некс пропустил ход.<br>Раунд завершён. Теперь ветер для <strong>вас</strong>.`);
    beginActorTurn("me");
  }
}

function restartGame() {
  me = { x: 0, y: 4 };
  nex = { x: 4, y: 0 };
  phase = "needWind";
  activeWind = null;
  reachable = [];
  rotation = 0;
  round = 1;
  winner = null;
  currentActor = "me";
  needleWrap.style.transform = "rotate(0deg)";
  windText.textContent = "Ветер ждёт вас";
  setStatus(`Нажмите <strong>«Пустить ветер»</strong>.<br>Первый шаг — <strong>ваш</strong>. В центре сияет <strong>место под солнцем</strong>.`);
  drawBoard();
  updateInfo();
}

function setup() {
  initNodes();
  drawLinks();
  restartGame();
  fitApp();
}

spinBtn.addEventListener("click", nextWind);
skipBtn.addEventListener("click", skipTurn);
restartBtn.addEventListener("click", setup);
window.addEventListener("resize", () => {
  initNodes();
  drawLinks();
  drawBoard();
  fitApp();
});

setup();
</script>
</body>
</html>
