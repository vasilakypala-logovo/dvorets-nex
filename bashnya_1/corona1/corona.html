<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>КОРОНА ИГРА</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* Экран телефона */
#phone{
    position:relative;

    width:390px;
    height:844px;

    max-width:100vw;
    max-height:100vh;

    background:url("reka.jpg") center center no-repeat;
    background-size:cover;

    overflow:hidden;
}

/* Контейнер кнопок */
#menu{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:150px;
}

/* Кнопки */
.btn{
    width:70%;
    max-width:280px;

    padding:18px;

    text-align:center;
    text-decoration:none;

    font-size:32px;
    font-weight:bold;
    color:white;

    border:2px solid rgba(255,255,255,0.7);
    border-radius:18px;

    background:rgba(0,0,0,0.18);

    backdrop-filter:blur(2px);

    box-sizing:border-box;
}

.btn:active{
    transform:scale(0.97);
}

</style>

</head>

<body>

<div id="phone">

    <div id="menu">

        <a class="btn" href="cifri.htm">
            ЦИФРЫ
        </a>

        <a class="btn" href="slova.html">
            СЛОВА
        </a>

    </div>

</div>

</body>
</html>
