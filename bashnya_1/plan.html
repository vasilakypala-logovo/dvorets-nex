<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>САДОК ІГРАШОК</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Georgia, serif;
}

#garden{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

img {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}

/* Активні зони */
.zone{
    position:absolute;
    cursor:pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Текст центрується всередині зони */
}

/* Стиль підписів */
.zone .label {
    font-size: clamp(1.2rem, 3.5vw, 2.8rem);
    font-weight: bold;
    color: #fff9e6;
    text-shadow: 0 0 10px #ffd700, 0 0 20px #ffaa00, 0 0 40px #ff8800;
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1.2;
    pointer-events: none; /* щоб клік проходив на батьківський div */
    animation: glowPulse 2.5s ease-in-out infinite alternate;
}

/* Різні затримки для кожної зони, щоб мигали не синхронно */
.zone:nth-child(1) .label { animation-delay: 0s; }
.zone:nth-child(2) .label { animation-delay: 0.7s; }
.zone:nth-child(3) .label { animation-delay: 1.4s; }
.zone:nth-child(4) .label { animation-delay: 0.3s; }
.zone:nth-child(5) .label { animation-delay: 1.0s; }
.zone:nth-child(6) .label { animation-delay: 1.8s; }

@keyframes glowPulse {
    0% {
        text-shadow: 0 0 10px #ffd700, 0 0 20px #ffaa00, 0 0 40px #ff8800;
        opacity: 1;
    }
    100% {
        text-shadow: 0 0 20px #ffd700, 0 0 40px #ffaa00, 0 0 80px #ff6600;
        opacity: 0.6;
    }
}

/* Кнопка повернення */
.back{
    position:absolute;
    left:20px;
    bottom:20px;
    padding:10px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.3);
    background:rgba(0,0,0,0.45);
    color:white;
    text-decoration:none;
    letter-spacing:0.08em;
    font-size:13px;
    z-index:1000;
}
.back:hover{
    background:rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<div id="garden">

    <!-- Карта -->
    <img src="plan.png" alt="САДОК ІГРАШОК">


    <!-- ========================= -->
    <!-- АКТИВНІ ЗОНИ з підписами -->
    <!-- ========================= -->

    <!-- МАЛИНА ГРА -->
    <div class="zone"
         title="Малина"
         style="left:4%; top:28%; width:18%; height:30%;"
         onclick="go('index.html')">
        <span class="label">МАЛИНА<br>ГРА</span>
    </div>

    <!-- СТВОРИТИ ГРУ -->
    <div class="zone"
         title="Крижовник"
         style="left:24%; top:30%; width:15%; height:28%;"
         onclick="go('tityli.html')">
        <span class="label">СТВОРИТИ<br>ГРУ</span>
    </div>

    <!-- ВІТЕР БУРЯ -->
    <div class="zone"
         title="Яблуня"
         style="left:52%; top:20%; width:20%; height:30%;"
         onclick="go('veter.html')">
        <span class="label">ВІТЕР<br>БУРЯ</span>
    </div>

    <!-- ГРА В СЛОВА -->
    <div class="zone"
         title="Вишня"
         style="left:76%; top:30%; width:16%; height:28%;"
         onclick="go('corona1/corona.html')">
        <span class="label">ГРА В<br>СЛОВА</span>
    </div>

    <!-- БЕСІДКА -->
    <div class="zone"
         title="Бесідка"
         style="left:39%; top:40%; width:16%; height:24%;"
         onclick="go('besidka.htm')">
        <span class="label">БЕСІДКА</span>
    </div>

    <!-- БУДИНОЧОК -->
    <div class="zone"
         title="Будиночок"
         style="left:56%; top:55%; width:20%; height:25%;"
         onclick="go('budynochok.htm')">
        <span class="label">БУДИНОЧОК</span>
    </div>

    <!-- ПОВЕРНЕННЯ (не чіпаємо) -->
    <a class="back" href="../index.html">
        ПОВЕРНУТИСЯ ДО ПАЛАЦУ
    </a>

</div>

<script>
function go(file){
    window.location.href = file;
}
</script>

</body>
</html>
