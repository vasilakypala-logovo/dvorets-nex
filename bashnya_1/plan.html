<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>САДОК ІГРАШОК</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Georgia, serif;
}

#garden{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

img {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}

/* Активні зони */
.zone{
    position:absolute;
    cursor:pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Стиль підписів — зменшений удвічі */
.zone .label {
    font-size: clamp(0.6rem, 1.8vw, 1.4rem);
    font-weight: bold;
    color: #fff9e6;
    text-shadow: 0 0 8px #ffd700, 0 0 16px #ffaa00, 0 0 30px #ff8800;
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1.2;
    pointer-events: none;
    animation: glowPulse 2.5s ease-in-out infinite alternate;
}

/* Різні затримки для кожної зони */
.zone:nth-child(1) .label { animation-delay: 0s; }
.zone:nth-child(2) .label { animation-delay: 0.7s; }
.zone:nth-child(3) .label { animation-delay: 1.4s; }
.zone:nth-child(4) .label { animation-delay: 0.3s; }
.zone:nth-child(5) .label { animation-delay: 1.0s; }
.zone:nth-child(6) .label { animation-delay: 1.8s; }
/* Нові зони – додаткові затримки */
.zone:nth-child(7) .label { animation-delay: 0.5s; }
.zone:nth-child(8) .label { animation-delay: 1.2s; }
.zone:nth-child(9) .label { animation-delay: 0.9s; }
.zone:nth-child(10) .label { animation-delay: 1.6s; }
.zone:nth-child(11) .label { animation-delay: 0.4s; }
.zone:nth-child(12) .label { animation-delay: 1.1s; }
.zone:nth-child(13) .label { animation-delay: 1.7s; }

@keyframes glowPulse {
    0% {
        text-shadow: 0 0 8px #ffd700, 0 0 16px #ffaa00, 0 0 30px #ff8800;
        opacity: 1;
    }
    100% {
        text-shadow: 0 0 16px #ffd700, 0 0 30px #ffaa00, 0 0 60px #ff6600;
        opacity: 0.6;
    }
}

/* Кнопка повернення */
.back{
    position:absolute;
    left:20px;
    bottom:20px;
    padding:10px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.3);
    background:rgba(0,0,0,0.45);
    color:white;
    text-decoration:none;
    letter-spacing:0.08em;
    font-size:13px;
    z-index:1000;
}
.back:hover{
    background:rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<div id="garden">

    <!-- Карта -->
    <img src="plan.png" alt="САДОК ІГРАШОК">

    <!-- ========================= -->
    <!-- АКТИВНІ ЗОНИ з підписами -->
    <!-- ========================= -->

    <!-- ----- НОВА ЗОНА 1: ВУДКА НЕКСА (над МАЛИНОЮ) ----- -->
    <div class="zone"
         title="Вудка Некса"
         style="left:4%; top:12%; width:18%; height:18%;"
         onclick="go('udochka_neksa_v3.html')">
        <span class="label">ВУДКА<br>НЕКСА</span>
    </div>

    <!-- МАЛИНА ГРА -->
    <div class="zone"
         title="Малина"
         style="left:4%; top:28%; width:18%; height:30%;"
         onclick="go('index.html')">
        <span class="label">МАЛИНА<br>ГРА</span>
    </div>

    <!-- ===== НОВА ЗОНА: МАЛИНА (перехід до balkon.html) ===== -->
    <div class="zone"
         title="Малина"
         style="left:4%; top:55%; width:18%; height:20%;"
         onclick="go('oko/oko3.html')">
        <span class="label">ОКО</span>
    </div>

    <!-- ----- НОВА ЗОНА 2: КЛАССИКИ ----- -->
    <div class="zone"
         title="Классики"
         style="left:24%; top:14%; width:15%; height:18%;"
         onclick="go('klassiks.html')">
        <span class="label">МАТЕМАТИЧНІ<br>КЛАСИКИ</span>
    </div>

    <!-- СТВОРИТИ ГРУ -->
    <div class="zone"
         title="Крижовник"
         style="left:24%; top:30%; width:15%; height:28%;"
         onclick="go('tityli.html')">
        <span class="label">СТВОРИТИ<br>ГРУ</span>
    </div>

    <!-- ===== НОВА ЗОНА: СТВОРИТИ ГРУ (перехід до balkon2.html) ===== -->
    <div class="zone"
         title="Створити гру"
         style="left:24%; top:55%; width:15%; height:20%;"
         onclick="go('balkon2.html')">
        <span class="label">ЗОНА<br>2</span>
    </div>

    <!-- ----- НОВА ЗОНА 3: ФУТБОЛ (над ВІТЕР БУРЯ) ----- -->
    <div class="zone"
         title="футбол яблучний"
         style="left:52%; top:6%; width:20%; height:16%;"
         onclick="go('APL futbol.html')">
        <span class="label">ЯБЛУЧНИЙ<br>ФУТБОЛ</span>
    </div>

    <!-- ВІТЕР БУРЯ -->
    <div class="zone"
         title="Яблуня"
         style="left:52%; top:20%; width:20%; height:30%;"
         onclick="go('veter.html')">
        <span class="label">ВІТЕР<br>БУРЯ</span>
    </div>

    <!-- ----- НОВА ЗОНА 4: КВАКА (над ГРА В СЛОВА) ----- -->
    <div class="zone"
         title="КВАКА"
         style="left:76%; top:14%; width:16%; height:18%;"
         onclick="go('kvaka kuvaka.html')">
        <span class="label">КВАКА-КУВАКА</span>
    </div>

    <!-- ГРА В СЛОВА -->
    <div class="zone"
         title="Вишня"
         style="left:76%; top:30%; width:16%; height:28%;"
         onclick="go('corona1/corona.html')">
        <span class="label">ГРА В<br>СЛОВА</span>
    </div>

    <!-- ТУМАН -->
    <div class="zone"
         title="Бесідка"
         style="left:39%; top:40%; width:16%; height:24%;"
         onclick="go('KVadratniy.html')">
        <span class="label">ТУМАН</span>
    </div>

    <!-- ===== НОВА ЗОНА: ТУМАН (перехід до balkon3.html) ===== -->
    <div class="zone"
         title="Туман"
         style="left:39%; top:62%; width:16%; height:18%;"
         onclick="go('balkon3.html')">
        <span class="label">ЗОНА 3</span>
    </div>

    <!-- БУДИНОЧОК ТАВР РОЗПИС -->
    <div class="zone"
         title="Будиночок"
         style="left:56%; top:55%; width:20%; height:25%;"
         onclick="go('Tavrros v2format.html')">
        <span class="label">РОЗПИС ТАВР</span>
    </div>

    <!-- ПОВЕРНЕННЯ (не чіпаємо) -->
    <a class="back" href="../index.html">
        ПОВЕРНУТИСЯ ДО ПАЛАЦУ
    </a>

</div>

<script>
function go(file){
    window.location.href = file;
}
</script>

</body>
</html>
